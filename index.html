}

function bindDoc(){
  if(!D) return;
  const R=()=>render();
  document.querySelectorAll('.sect button[data-t]').forEach(b=>b.onclick=()=>{D.tab=b.dataset.t;R();});
  document.getElementById('dchiudi').onclick=()=>{voce='elenco';D=null;R();};
  document.getElementById('dcant').oninput=e=>D.cant=e.target.value;
  const sincro=()=>{const r=(D.tipo==='commesse'?DOCS:PREV).find(x=>x.n===D.n);
    if(r){r.data=D.data;r.lav=D.lav;r.cons=D.cons;}};
  document.getElementById('ddata').onchange=e=>{D.data=itData(e.target.value);sincro();R();};
  document.getElementById('dlav').onchange=e=>{
    D.lav=itData(e.target.value);
    if(D.cons&&isoData(D.cons)<e.target.value){D.cons=D.lav;avviso('La consegna non può precedere la lavorazione: l\u2019ho allineata.');}
    sincro();R();};
  document.getElementById('dcons').onchange=e=>{
    const iso=e.target.value;
    if(iso&&isoData(D.lav)&&iso<isoData(D.lav)) return avviso('<b>Data non valida</b> — la consegna non può precedere la lavorazione.');
    D.cons=itData(iso);sincro();R();};
  document.getElementById('dag').onchange=e=>D.agente=e.target.value;
  document.getElementById('dtec').onchange=e=>D.tecnico=e.target.value;
  document.getElementById('dcli').onclick=()=>cercaCliente(c=>{
    D.cli=c.nome; const r=(D.tipo==='commesse'?DOCS:PREV).find(x=>x.n===D.n); if(r) r.cli=c.nome;
    render(); avviso(`Cliente <b>${c.nome}</b> selezionato · listino ${c.listino}, sconto ${c.sconto}%.`);
  });
  const bm=document.getElementById('dstampa'), mn=document.getElementById('dmenu');
  bm.onclick=e=>{e.stopPropagation();mn.style.display=mn.style.display==='none'?'block':'none';};
  document.addEventListener('click',()=>{if(mn)mn.style.display='none';},{once:true});
  mn.querySelectorAll('.mi').forEach(d=>{
    d.onmouseenter=()=>d.style.background='var(--accent-soft)';
    d.onmouseleave=()=>d.style.background='';
    d.onclick=()=>{mn.style.display='none';
      if(d.dataset.m==='__conf'){sez='impostazioni';voce='stampe';render();return;}
      anteprimaStampa(d.dataset.m,D.n);};
  });

  const tt=document.getElementById('t_target');
  if(tt) tt.onchange=e=>{
    const merce=totDoc(), obiettivo=numIt(e.target.value);
    if(!isNaN(obiettivo)&&merce>0){ D.scontoFin=Math.max(0,(1-obiettivo/merce)*100); }
    R();
  };
  const ts=document.getElementById('t_sc');
  if(ts) ts.onchange=e=>{const n=numIt(e.target.value); D.scontoFin=isNaN(n)?0:Math.max(0,Math.min(100,n)); R();};
  const tr=document.getElementById('t_tr');
  if(tr) tr.onchange=e=>{const n=numIt(e.target.value); D.trasporto=isNaN(n)?0:n; R();};
  document.getElementById('dwa').onclick=()=>{
    const cl=ANAG.clienti.dati.find(c=>c.nome===D.cli);
    avviso(cl&&cl.wa?`Invio del PDF a <b>${cl.nome}</b> su WhatsApp (${cl.wa}).`:'Questo cliente non ha un numero WhatsApp in anagrafica.');
  };
  document.getElementById('dsalva').onclick=()=>{
    const p=documentoIncompleto();
    if(p.length) return avviso('<b>Non posso registrare, mancano dei dati</b><br>· '+p.join('<br>· '));
    avviso(`Documento <b>${D.n}</b> registrato.`);
  };

  const st=document.getElementById('dstato');
  st.onchange=e=>{
    const nuovo=e.target.value;
    const man=documentoIncompleto();
    if(man.length){ e.target.value=D.stato; return avviso('<b>Non posso cambiare stato, mancano dei dati</b><br>· '+man.join('<br>· ')); }
    if(nuovo==='In lavorazione'&&!D.scarico){ chiediLavorazione(); e.target.value=D.stato; return; }
    D.stato=nuovo; R();
  };

  const bagg=document.getElementById('dagg'); if(bagg) bagg.onclick=aggiornaScarico;
  const dm=document.getElementById('dmont');
  if(dm) dm.onchange=e=>{D.montaggio=e.target.value==='Con montaggio';};
  if(D.tab==='riep'){
    document.querySelectorAll('#view tr[data-pos]').forEach(tr=>{
      tr.onclick=()=>{D.pos=+tr.dataset.pos;R();};
      tr.ondblclick=()=>{D.pos=+tr.dataset.pos;D.tab='dett';R();};});
    document.getElementById('riepconf').onclick=()=>{riepConf=!riepConf;R();};
    document.querySelectorAll('[data-rc]').forEach(c=>c.onchange=e=>{
      const k=e.target.dataset.rc;
      RIEPON=e.target.checked?RIEPCOL.map(x=>x.k).filter(x=>RIEPON.includes(x)||x===k):RIEPON.filter(x=>x!==k);
      R();});
    const rr=document.getElementById('riepreset');
    if(rr) rr.onclick=()=>{RIEPON=['pos','cod','desc','m1','m2','spec','acc','pezzi','qta','prezzo','tot'];R();};
    const rs=document.getElementById('riepsalva');
    if(rs) rs.onclick=()=>{riepConf=false;R();avviso('Layout delle colonne salvato per il tuo utente.');};
    document.getElementById('rapri').onclick=()=>{D.tab='dett';R();};
    document.getElementById('raddv').onclick=()=>{D.voci.push(nuovaVoce('ZC50-L'));D.pos=D.voci.length-1;D.tab='dett';R();};
    return;
  }
  if(D.tab!=='dett') return;
  const bv=document.getElementById('vaddvuoto');
  if(bv){ bv.onclick=()=>{D.voci.push(nuovaVoce('ZC50-L'));D.pos=0;R();}; }
  if(!D.voci.length) return;

  const v=D.voci[D.pos], a=PRODOTTI.find(p=>p.cod===v.cod)||{};
  const cambiaArticolo=cod=>{
    const nv=nuovaVoce(cod,null,v.qta); nv.sconto=v.sconto; nv.note=v.note;
    D.voci[D.pos]=nv; R();
  };
  const vc=document.getElementById('vcod');
  vc.addEventListener('keydown',e=>{
    if(e.key!=='Enter') return; e.preventDefault();
    const p=PRODOTTI.find(x=>x.cod.toUpperCase()===vc.value.trim().toUpperCase()&&x.kind==='art');
    if(!p){document.getElementById('vmsg').textContent='Codice non trovato';document.getElementById('vmsg').style.color='var(--alert)';return;}
    cambiaArticolo(p.cod);
  });
  document.getElementById('vg').onchange=e=>{
    const g=e.target.value, sg=GRUPPI[g][0];
    const p=PRODOTTI.find(x=>x.kind==='art'&&x.g===g&&x.sg===sg)||PRODOTTI.find(x=>x.kind==='art'&&x.g===g);
    if(p) cambiaArticolo(p.cod); else avviso('Nessun articolo in questo gruppo.');
  };
  document.getElementById('vsg').onchange=e=>{
    const p=PRODOTTI.find(x=>x.kind==='art'&&x.g===a.g&&x.sg===e.target.value);
    if(p) cambiaArticolo(p.cod); else avviso('Nessun articolo in questo sottogruppo.');
  };
  document.getElementById('vart').onchange=e=>cambiaArticolo(e.target.value);
  document.querySelectorAll('[data-mis]').forEach(i=>i.onchange=e=>{v.mis[+e.target.dataset.mis]=numIt(e.target.value)||0;R();});
  document.querySelectorAll('[data-spec]').forEach(s=>s.onchange=e=>{v.spec[e.target.dataset.spec]=e.target.value;v.prezzo=null;R();});
  document.getElementById('vp').onchange=e=>{const n=numIt(e.target.value); v.prezzo=isNaN(n)?null:n; R();};
  document.getElementById('vsc').onchange=e=>{v.sconto=numIt(e.target.value)||0;R();};
  document.getElementById('vq').onchange=e=>{v.qta=Math.max(1,numIt(e.target.value)||1);R();};
  document.getElementById('vnote').onchange=e=>v.note=e.target.value;
  const aa=document.getElementById('vaddacc');
  if(aa) aa.onchange=e=>{if(!e.target.value)return;v.acc.push({cod:e.target.value,q:1,sconto:0});R();};
  document.querySelectorAll('[data-asc]').forEach(i=>i.onchange=e=>{v.acc[+e.target.dataset.asc].sconto=numIt(e.target.value)||0;R();});
  document.querySelectorAll('[data-adel]').forEach(b=>b.onclick=e=>{v.acc.splice(+e.target.dataset.adel,1);R();});
  document.getElementById('vadd').onclick=()=>{D.voci.push(nuovaVoce('ZC50-L'));D.pos=D.voci.length-1;R();};
  document.getElementById('vdup').onclick=()=>{D.voci.splice(D.pos+1,0,JSON.parse(JSON.stringify(v)));D.pos++;R();};
  document.getElementById('vdel').onclick=()=>{D.voci.splice(D.pos,1);D.pos=Math.max(0,D.pos-1);R();};
  document.getElementById('vprev').onclick=()=>{D.pos--;R();};
  document.getElementById('vnext').onclick=()=>{D.pos++;R();};
}

/* ---------- conferma lavorazione e ripristino ---------- */
function fabbisognoCambiato(){
  if(!D||!D.scarico) return null;
  const ora=componentiDaScaricare(), diff=[];
  const mappa={}; D.scarico.forEach(c=>mappa[c.cod]=c.q);
  ora.forEach(c=>{const d=c.q-(mappa[c.cod]||0); if(Math.abs(d)>0.0001) diff.push({cod:c.cod,desc:c.desc,d});delete mappa[c.cod];});
  Object.entries(mappa).forEach(([cod,q])=>diff.push({cod,desc:(COMP.find(x=>x.cod===cod)||{}).desc||'',d:-q}));
  return diff.length?diff:null;
}

function tabellaScarico(comp,titolo){
  return `<div style="margin-bottom:9px">${titolo}</div>
    <table style="border:1px solid var(--line);border-radius:9px;overflow:hidden">
      <thead><tr><th>Componente</th><th class="r" style="width:23%">Quantità</th>
      <th class="r" style="width:20%">Giacenza</th><th class="r" style="width:20%">Dopo</th></tr></thead>
      <tbody>${comp.length?comp.map(c=>{const q=c.q!==undefined?c.q:c.d, g=giac(c.cod), dopo=g-q;
        return `<tr><td><b class="mono">${c.cod}</b> ${c.desc}</td>
          <td class="num" style="color:${q<0?'var(--ok)':'var(--alert)'}">${q>0?'−':'+'}${q3n(Math.abs(q))}</td>
          <td class="num">${q3n(g)}</td>
          <td class="num" style="font-weight:600;color:${dopo<0?'var(--alert)':'inherit'}">${q3n(dopo)}</td></tr>`;}).join('')
        :'<tr><td class="vuoto" colspan="4">Nessun componente configurato sugli articoli di questo documento</td></tr>'}
      </tbody></table>`;
}

function chiediLavorazione(){
  const comp=componentiDaScaricare();
  const neg=comp.some(c=>giac(c.cod)-c.q<0);
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="finestra" style="width:640px"><h3>Messa in lavorazione — ${D.n} <button class="x">✕</button></h3>
    <div class="corpo">${tabellaScarico(comp,'Confermando, questi componenti verranno scaricati dal magazzino:')}
      ${neg?'<div style="color:var(--alert);margin-top:10px">Attenzione: alcune giacenze andranno in negativo.</div>':''}</div>
    <div class="piede"><button class="btn" data-no>Annulla</button>
      <button class="btn pri" data-si>Conferma e scarica</button></div></div>`;
  document.body.appendChild(ov);
  const chiudi=()=>ov.remove();
  ov.querySelector('.x').onclick=chiudi; ov.querySelector('[data-no]').onclick=chiudi;
  ov.querySelector('[data-si]').onclick=()=>{
    chiudi();
    comp.forEach(c=>MOV.push({d:oggiOra(),cod:c.cod,t:'SCARICO',q:-c.q,c:'Commessa in lavorazione',doc:D.n,u:'M. Rossi'}));
    D.scarico=comp.map(c=>({...c})); D.stato='In lavorazione'; render();
    avviso(`Commessa in lavorazione: <b>${comp.length} componenti scaricati</b>.`);
  };
}

function aggiornaScarico(){
  const diff=fabbisognoCambiato(); if(!diff) return;
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="finestra" style="width:640px"><h3>Aggiorna scarico di magazzino <button class="x">✕</button></h3>
    <div class="corpo">${tabellaScarico(diff,'Le voci del documento sono cambiate. Rettifiche da registrare:')}</div>
    <div class="piede"><button class="btn" data-no>Più tardi</button>
      <button class="btn pri" data-si>Aggiorna magazzino</button></div></div>`;
  document.body.appendChild(ov);
  const chiudi=()=>ov.remove();
  ov.querySelector('.x').onclick=chiudi; ov.querySelector('[data-no]').onclick=chiudi;
  ov.querySelector('[data-si]').onclick=()=>{
    chiudi();
    diff.forEach(c=>MOV.push({d:oggiOra(),cod:c.cod,t:c.d>0?'SCARICO':'RIPRISTINO',q:-c.d,
      c:'Aggiornamento voci commessa',doc:D.n,u:'M. Rossi'}));
    D.scarico=componentiDaScaricare().map(c=>({...c})); render();
    avviso(`Magazzino allineato alle voci attuali: <b>${diff.length} rettifiche</b>.`);
  };
}
const oggiOra=()=>{const o=new Date();
  return `${String(o.getDate()).padStart(2,'0')}/${String(o.getMonth()+1).padStart(2,'0')}/${o.getFullYear()} ${String(o.getHours()).padStart(2,'0')}:${String(o.getMinutes()).padStart(2,'0')}`;};

function vistaImpostazioni(){
  if(!D) return `<div class="soon"><h3>Nessuna commessa aperta</h3><div>Apri una commessa dall'elenco.</div></div>`;
  return `<div class="head"><div><h1>Impostazioni commessa ${D.n}</h1><p class="sub">Operazioni straordinarie sul documento</p></div></div>
  <div class="cols"><div class="card"><h2>Giacenza</h2><div class="in">
    ${D.scarico?`<div style="margin-bottom:10px">Questa commessa ha scaricato <b>${D.scarico.length} componenti</b> quando è stata messa in lavorazione.</div>
    <table style="border:1px solid var(--line);border-radius:9px;overflow:hidden"><tbody>
      ${D.scarico.map(c=>`<tr><td><b class="mono">${c.cod}</b> ${c.desc}</td><td class="num">${q3n(c.q)}</td></tr>`).join('')}
    </tbody></table>
    <button class="btn pri" id="ripr" style="margin-top:12px">Ripristina giacenza</button>`
    :'<div style="color:var(--muted)">Nessuno scarico registrato: la commessa non è mai stata messa in lavorazione.</div>'}
  </div></div>
  <div class="card"><h2>Stato attuale</h2><div class="in">
    <div style="display:flex;justify-content:space-between;padding:6px 0"><span>Stato</span><b>${D.stato}</b></div>

  </div></div></div>`;
}
function bindImpostazioni(){
  const b=document.getElementById('ripr');
  if(b) b.onclick=()=>{
    D.scarico.forEach(c=>MOV.push({d:'12/08/2026 12:30',cod:c.cod,t:'RIPRISTINO',q:c.q,c:'Ripristino giacenza da impostazioni',doc:D.n,u:'M. Rossi'}));

  };
}

function bindStati(){
  const T=()=>{dirtyStati=true;render();};
  document.querySelectorAll('[data-sn]').forEach(i=>i.onchange=e=>{
    const k=+e.target.dataset.sn, vecchio=STATI[k].n, nuovo=e.target.value.trim();
    if(!nuovo) return;
    DOCUMENTI.forEach(d=>{if(d.stato===vecchio)d.stato=nuovo;});
    STATI[k].n=nuovo;T();});
  [['sf','sf'],['sb','bo'],['st','tx']].forEach(([a,k])=>
    document.querySelectorAll(`[data-${a}]`).forEach(i=>i.oninput=e=>{STATI[+e.target.dataset[a]][k]=e.target.value;T();}));
  document.querySelectorAll('[data-sx]').forEach(b=>b.onclick=e=>{
    const s=STATI[+e.target.dataset.sx];
    const u=DOCUMENTI.filter(d=>d.stato===s.n);
    if(u.length) return avviso(`Impossibile eliminare <b>${s.n}</b>: usato da ${u.length} documenti.`);
    STATI.splice(+e.target.dataset.sx,1);T();});
  document.getElementById('stadd').onclick=()=>{STATI.push({n:'Nuovo stato',sf:'#F3F5F8',bo:'#B9C2CC',tx:'#4A5460'});T();};
  document.getElementById('stsave').onclick=()=>{dirtyStati=false;render();avviso('Stati salvati.');};
}

let A={tipo:'clienti',sort:{c:null,d:1},f:{},cerca:'',sel:null}, AS=null;

function vistaAnag(tipo){
  A={tipo,sort:{c:null,d:1},f:{},cerca:'',sel:null};
  const cfg=ANAG[tipo];
  return `
  <div class="head"><div><h1>${cfg.titolo}</h1><p class="sub">${cfg.dati.length} schede in archivio</p></div></div>
  <div class="card">
    <div class="toolbar">
      <div class="searchbox"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.3-4.3"/></svg>
        <input id="acerca" placeholder="Cerca nome, città, partita IVA…"></div>
      <button class="btn sm" id="aazzera">Azzera filtri</button>
      <span style="margin-left:auto;font-size:12px;color:var(--muted)">Doppio click per aprire la scheda</span>
    </div>
    <div class="tabwrap"><table id="atab">
      <thead><tr>${cfg.col.map((c,i)=>`<th class="sortable" data-c="${i}">${c[1]}<span class="arw">▲</span></th>`).join('')}</tr>
      <tr class="filtri">${cfg.col.map(c=>`<th><input data-f="${c[0]}" placeholder="filtra"></th>`).join('')}</tr></thead>
      <tbody id="arighe"></tbody></table></div>
    <div class="footbar">
      <span class="info" id="aselinfo">Nessuna riga selezionata</span>
      <span class="info" id="aconta"></span>
      <div class="r">
        <button class="btn pri" id="aadd">Aggiungi</button>
        <button class="btn" id="amod" disabled>Modifica</button>
        <button class="btn" id="adel" disabled>Elimina</button>
        <button class="btn" id="astampa">Stampa elenco</button>
      </div>
    </div>
  </div>`;
}
function renderAnag(){
  const cfg=ANAG[A.tipo];
  let d=cfg.dati.slice().filter(r=>{
    if(A.cerca&&!Object.values(r).join(' ').toLowerCase().includes(A.cerca)) return false;
    for(const k in A.f){ if(A.f[k]&&!String(r[k]===undefined?'':r[k]).toLowerCase().includes(A.f[k])) return false; }
    return true;
  });
  if(A.sort.c!==null){const k=cfg.col[A.sort.c][0];
    d.sort((a,b)=>String(a[k]||'').localeCompare(String(b[k]||''),'it',{numeric:true})*A.sort.d);}
  document.getElementById('arighe').innerHTML=d.length?d.map(r=>
    `<tr data-cod="${r.cod}" class="${A.sel===r.cod?'sel':''}">${cfg.col.map(c=>{
      let v=r[c[0]]; if(v===undefined||v==='') v='—';
      if(c[0]==='stato') return `<td><span class="tag ${r.attivo?'ok':''}">${r.attivo?'Attivo':'Disattivato'}</span></td>`;
      if(c[0]==='provv') return `<td class="num">${r.provv} %</td>`;
      return `<td class="${['cod','piva','tel'].includes(c[0])?'mono':''}">${v}</td>`;}).join('')}</tr>`).join('')
    :`<tr><td class="vuoto" colspan="${cfg.col.length}">Nessuna scheda con questi filtri</td></tr>`;
  document.getElementById('aconta').textContent=`${d.length} di ${cfg.dati.length}`;
  document.querySelectorAll('#arighe tr[data-cod]').forEach(tr=>{
    tr.onclick=()=>{A.sel=tr.dataset.cod;renderAnag();};
    tr.ondblclick=()=>{AS=JSON.parse(JSON.stringify(cfg.dati.find(x=>x.cod===tr.dataset.cod)));voce='scheda';render();};
  });
  ['amod','adel'].forEach(id=>document.getElementById(id).disabled=!A.sel);
  document.getElementById('aselinfo').innerHTML=A.sel?`Selezionato <b>${A.sel}</b>`:'Nessuna riga selezionata';
}
function bindAnag(){
  const cfg=ANAG[A.tipo];
  renderAnag();
  document.querySelectorAll('#atab th.sortable').forEach(th=>th.onclick=()=>{
    const c=+th.dataset.c; A.sort=(A.sort.c===c)?{c,d:-A.sort.d}:{c,d:1};
    document.querySelectorAll('#atab th.sortable').forEach(t=>{t.classList.remove('sorted');t.querySelector('.arw').textContent='▲';});
    th.classList.add('sorted');th.querySelector('.arw').textContent=A.sort.d===1?'▲':'▼';renderAnag();});
  document.querySelectorAll('#atab tr.filtri input').forEach(i=>i.oninput=()=>{A.f[i.dataset.f]=i.value.trim().toLowerCase();renderAnag();});
  document.getElementById('acerca').oninput=e=>{A.cerca=e.target.value.toLowerCase();renderAnag();};
  document.getElementById('aazzera').onclick=()=>{A.f={};A.cerca='';A.sort={c:null,d:1};
    document.querySelectorAll('#atab tr.filtri input').forEach(i=>i.value='');
    document.getElementById('acerca').value='';renderAnag();};
  document.getElementById('aadd').onclick=()=>{AS=null;voce='scheda';render();};
  document.getElementById('amod').onclick=()=>{AS=JSON.parse(JSON.stringify(cfg.dati.find(x=>x.cod===A.sel)));voce='scheda';render();};
  document.getElementById('adel').onclick=()=>{
    const u=(A.tipo==='clienti')?DOCS.concat(PREV).filter(d=>d.cli===(cfg.dati.find(x=>x.cod===A.sel)||{}).nome):[];
    if(u.length) return avviso(`Impossibile eliminare: ci sono ${u.length} documenti collegati. Disattiva la scheda invece di cancellarla.`);
    cfg.dati.splice(cfg.dati.findIndex(x=>x.cod===A.sel),1);A.sel=null;render();avviso('Scheda eliminata.');
  };
  document.getElementById('astampa').onclick=()=>avviso('Stampa dell\u2019elenco filtrato.');
}

function tabellaProvv(r){
  if(!r.regole) r.regole=[];
  return `<div class="card">
    <h2>Provvigioni per gruppo, sottogruppo o articolo
      <span class="r"><button class="btn sm" id="prvadd">+ Aggiungi regola</button></span></h2>
    ${r.regole.length?`<table><thead><tr>
      <th style="width:16%">Ambito</th><th style="width:22%">Gruppo</th><th style="width:22%">Sottogruppo</th>
      <th style="width:26%">Articolo</th><th class="r" style="width:12%">Provvigione %</th><th style="width:4%"></th></tr></thead><tbody>
      ${r.regole.map((g,i)=>`<tr>
        <td><select data-pa="${i}" style="width:100%;height:28px;border-radius:6px;border:1px solid var(--line);font:inherit;font-size:12.5px">
          ${['Gruppo','Sottogruppo','Articolo'].map(a=>`<option ${g.ambito===a?'selected':''}>${a}</option>`).join('')}</select></td>
        <td><select data-pg="${i}" style="width:100%;height:28px;border-radius:6px;border:1px solid var(--line);font:inherit;font-size:12.5px">
          ${Object.keys(GRUPPI).map(x=>`<option ${g.g===x?'selected':''}>${x}</option>`).join('')}</select></td>
        <td>${g.ambito==='Gruppo'?'<span style="color:var(--faint)">tutti</span>':
          `<select data-ps="${i}" style="width:100%;height:28px;border-radius:6px;border:1px solid var(--line);font:inherit;font-size:12.5px">
           ${(GRUPPI[g.g]||[]).map(x=>`<option ${g.sg===x?'selected':''}>${x}</option>`).join('')}</select>`}</td>
        <td>${g.ambito!=='Articolo'?'<span style="color:var(--faint)">tutti</span>':
          `<select data-pr="${i}" style="width:100%;height:28px;border-radius:6px;border:1px solid var(--line);font:inherit;font-size:12.5px">
           ${PRODOTTI.filter(p=>p.g===g.g&&(!g.sg||p.sg===g.sg)).map(p=>`<option value="${p.cod}" ${g.cod===p.cod?'selected':''}>${p.cod} — ${p.desc}</option>`).join('')}</select>`}</td>
        <td class="num"><input class="num" data-pp="${i}" value="${g.perc}" style="height:27px;width:78px"></td>
        <td><button style="border:0;background:none;color:var(--alert);cursor:pointer" data-px="${i}">✕</button></td></tr>`).join('')}
      </tbody></table>`:'<div class="vuoto">Nessuna regola — si applica la provvigione predefinita a tutto</div>'}
    <div class="in" style="border-top:1px solid var(--line);color:var(--muted);font-size:12px">
      Vince sempre la regola più specifica: <b>articolo</b> prima di <b>sottogruppo</b>, sottogruppo prima di <b>gruppo</b>, gruppo prima della percentuale predefinita.
    </div>
  </div>`;
}
function bindProvv(dati){
  if(A.tipo!=='agenti') return;
  const R=()=>render();
  const add=document.getElementById('prvadd');
  if(add) add.onclick=()=>{dati.regole=dati.regole||[];
    const g=Object.keys(GRUPPI)[0];
    dati.regole.push({ambito:'Gruppo',g,sg:GRUPPI[g][0],cod:'',perc:dati.provv||0});AS=dati;R();};
  document.querySelectorAll('[data-pa]').forEach(s=>s.onchange=e=>{dati.regole[+e.target.dataset.pa].ambito=e.target.value;AS=dati;R();});
  document.querySelectorAll('[data-pg]').forEach(s=>s.onchange=e=>{
    const r=dati.regole[+e.target.dataset.pg]; r.g=e.target.value; r.sg=GRUPPI[r.g][0]; r.cod=''; AS=dati;R();});
  document.querySelectorAll('[data-ps]').forEach(s=>s.onchange=e=>{
    const r=dati.regole[+e.target.dataset.ps]; r.sg=e.target.value; r.cod=''; AS=dati;R();});
  document.querySelectorAll('[data-pr]').forEach(s=>s.onchange=e=>{dati.regole[+e.target.dataset.pr].cod=e.target.value;AS=dati;});
  document.querySelectorAll('[data-pp]').forEach(i=>i.onchange=e=>{dati.regole[+e.target.dataset.pp].perc=numIt(e.target.value)||0;AS=dati;});
  document.querySelectorAll('[data-px]').forEach(b=>b.onclick=e=>{dati.regole.splice(+e.target.dataset.px,1);AS=dati;R();});
}

function vistaAnagScheda(){
  const cfg=ANAG[A.tipo], nuovo=!AS;
  const r=AS||{attivo:true};
  const campo=f=>{
    const v=r[f.k]===undefined?'':r[f.k];
    let inp;
    if(f.t==='sel') inp=`<select data-k="${f.k}">${f.o.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`;
    else if(f.t==='area') inp=`<textarea rows="3" data-k="${f.k}">${v}</textarea>`;
    else if(f.t==='chk') return `<label class="misrow" style="border:0;padding:6px 0;cursor:pointer">
        <input type="checkbox" data-k="${f.k}" ${r[f.k]?'checked':''}><span style="font-size:13px">${f.l}</span></label>`;
    else inp=`<input class="${f.w||''}" data-k="${f.k}" value="${v}" ${f.t==='num'?'inputmode="decimal"':''}>`;
    return `<label class="f" ${f.full?'style="grid-column:1/-1"':''}><span>${f.l}${f.req?' <b>*</b>':''}</span>${inp}</label>`;
  };
  return `
  <div class="head"><div><h1>${nuovo?'Nuova scheda '+cfg.sing:r.cod+' — '+(r.nome||'')+(r.cognome?' '+r.cognome:'')}</h1>
  <p class="sub">${cfg.titolo}</p></div>
  <div class="acts"><button class="btn" id="asann">Annulla</button><button class="btn pri" id="assalva">Salva scheda</button></div></div>
  <div class="cols" style="grid-template-columns:${cfg.campi.length>1?'1fr 1fr':'1fr'};align-items:start">
    ${cfg.campi.map(gr=>`<div class="card"><h2>${gr.g}</h2><div class="in form" style="grid-template-columns:1fr 1fr">
      ${gr.c.map(campo).join('')}</div></div>`).join('')}
  </div>
  ${A.tipo==='agenti'?tabellaProvv(r):''}`;
}
function bindAnagScheda(){
  const cfg=ANAG[A.tipo];
  const dati=AS||{attivo:true};
  document.querySelectorAll('[data-k]').forEach(e=>{
    const ev=(e.type==='checkbox'||e.tagName==='SELECT')?'onchange':'oninput';
    e[ev]=x=>{dati[e.dataset.k]=(e.type==='checkbox')?x.target.checked:x.target.value;};
  });
  bindProvv(dati);
  document.getElementById('asann').onclick=()=>{AS=null;voce=A.tipo;render();};
  document.getElementById('assalva').onclick=()=>{
    if(!dati.cod||!String(dati.cod).trim()) return avviso('<b>Codice obbligatorio.</b>');
    if(!dati.nome||!String(dati.nome).trim()) return avviso('<b>Nome o ragione sociale obbligatorio.</b>');
    const i=cfg.dati.findIndex(x=>x.cod===dati.cod);
    const era=!!AS;
    if(!era&&i>=0) return avviso(`Esiste già una scheda con codice <b>${dati.cod}</b>.`);
    if(i>=0) cfg.dati[i]=dati; else cfg.dati.push(dati);
    A.sel=dati.cod; AS=null; voce=A.tipo; render();
    avviso(`Scheda <b>${dati.cod}</b> ${era?'aggiornata':'creata'}.`);
  };
}

const movDi=cod=>MOV.filter(m=>m.cod===cod);
const somma=(cod,t)=>movDi(cod).filter(m=>!t||m.t===t).reduce((a,b)=>a+b.q,0);
const giac=cod=>{const c=COMP.find(x=>x.cod===cod);return c.init+somma(cod);};
const sotto=()=>COMP.filter(c=>giac(c.cod)<c.min);

 ['car','Carichi','num'],['sca','Scarichi','num'],['att','Giacenza attuale','num'],['min','Scorta minima','num'],['st','Stato']];

function rigaMag(c){
  const car=movDi(c.cod).filter(m=>m.q>0).reduce((a,b)=>a+b.q,0);
  const sca=movDi(c.cod).filter(m=>m.q<0).reduce((a,b)=>a+b.q,0);
  return {...c,car,sca,att:giac(c.cod),st:giac(c.cod)<c.min?'Sottoscorta':'Regolare'};
}

  M={sort:{c:null,d:1},f:{},cerca:'',sel:null};

    </div>

}
function renderMag(soloSotto){
  let d=COMP.map(rigaMag).filter(r=>!soloSotto||r.att<r.min);
  const f=document.getElementById('mforn');
  d=d.filter(r=>{
    if(f&&f.selectedIndex>0&&r.forn!==f.value) return false;
    if(M.cerca&&!(r.cod+' '+r.desc).toLowerCase().includes(M.cerca)) return false;
    for(const k in M.f){ if(M.f[k]&&!String(r[k]).toLowerCase().includes(M.f[k])) return false; }
    return true;
  });
  if(M.sort.c!==null){const k=COLM[M.sort.c][0],num=COLM[M.sort.c][2]==='num';
    d.sort((a,b)=>num?(a[k]-b[k])*M.sort.d:String(a[k]).localeCompare(String(b[k]),'it',{numeric:true})*M.sort.d);}
  document.getElementById('mrighe').innerHTML=d.length?d.map(r=>`
    <tr data-cod="${r.cod}" class="${r.att<r.min?'low':''} ${M.sel===r.cod?'sel':''}">
      <td class="mono">${r.cod}</td><td>${r.desc}</td><td>${r.um}</td>
      <td class="num">${q3n(r.init)}</td><td class="num" style="color:var(--ok)">+${q3n(r.car)}</td>
      <td class="num" style="color:var(--alert)">${q3n(r.sca)}</td>
      <td class="num" style="font-weight:600">${q3n(r.att)}</td><td class="num">${q3n(r.min)}</td>
      <td>${r.att<r.min?'<span class="tag al">Sottoscorta</span>':'<span class="tag ok">Regolare</span>'}</td></tr>`).join('')
    :`<tr><td class="vuoto" colspan="9">Nessun componente con questi filtri</td></tr>`;
  document.getElementById('mconta').textContent=`${d.length} di ${COMP.length} componenti`;
  document.querySelectorAll('#mrighe tr[data-cod]').forEach(tr=>{
    tr.onclick=()=>{M.sel=tr.dataset.cod;renderMag(soloSotto);};
    tr.ondblclick=()=>{movFiltro=tr.dataset.cod;voce='mov';render();};
  });
  ['mmov','mret','mmod','mdel'].forEach(id=>{const b=document.getElementById(id);if(b)b.disabled=!M.sel;});
  document.getElementById('mselinfo').innerHTML=M.sel?`Selezionato <b>${M.sel}</b>`:'Nessuna riga selezionata';
}
function bindMag(soloSotto){
  renderMag(soloSotto);
  document.querySelectorAll('#mtab th.sortable').forEach(th=>th.onclick=()=>{
    const c=+th.dataset.c; M.sort=(M.sort.c===c)?{c,d:-M.sort.d}:{c,d:1};
    document.querySelectorAll('#mtab th.sortable').forEach(t=>{t.classList.remove('sorted');t.querySelector('.arw').textContent='▲';});
    th.classList.add('sorted');th.querySelector('.arw').textContent=M.sort.d===1?'▲':'▼'; renderMag(soloSotto);});
  document.querySelectorAll('#mtab tr.filtri input').forEach(i=>i.oninput=()=>{M.f[i.dataset.f]=i.value.trim().toLowerCase();renderMag(soloSotto);});
  document.getElementById('mcerca').oninput=e=>{M.cerca=e.target.value.toLowerCase();renderMag(soloSotto);};
  document.getElementById('mforn').onchange=()=>renderMag(soloSotto);
  document.getElementById('mazzera').onclick=()=>{M.f={};M.cerca='';M.sort={c:null,d:1};
    document.querySelectorAll('#mtab tr.filtri input').forEach(i=>i.value='');
    document.getElementById('mcerca').value='';document.getElementById('mforn').selectedIndex=0;renderMag(soloSotto);};
  document.getElementById('mmov').onclick=()=>{movFiltro=M.sel;voce='mov';render();};
  document.getElementById('mcar').onclick=()=>{voce='carico';render();};
  document.getElementById('mret').onclick=()=>{voce='inv';render();};
  document.getElementById('mstampa').onclick=()=>avviso('Stampa dell\u2019elenco filtrato.');
  document.getElementById('mnew').onclick=()=>{K=null;voce='comp';render();};
  document.getElementById('mmod').onclick=()=>{K=JSON.parse(JSON.stringify(COMP.find(c=>c.cod===M.sel)));voce='comp';render();};
  document.getElementById('mdel').onclick=()=>{
    const n=movDi(M.sel).length;
    if(n) return avviso(`Impossibile eliminare <b>${M.sel}</b>: ha ${n} movimenti registrati. Un componente con storico non si cancella, si disattiva.`);
    const usato=PRODOTTI.filter(p=>(p.comp||[]).some(x=>x.cod===M.sel));
    if(usato.length) return avviso(`Impossibile eliminare <b>${M.sel}</b>: è nei componenti di ${usato.map(p=>p.cod).join(', ')}.`);
    COMP.splice(COMP.findIndex(c=>c.cod===M.sel),1); M.sel=null; render(); avviso('Componente eliminato.');
  };
  const o=document.getElementById('mordine');
  if(o) o.onclick=()=>avviso(`Proposta d\u2019ordine per ${sotto().length} componenti, raggruppata per fornitore.`);
}

function bindCarico(){

  document.querySelectorAll('[data-rq]').forEach(i=>i.onchange=e=>{CAR.righe[+e.target.dataset.rq].q=e.target.value;R();});
  document.querySelectorAll('[data-rp]').forEach(i=>i.onchange=e=>{CAR.righe[+e.target.dataset.rp].costo=e.target.value;R();});
  document.querySelectorAll('[data-rd]').forEach(b=>b.onclick=e=>{CAR.righe.splice(+e.target.dataset.rd,1);
    if(!CAR.righe.length)CAR.righe.push({cod:'',q:'',costo:''});R();});
  document.getElementById('carann').onclick=()=>{CAR={forn:FORN[0],bolla:'',data:'2026-08-12',righe:[{cod:'',q:'',costo:''}]};R();};
  document.getElementById('carreg').onclick=()=>{

    voce='giac'; R(); avviso(`Carico registrato: <b>${n} movimenti</b> creati, giacenze aggiornate.`);
  };
}

    <div class="form f2">
      <label class="f"><span>Codice <b>*</b></span><input class="mono" id="k_cod" value="${k.cod}" ${nuovo?'':'readonly'}></label>
      <label class="f"><span>Unità di misura</span><select id="k_um">${['PZ','MQ','MTL','KG'].map(u=>`<option ${k.um===u?'selected':''}>${u}</option>`).join('')}</select></label>
    </div>
    <label class="f"><span>Descrizione <b>*</b></span><input id="k_desc" value="${k.desc}"></label>
    <div class="form f2">
      <label class="f"><span>Giacenza iniziale</span><input class="num" id="k_init" value="${k.init}" ${nuovo?'':'disabled'}></label>
      <label class="f"><span>Scorta minima</span><input class="num" id="k_min" value="${k.min}"></label>
    </div>
    <div class="form f2">
      <label class="f"><span>Fornitore abituale</span><select id="k_forn">${FORN.map(f=>`<option ${k.forn===f?'selected':''}>${f}</option>`).join('')}</select></label>
      <label class="f"><span>Costo unitario</span><input class="num" id="k_costo" value="${k.costo}"></label>
    </div>
    ${nuovo?'':`<div style="color:var(--muted);font-size:12px;margin-top:4px">La giacenza iniziale non si modifica dopo la creazione: per correggere usa una rettifica, così la differenza resta tracciata.</div>`}
  </div></div>
  ${nuovo?'':`<div class="card"><h2>Situazione</h2><div class="in">
    <div style="display:flex;justify-content:space-between;padding:6px 0"><span>Giacenza attuale</span><b class="mono" style="font-size:17px">${q3n(giac(k.cod))} ${k.um}</b></div>
    <div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line-soft)"><span>Movimenti registrati</span><b class="mono">${movDi(k.cod).length}</b></div>
    <div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line-soft)"><span>Usato nei componenti di</span><b class="mono">${PRODOTTI.filter(p=>(p.comp||[]).some(x=>x.cod===k.cod)).length} prodotti</b></div>
  </div></div>`}</div>`;
}
function bindComp(){
  document.getElementById('kann').onclick=()=>{K=null;voce='giac';render();};
  document.getElementById('ksalva').onclick=()=>{
    const g=id=>document.getElementById(id).value;
    const cod=g('k_cod').trim().toUpperCase(), desc=g('k_desc').trim();
    if(!cod) return avviso('<b>Codice obbligatorio.</b>');
    if(!desc) return avviso('<b>Descrizione obbligatoria.</b>');
    const i=COMP.findIndex(c=>c.cod===cod);
    const dati={cod,desc,um:g('k_um'),init:numIt(g('k_init'))||0,min:numIt(g('k_min'))||0,forn:g('k_forn'),costo:numIt(g('k_costo'))||0};
    if(!K && i>=0) return avviso(`Esiste già un componente con codice <b>${cod}</b>.`);
    if(i>=0){ dati.init=COMP[i].init; COMP[i]=dati; } else COMP.push(dati);
    const era=!!K; K=null; M.sel=cod; voce='giac'; render();
    avviso(`Componente <b>${cod}</b> ${era?'aggiornato':'aggiunto'}.`);
  };
}

/* ---------- gruppi e sottogruppi ---------- */
function usoGruppo(g){return PRODOTTI.filter(p=>p.g===g);}
function usoSotto(g,s){return PRODOTTI.filter(p=>p.g===g&&p.sg===s);}

let dirtyGr=false;
function vistaGruppi(){
  return `<div class="head"><div><h1>Gruppi e sottogruppi</h1>
  <p class="sub">Struttura del catalogo · un gruppo o un sottogruppo si elimina solo se non è usato da nessun prodotto</p></div>
  <div class="acts">
    ${dirtyGr?'<span class="pill">modifiche non salvate</span>':''}
    <input id="ng" placeholder="Nome nuovo gruppo" style="font:inherit;font-size:13px;padding:7px 12px;border:1px solid var(--line-strong);border-radius:9px;width:190px">
    <button class="btn" id="addg">Aggiungi gruppo</button>
    <button class="btn pri" id="grsalva" ${dirtyGr?'':'disabled'}>Salva</button>
  </div></div>
  <div class="cols">${Object.entries(GRUPPI).map(([g,ss])=>{
    const n=usoGruppo(g).length;
    return `<div class="card">
      <h2>${g}
        <span class="r">
          <span class="tag ${n?'ac':''}">${n} prodotti</span>
          <button class="btn sm" data-delg="${g}" ${n?'style="opacity:.5"':''}>Elimina gruppo</button>
        </span>
      </h2>
      <table><thead><tr><th>Sottogruppo</th><th class="r" style="width:110px">Prodotti</th><th style="width:70px"></th></tr></thead>
      <tbody>${ss.map(s=>{const k=usoSotto(g,s).length;
        return `<tr><td>${s}</td><td class="num">${k}</td>
        <td><button style="border:0;background:none;color:${k?'var(--faint)':'var(--alert)'};cursor:pointer;font-size:14px"
          data-dels="${g}|${s}" title="${k?'In uso da '+k+' prodotti':'Elimina sottogruppo'}">✕</button></td></tr>`;}).join('')}
      <tr><td><input data-nsg="${g}" placeholder="Nuovo sottogruppo…" style="font:inherit;font-size:12.5px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;width:100%"></td>
      <td></td><td><button class="btn sm" data-adds="${g}">+</button></td></tr>
      </tbody></table></div>`;}).join('')}
  </div>`;
}

function bindGruppi(){
  const tocca=()=>{dirtyGr=true;render();};
  document.getElementById('grsalva').onclick=()=>{dirtyGr=false;render();avviso('Struttura del catalogo salvata.');};
  document.getElementById('addg').onclick=()=>{
    const v=document.getElementById('ng').value.trim();
    if(!v) return;
    if(GRUPPI[v]) return avviso('Esiste già un gruppo con questo nome.');
    GRUPPI[v]=[]; tocca();
  };
  document.querySelectorAll('[data-delg]').forEach(b=>b.onclick=()=>{
    const g=b.dataset.delg, u=usoGruppo(g);
    if(u.length) return avviso(`Impossibile eliminare il gruppo <b>${g}</b>: è usato da ${u.length} prodotti (${u.slice(0,4).map(p=>p.cod).join(', ')}${u.length>4?'…':''}). Elimina prima i prodotti, poi il gruppo.`);
    if(GRUPPI[g].length) return avviso(`Il gruppo <b>${g}</b> contiene ancora ${GRUPPI[g].length} sottogruppi: eliminali prima.`);
    delete GRUPPI[g]; tocca(); avviso(`Gruppo <b>${g}</b> eliminato.`);
  });
  document.querySelectorAll('[data-dels]').forEach(b=>b.onclick=()=>{
    const [g,s]=b.dataset.dels.split('|'), u=usoSotto(g,s);
    if(u.length) return avviso(`Impossibile eliminare il sottogruppo <b>${s}</b>: è usato da ${u.length} prodotti (${u.map(p=>p.cod).join(', ')}). Elimina prima i prodotti.`);
    GRUPPI[g]=GRUPPI[g].filter(x=>x!==s); tocca(); avviso(`Sottogruppo <b>${s}</b> eliminato.`);
  });
  document.querySelectorAll('[data-adds]').forEach(b=>b.onclick=()=>{
    const g=b.dataset.adds, inp=document.querySelector(`[data-nsg="${g}"]`), v=inp.value.trim();
    if(!v) return;
    if(GRUPPI[g].includes(v)) return avviso('Sottogruppo già presente in questo gruppo.');
    GRUPPI[g].push(v); tocca();
  });
}

function vistaSoon(sez,voce){
  const nome=SEZIONI[sez].voci.find(v=>v[0]===voce)[1];
  const altre=SEZIONI[sez].voci.filter(v=>v[0]!==voce);
  return `<div class="head"><div><h1>${nome}</h1><p class="sub">Prototipo non ancora costruito</p></div></div>
  <div class="soon"><h3>Questa schermata è nel blocco successivo</h3>
  <div>Mandami il disegno o dimmi come deve funzionare, e la costruisco come le altre.</div>
  <ul>${altre.map(v=>`<li>${v[1]}<em>${PRONTE.includes(sez+'.'+v[0])?'prototipo pronto':'da costruire'}</em></li>`).join('')}</ul></div>`;
}

/* ---------------- navigazione ---------------- */
let sez='dashboard', voce='oggi';
function render(quick){
  document.querySelectorAll('#mainnav .item').forEach(b=>b.classList.toggle('on',b.dataset.s===sez));
  document.getElementById('subnav').innerHTML=SEZIONI[sez].voci
    .map(([k,n])=>`<button data-v="${k}" class="${k===voce?'on':''}">${n}</button>`).join('');
  document.querySelectorAll('#subnav button').forEach(b=>b.onclick=()=>{voce=b.dataset.v;render();});

  const key=sez+'.'+voce;
  const view=document.getElementById('view');
  if(key==='dashboard.oggi'){ view.innerHTML=vistaDashboard(); bindDashboard(); }
  else if(key==='commesse.elenco'){ view.innerHTML=vistaElenco('commesse',quick); bindElenco(); }
  else if(key==='preventivi.elenco'){ view.innerHTML=vistaElenco('preventivi',quick); bindElenco(); }
  else if(key==='articoli.articoli'){ view.innerHTML=vistaCatalogo('art'); bindCatalogo(); }
  else if(key==='articoli.accessori'){ view.innerHTML=vistaCatalogo('acc'); bindCatalogo(); }
  else if(key==='articoli.scheda'){ view.innerHTML=vistaScheda(); bindScheda(); }
  else if(key==='commesse.apri'||key==='preventivi.apri'){ view.innerHTML=vistaDoc(); bindDoc(); }
  else if(key==='impostazioni.stati'){ view.innerHTML=vistaStati(); bindStati(); }
  else if(key==='impostazioni.stampe'){ view.innerHTML=vistaModelli(); bindModelli(); }
  else if(key==='commesse.imp'){ view.innerHTML=vistaImpostazioni(); bindImpostazioni(); }
  else if(sez==='anagrafica'&&voce!=='scheda'){ view.innerHTML=vistaAnag(voce); bindAnag(); }
  else if(key==='anagrafica.scheda'){ view.innerHTML=vistaAnagScheda(); bindAnagScheda(); }
  else if(key==='magazzino.giac'){ view.innerHTML=vistaGiacenze(false); bindMag(false); }
  else if(key==='magazzino.sotto'){ view.innerHTML=vistaGiacenze(true); bindMag(true); }
  else if(key==='magazzino.comp'){ view.innerHTML=vistaComp(); bindComp(); }
  else if(key==='magazzino.mov'){ view.innerHTML=vistaMovimenti(); bindMov(); }
  else if(key==='magazzino.carico'){ view.innerHTML=vistaCarico(); bindCarico(); }
  else if(key==='magazzino.inv'){ view.innerHTML=vistaInventario(); bindInv(); }
  else if(key==='articoli.varia'){ view.innerHTML=vistaVaria(); bindVaria(); }
  else if(key==='articoli.spec'){ view.innerHTML=vistaSpecifiche(); bindSpec(); }
  else if(key==='articoli.gruppi'){ view.innerHTML=vistaGruppi(); bindGruppi(); }
  else view.innerHTML=vistaSoon(sez,voce);
  view.scrollTop=0;
}
document.querySelectorAll('#mainnav .item').forEach(b=>b.onclick=()=>{
  sez=b.dataset.s; voce=SEZIONI[sez].voci[0][0]; render();
});

/* schede della dashboard richiudibili */
function rendiRichiudibili(){
  document.querySelectorAll('#view .card > h2').forEach(h=>{
    const b=document.createElement('button');
    b.className='coll'; b.title='Riduci o espandi';
    b.innerHTML='<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
    b.onclick=e=>{e.stopPropagation();h.parentElement.classList.toggle('chiusa');};
    let r=h.querySelector('.r');
    if(!r){r=document.createElement('span');r.className='r';h.appendChild(r);}
    r.appendChild(b);
  });
}
render();
</script>
</body>
