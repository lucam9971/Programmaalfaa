    <th style="width:12%">Scadenza</th><th class="r" style="width:12%">Importo</th>
    <th class="r" style="width:12%">Incassato</th><th class="r" style="width:12%">Residuo</th><th style="width:11%">Stato</th></tr></thead>
    <tbody>${SCAD.length?SCAD.map(s=>{const [st,cl]=stato(s);

const ELENCO_CAMPI=Object.keys(CAMPI);

let TABELLE=[{nome:'Altezze rotolo',fasce:[{da:0,a:1400,val:'120'},{da:1401,a:1800,val:'160'},{da:1801,a:2500,val:'200'}]}];

function ctxVal(nome,d,v,i,p,r){
  const f=CAMPI[nome.toLowerCase()];
  if(f) return f(d,v,i,p,r);
  if(nome.toLowerCase().startsWith('specifica.')&&v){
    const cat=nome.split('.')[1].toLowerCase();
    const s=Object.entries(v.spec).find(([id])=>{const l=LIB.find(x=>x.id===id);return l&&l.nome.toLowerCase()===cat;});
    return s?s[1]:'';
  }
  return '';
}
function espandi(txt,d,v,i,p,r){
  return String(txt||'').replace(/\[([^\]]+)\]/g,(_,n)=>ctxVal(n.trim(),d,v,i,p,r));
}
function valuta(expr,d,v,i,p,r){
  if(!expr||!String(expr).trim()) return '';
  let e=String(expr);
  // TABELLA("nome"; valore)
  e=e.replace(/TABELLA\(\s*"([^"]+)"\s*;\s*([^)]+)\)/gi,(_,nome,arg)=>{
    const t=TABELLE.find(x=>x.nome.toLowerCase()===nome.toLowerCase()); if(!t) return '""';
    const n=parseFloat(String(valuta(arg,d,v,i,p,r)).replace(',','.'));
    const f=t.fasce.find(x=>n>=x.da&&n<=x.a);
    return JSON.stringify(f?f.val:'');
  });
  // SE(cond; se vero; se falso)
  e=e.replace(/SE\(([^;]+);([^;]+);([^)]*)\)/gi,(_,c,a,b)=>
    condizione(c,d,v,i,p,r)?JSON.stringify(String(valuta(a,d,v,i,p,r))):JSON.stringify(String(valuta(b,d,v,i,p,r))));
  e=e.replace(/\[([^\]]+)\]/g,(_,n)=>{const x=ctxVal(n.trim(),d,v,i,p,r);return isNaN(parseFloat(x))?JSON.stringify(String(x)):parseFloat(x);});
  if(/^\s*".*"\s*$/.test(e)) return e.replace(/^\s*"|"\s*$/g,'');
  try{
    if(/[^0-9+\-*/(). "']/.test(e.replace(/"[^"]*"/g,''))) return e.replace(/"/g,'');
    const r=Function('"use strict";return ('+e+')')();
    return typeof r==='number'?(Math.round(r*100)/100).toLocaleString('it-IT',{useGrouping:false}):String(r);
  }catch(x){ return e.replace(/"/g,''); }
}
function condizione(c,d,v,i,p,r){
  if(!c||!String(c).trim()) return true;
  const parti=String(c).split(/\s+(E|O)\s+/i);
  let res=null, op=null;
  for(const t of parti){
    if(/^(E|O)$/i.test(t)){op=t.toUpperCase();continue;}
    const m=t.match(/(.+?)\s*(>=|<=|<>|=|>|<|contiene)\s*(.+)/i);
    let r=true;
    if(m){
      let a=valuta(m[1],d,v,i,p,r), b=m[3].trim().replace(/^"|"$/g,'');
      const na=parseFloat(String(a).replace(',','.')), nb=parseFloat(b.replace(',','.'));
      const num=!isNaN(na)&&!isNaN(nb);
      switch(m[2].toLowerCase()){
        case '=': r=num?na===nb:String(a).toLowerCase()===b.toLowerCase(); break;
        case '<>':r=num?na!==nb:String(a).toLowerCase()!==b.toLowerCase(); break;
        case '>': r=num&&na>nb; break;  case '<': r=num&&na<nb; break;
        case '>=':r=num&&na>=nb; break; case '<=':r=num&&na<=nb; break;
        case 'contiene': r=String(a).toLowerCase().includes(b.toLowerCase()); break;
      }
    }
    res=res===null?r:(op==='O'?(res||r):(res&&r));
  }
  return res===null?true:res;
}

/* ---------- barcode Code128 ---------- */
function code128(txt){
  const P=['11011001100','11001101100','11001100110','10010011000','10010001100','10001001100','10011001000','10011000100','10001100100','11001001000','11001000100','11000100100','10110011100','10011011100','10011001110','10111001100','10011101100','10011100110','11001110010','11001011100','11001001110','11011100100','11001110100','11101101110','11101001100','11100101100','11100100110','11101100100','11100110100','11100110010','11011011000','11011000110','11000110110','10100011000','10001011000','10001000110','10110001000','10001101000','10001100010','11010001000','11000101000','11000100010','10110111000','10110001110','10001101110','10111011000','10111000110','10001110110','11101110110','11010001110','11000101110','11011101000','11011100010','11011101110','11101011000','11101000110','11100010110','11101101000','11101100010','11100011010','11101111010','11001000010','11110001010','10100110000','10100001100','10010110000','10010000110','10000101100','10000100110','10110010000','10110000100','10011010000','10011000010','10000110100','10000110010','11000010010','11001010000','11110111010','11000010100','10001111010','10100111100','10010111100','10010011110','10111100100','10011110100','10011110010','11110100100','11110010100','11110010010','11011011110','11011110110','11110110110','10101111000','10100011110','10001011110','10111101000','10111100010','11110101000','11110100010','10111011110','10111101110','11101011110','11110101110','11010000100','11010010000','11010011100','1100011101011'];
  const s=String(txt||''); let sum=104, out=P[104];
  for(let i=0;i<s.length;i++){const v=s.charCodeAt(i)-32; if(v<0||v>94) continue; out+=P[v]; sum+=v*(i+1);}
  out+=P[sum%103]+P[106];
  return out;
}
function hash32(s){let h=2166136261;for(let i=0;i<String(s).length;i++){h^=String(s).charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function matrice(txt,n){
  let h=hash32(txt||' '), m=[];
  for(let y=0;y<n;y++){m.push([]);for(let x=0;x<n;x++){h=(Math.imul(h,1664525)+1013904223)>>>0;m[y].push((h>>>16)&1);}}
  return m;
}
function disegnaMatrice(m,px,finder){
  const n=m.length;
  if(finder){
    const F=(ox,oy)=>{for(let y=0;y<7;y++)for(let x=0;x<7;x++){
      const b=(x===0||x===6||y===0||y===6)||(x>=2&&x<=4&&y>=2&&y<=4);
      if(oy+y<n&&ox+x<n) m[oy+y][ox+x]=b?1:0;}};
    F(0,0);F(n-7,0);F(0,n-7);
  }
  return `<div style="display:grid;grid-template-columns:repeat(${n},${px}px);line-height:0">
    ${m.map(r=>r.map(v=>`<span style="width:${px}px;height:${px}px;background:${v?'#000':'#fff'}"></span>`).join('')).join('')}</div>`;
}
function pdf417HTML(txt,w,h){
  let hh=hash32(txt||' '), righe=[];
  for(let r=0;r<6;r++){let s='';for(let i=0;i<58;i++){hh=(Math.imul(hh,22695477)+1)>>>0;s+=((hh>>>17)&1)?'1':'0';}righe.push('11111011'+s+'110101');}
  const bw=Math.max(0.6,w/righe[0].length);
  return `<div style="line-height:0">${righe.map(r=>`<div style="height:${h/6}px;white-space:nowrap">
    ${r.split('').map(b=>`<span style="display:inline-block;width:${bw}px;height:${h/6}px;background:${b==='1'?'#000':'#fff'}"></span>`).join('')}</div>`).join('')}</div>`;
}
function simboloHTML(c,val,wpx,hpx){
  const tipo=c.bc||'code128';
  if(tipo==='qr') return disegnaMatrice(matrice(val,25),Math.max(1,Math.min(wpx,hpx)/25),true);
  if(tipo==='datamatrix'){
    const n=18,m=matrice(val,n);
    for(let i=0;i<n;i++){m[n-1][i]=1;m[i][0]=1;m[0][i]=i%2;m[i][n-1]=i%2;}
    return disegnaMatrice(m,Math.max(1,Math.min(wpx,hpx)/n),false);
  }
  if(tipo==='pdf417') return pdf417HTML(val,wpx,hpx);
  return barcodeHTML(val,hpx,c.bw||1);
}
function barcodeHTML(txt,h,bw){
  const b=code128(txt); let html='',run=1;
  for(let i=0;i<b.length;i++){
    if(b[i]===b[i+1]){run++;continue;}
    html+=`<span style="display:inline-block;width:${run*1.1*(bw||1)}px;height:${h}px;background:${b[i]==='1'?'#000':'transparent'}"></span>`;
    run=1;
  }
  return `<div style="line-height:0;white-space:nowrap">${html}</div>`;
}

/* etichette assegnate: per sottogruppo, con eccezione sull'articolo */
let ETICH_SG={'A catena':['ETI-LAV','ETI-TELO'],'Plissé':['ETI-LAV','ETI-GUI','ETI-IMB'],'Fisse':['ETI-LAV']};
function etichetteDi(cod){
  const a=PRODOTTI.find(p=>p.cod===cod)||{};
  if(a.etichette&&a.etichette.length) return a.etichette;
  if(a.etichette&&a.etichetteVuote) return [];
  return ETICH_SG[a.sg]||[];
}
function etichetteDocumento(d){
  const out=[];
  (d.voci||[]).forEach((v,i)=>{
    const lista=etichetteDi(v.cod);
    for(let p=1;p<=(v.qta||1);p++) lista.forEach(id=>{
      const m=MODSTAMPA.find(x=>x.id===id); if(m) out.push({m,v,i,p});
    });
  });
  return out;
}

function righeTaglio(d){
  const out=[];
  (d.voci||[]).forEach((v,i)=>{
    const a=PRODOTTI.find(p=>p.cod===v.cod); if(!a||!a.db) return;
    a.db.forEach(r=>{
      const lun=valuta(r.formula,d,v,i,1);
      out.push({v,i,prof:r.prof,desc:r.desc,lun:(''+lun).replace('.',','),q:(r.q||1)*(v.qta||1)});
    });
  });
  return out;
}

function stampaDistinta(){
  if(!D) return avviso('Apri prima una commessa.');
  const m=MODSTAMPA.find(x=>x.tipo==='distinta');
  const righe=righeTaglio(D);
  if(!righe.length) return avviso('Nessun articolo di questa commessa ha una distinta base configurata.');
  const ctx0={d:D,v:D.voci[0],i:0,p:1};
  const ov=document.createElement('div'); ov.className='overlay'; ov.id='ovstampa';
  ov.innerHTML=`<div class="stampa-wrap">

function vociCommercializzate(d){
  const out=[];
  (d.voci||[]).forEach((v,i)=>{
    const a=PRODOTTI.find(p=>p.cod===v.cod);
    if(a&&a.commercializzato) out.push({v,i,a});
    (v.acc||[]).forEach(r=>{const ar=PRODOTTI.find(p=>p.cod===r.cod);
      if(ar&&ar.commercializzato) out.push({v,i,a:ar,acc:r});});
  });
  return out;
}

function rendiCella(c,ctx,sel,edit){
  const vis=condizione(c.cond,ctx.d,ctx.v,ctx.i,ctx.p,ctx.r);
  if(!vis&&!edit) return '';
  let dentro='';
  const testo=()=>espandi(c.val,ctx.d,ctx.v,ctx.i,ctx.p,ctx.r);
  if(c.t==='barcode'){
    const vv=testo(), mostra=c.mostraTesto!==false;
    const hs=Math.max(6,c.h*mm()-(mostra?(c.dimTesto||7)*ZOOM+2:0));
    dentro=`<div style="display:flex;flex-direction:column;align-items:center;width:100%">
      ${simboloHTML(c,vv,c.w*mm(),hs)}
      ${mostra?`<div style="font-size:${(c.dimTesto||7)*ZOOM}px;text-align:center;margin-top:1px">${vv}</div>`:''}</div>`;
  }
  else if(c.t==='formula') dentro=valuta(c.val,ctx.d,ctx.v,ctx.i,ctx.p,ctx.r);
  else if(c.t==='linea') dentro='';
  else dentro=testo();
  const alv={alto:'flex-start',centro:'center',basso:'flex-end'}[c.av||'alto'];
  const alo={sx:'flex-start',centro:'center',dx:'flex-end'}[c.ao||'sx'];
  const stile=[
    `left:${c.x*mm()}px`,`top:${c.y*mm()}px`,`width:${c.w*mm()}px`,
    (c.adattaAlt?'min-height':'height')+`:${c.h*mm()}px`,
    `font-size:${(c.dim||9)*1.05*ZOOM}px`,`font-weight:${c.gr?700:400}`,
    c.cor?`color:${c.cor}`:'', c.sf?`background:${c.sf}`:'',
    c.bordo?`border:${Math.max(1,ZOOM)}px solid ${c.cor||'#000'}`:'',
    `justify-content:${alo}`,`align-items:${alv}`,`text-align:${{sx:'left',centro:'center',dx:'right'}[c.ao||'sx']}`,
    c.capo?'white-space:normal;word-break:break-word':'white-space:nowrap',
    c.rot?`transform:rotate(${c.rot}deg);transform-origin:left top`:'',`z-index:${(c.i||0)+1}`,
    c.t==='linea'?`border-top:${Math.max(1,ZOOM)}px solid ${c.cor||'#000'};height:0`:''
  ].filter(Boolean).join(';');
  const scala=c.adatta?`<span style="display:inline-block;transform-origin:${(c.ao||'sx')==='sx'?'left':(c.ao==='dx'?'right':'center')} center" data-fit="1">${dentro}</span>`:dentro;
  return `<div class="pcella ${sel?'sel':''} ${edit?'edit':''} ${(!vis&&edit)?'nascosta':''}" data-c="${c.i}" style="${stile}">
    ${scala}${sel&&edit?'<span class="hres"></span>':''}</div>`;
}

function adattaContenuti(){

}

function bindProduzione(){
  const m=MODSTAMPA.find(x=>x.id===prodSel); const T=()=>{dirtyProd=true;render();};

  document.querySelectorAll('.pcella').forEach(el=>{
    el.onmousedown=ev=>{
      if(ev.target.classList.contains('hres')) return;

      const mv=e2=>{
        c.x=Math.max(0,snap(cx+(e2.clientX-x0)/mm()));

      };
      const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);T();};

      ev.preventDefault();ev.stopPropagation();

      const mv=e2=>{
        c.w=Math.max(3,snap(cw+(e2.clientX-x0)/mm()));
        c.h=Math.max(2,snap(ch+(e2.clientY-y0)/mm()));

    const y0=ev.clientY,h0=AREA_H, area=document.getElementById('parea');

    const mt=document.getElementById('pc_mt'); if(mt) mt.onchange=e=>{c.mostraTesto=e.target.checked;T();};
    const su=document.getElementById('pc_su');
    if(su) su.onclick=()=>{if(cellaSel<m.celle.length-1){const t2=m.celle[cellaSel];m.celle[cellaSel]=m.celle[cellaSel+1];m.celle[cellaSel+1]=t2;cellaSel++;T();}};
    const gi=document.getElementById('pc_giu');

    tog('pc_gr','gr'); tog('pc_bordo','bordo'); tog('pc_capo','capo'); tog('pc_adatta','adatta'); tog('pc_altauto','adattaAlt');
    const sfno=document.getElementById('pc_sfno'); if(sfno) sfno.onclick=()=>{c.sf='';T();};

let D=null;

function nuovaVoce(cod,mis,qta){
  const a=PRODOTTI.find(p=>p.cod===cod)||PRODOTTI[0];
  const spec={}; (a.spec||[]).forEach(s=>spec[s.id]='');
  return {cod:a.cod,mis:mis||[0,0,0],qta:qta||1,spec,sconto:0,prezzo:null,note:'',acc:[]};
}
function voceIncompleta(v){
  const a=PRODOTTI.find(p=>p.cod===v.cod)||{}, man=[];
  (a.mis||[]).forEach((m,i)=>{if(m.on&&!(v.mis[i]>0)) man.push(m.n||('Misura '+(i+1)));});
  (a.spec||[]).forEach(s=>{const l=LIB.find(x=>x.id===s.id); if(l&&!v.spec[s.id]) man.push(l.nome);});
  return man;
}
function documentoIncompleto(){
  const p=[];
  if(!D.cli) p.push('cliente non selezionato');
  if(!D.voci.length) p.push('nessuna voce inserita');
  D.voci.forEach((v,i)=>{const m=voceIncompleta(v); if(m.length) p.push(`voce ${i+1} — manca: ${m.join(', ')}`);});
  return p;
}

function calcolaFormula(f,m){
  try{
    if(!f||!f.trim()) return null;
    const e=f.replace(/misura([123])/g,(_,d)=>String(m[+d-1]||0));
    if(/[^0-9+\-*/(). ]/.test(e)) return null;
    const r=Function('"use strict";return ('+e+')')();
    return isFinite(r)?r:null;
  }catch(x){return null;}
}

function prezzoBase(v){
  const a=PRODOTTI.find(p=>p.cod===v.cod);
  if(!a) return 0;
  if(v.prezzo!==null&&v.prezzo!==undefined) return v.prezzo;
  let netto=null, magg=0;
  (a.spec||[]).forEach(s=>{
    const val=v.spec[s.id]; if(!val) return;
    if(s.prezzi&&s.prezzi[val]!==undefined){netto=s.prezzi[val];return;}
    const l=LIB.find(x=>x.id===s.id), vv=l&&l.valori.find(z=>z.v===val);
    if(vv&&vv.m) magg+=vv.m;
  });
  if(a.tipo==='tabella'&&a.tab){
    const i=a.tab.righe.findIndex(r=>v.mis[0]<=r), j=a.tab.col.findIndex(c=>v.mis[1]<=c);
    const p=(i>=0&&j>=0)?a.tab.pr[i+'|'+j]:undefined;
    return p===undefined?0:p+magg;
  }
  return (netto!==null?netto:a.prezzo)+magg;
}

function calcVoce(v){
  const a=PRODOTTI.find(p=>p.cod===v.cod)||{};
  if(voceIncompleta(v).length) return {q:null,base:0,um:a.um||'PZ',p:0,imp:0,acc:0,tot:0,minApplicato:false,incompleta:true};
  let base=v.qta, um=a.um||'PZ', q=null;
  if(a.tipo==='misura'){ q=calcolaFormula(a.formula,v.mis); base=(q===null?0:Math.max(q,a.qmin||0))*v.qta; }
  else if(a.tipo==='tabella'){ base=v.qta; um='PZ'; }
  const p=prezzoBase(v);
  const imp=base*p*(1-(v.sconto||0)/100);
  const acc=(v.acc||[]).reduce((t,r)=>{
    const ar=PRODOTTI.find(x=>x.cod===r.cod)||{};
    let qa=r.q;
    if(ar.tipo==='misura'){
      const qq=calcolaFormula(ar.formula,v.mis);
      const min=ar.qminArt?(a.qmin||0):(ar.qmin||0);
      qa=(qq===null?0:Math.max(qq,min))*v.qta;
    } else qa=r.q*v.qta;
    return t+qa*(ar.prezzo||0)*(1-(r.sconto||0)/100);
  },0);
  return {q,base,um,p,imp,acc,tot:imp+acc,minApplicato:q!==null&&q<(a.qmin||0)};
}
const totDoc=()=>(D.voci||[]).reduce((t,v)=>t+calcVoce(v).tot,0);

function componentiDaScaricare(){
  const agg={};
  (D.voci||[]).forEach(v=>{
    const a=PRODOTTI.find(p=>p.cod===v.cod); if(!a||!a.haComp) return;
    (a.comp||[]).forEach(r=>{
      let cod=r.cod;
      if(r.specId){ const val=v.spec[r.specId]; if(val&&r.mappa&&r.mappa[val]) cod=r.mappa[val]; }
      if(!cod) return;
      agg[cod]=(agg[cod]||0)+(r.q||0)*v.qta;
    });
  });
  return Object.entries(agg).map(([cod,q])=>({cod,q,desc:(COMP.find(c=>c.cod===cod)||{}).desc||''}));
}

    if(e.target.checked){ if(!m.campi[g].includes(campo)) m.campi[g].push(campo); }

 {k:'pos',l:'Pos.',w:'5%'},{k:'cod',l:'Codice',w:'10%'},{k:'desc',l:'Descrizione',w:''},
 {k:'m1',l:'Misura 1',w:'11%'},{k:'m2',l:'Misura 2',w:'11%'},{k:'m3',l:'Misura 3',w:'10%'},
 {k:'spec',l:'Specifiche',w:'16%'},{k:'acc',l:'Accessori',w:'18%'},

 {k:'accimp',l:'Tot. accessori',w:'10%',r:1},{k:'tot',l:'Totale',w:'10%',r:1}
];
let RIEPON=['pos','cod','desc','m1','m2','spec','acc','pezzi','qta','prezzo','tot'], riepConf=false;

function cellaRiep(k,v,i){
  const a=PRODOTTI.find(p=>p.cod===v.cod)||{}, c=calcVoce(v);
  const mis=n=>{const m=(a.mis||[])[n]; if(!m||!m.on) return '—';
    return `<span style="color:var(--faint);font-size:11px">${m.n||'Misura '+(n+1)}</span> <b class="mono">${v.mis[n]}</b>`;};
  switch(k){
    case 'pos': return `<span class="mono">${String(i+1).padStart(2,'0')}</span>`;
    case 'cod': return `<span class="mono">${v.cod}</span>`;
    case 'desc': return a.desc||'';
    case 'm1': return mis(0); case 'm2': return mis(1); case 'm3': return mis(2);
    case 'spec': return Object.entries(v.spec).map(([id,val])=>{const l=LIB.find(x=>x.id===id);
      return `<div style="font-size:11.5px"><span style="color:var(--faint)">${l?l.nome:''}:</span> ${val}</div>`;}).join('')||'—';
    case 'acc': return v.acc.length?v.acc.map(r=>{const ar=PRODOTTI.find(p=>p.cod===r.cod)||{};
      let qa=r.q*v.qta;
      if(ar.tipo==='misura'){const qq=calcolaFormula(ar.formula,v.mis);
        const min=ar.qminArt?(a.qmin||0):(ar.qmin||0); qa=(qq===null?0:Math.max(qq,min))*v.qta;}
      return `<div style="font-size:11.5px;display:flex;justify-content:space-between;gap:8px">
        <span>${ar.desc||r.cod}</span><b class="mono">${eur(qa*(ar.prezzo||0)*(1-(r.sconto||0)/100))}</b></div>`;}).join(''):'—';
    case 'pezzi': return v.qta;
    case 'qta': return c.base?q3n(c.base)+' '+c.um.toLowerCase():'—';
    case 'prezzo': return eur(c.p);
    case 'sconto': return (v.sconto||0)+' %';
    case 'accimp': return c.acc?eur(c.acc):'—';
    case 'tot': return `<b>${eur(c.tot)}</b>`;
  }
  return '';
}

    <div style="margin-top:14px"><button class="btn pri" id="vaddvuoto">+ Aggiungi voce</button></div></div>`;
  const v=D.voci[D.pos], a=PRODOTTI.find(p=>p.cod===v.cod)||{}, c=calcVoce(v);
  const sotto=GRUPPI[a.g]||[];
  return `
  <div class="panel" style="border-radius:14px;border:1px solid var(--line);background:var(--paper)">
    <div style="padding:16px 18px">
      <div class="posline" style="display:flex;align-items:center;gap:14px;margin-bottom:14px">
        <b>Pos. ${D.pos+1} di ${D.voci.length}</b>
        <span style="display:flex;align-items:center;gap:8px"><span style="font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)">Codice</span>
          <input class="mono" id="vcod" list="vcodici" value="${v.cod}" style="width:150px;height:31px;border:1px solid var(--line-strong);border-radius:8px;padding:4px 9px;font-family:'Cascadia Mono',Consolas,ui-monospace,monospace">
          <datalist id="vcodici">${PRODOTTI.filter(p=>p.kind==='art').map(p=>`<option value="${p.cod}">${p.desc}</option>`).join('')}</datalist></span>
        <span id="vmsg" style="font-size:11.5px;color:var(--muted)">digita il codice e premi Invio</span>
      </div>

      <div style="display:grid;grid-template-columns:330px 320px 1fr;gap:24px">
        <div class="form">
          <div class="form f2">
            <label class="f"><span>Gruppo</span><select id="vg">${Object.keys(GRUPPI).map(g=>`<option ${a.g===g?'selected':''}>${g}</option>`).join('')}</select></label>
            <label class="f"><span>Sottogruppo</span><select id="vsg">${sotto.map(s=>`<option ${a.sg===s?'selected':''}>${s}</option>`).join('')}</select></label>
          </div>
          <label class="f"><span>Articolo</span><select id="vart">
            ${PRODOTTI.filter(p=>p.kind==='art'&&p.g===a.g&&p.sg===a.sg).map(p=>`<option value="${p.cod}" ${p.cod===v.cod?'selected':''}>${p.desc}</option>`).join('')}</select></label>
          <div class="form f2">${(a.mis||[]).map((m,i)=>m.on?`
            <label class="f"><span>${m.n||'Misura '+(i+1)} (mm) <b>*</b></span>
              <input class="num ${v.mis[i]>0?'':'obbl'}" data-mis="${i}" value="${v.mis[i]||''}" placeholder="obbligatoria"></label>`:'').join('')}</div>
          <div class="form f2">${(a.spec||[]).map(s=>{const l=LIB.find(x=>x.id===s.id); if(!l)return'';
            return `<label class="f"><span>${l.nome} <b>*</b></span><select data-spec="${s.id}" class="${v.spec[s.id]?'':'obbl'}">
              <option value="" ${v.spec[s.id]?'':'selected'}>— da scegliere —</option>
              ${l.valori.map(x=>`<option ${v.spec[s.id]===x.v?'selected':''}>${x.v}</option>`).join('')}</select></label>`;}).join('')}</div>
        </div>

        <div class="form">
          <div class="form f2">
            <label class="f"><span>Unità di misura</span><input value="${a.um||''}" disabled></label>
            <label class="f"><span>Prezzo</span><input class="num" id="vp" value="${c.p.toLocaleString('it-IT',{minimumFractionDigits:2})}"></label>
          </div>
          <div class="form f2">
            <label class="f"><span>Sconto %</span><input class="num" id="vsc" value="${v.sconto||0}"></label>
            <label class="f"><span>Pezzi</span><input class="num" id="vq" value="${v.qta}"></label>
          </div>
          <div class="box" style="background:var(--sunk);border:1px solid var(--line);border-radius:11px;padding:12px 15px">
            <div style="display:flex;justify-content:space-between;align-items:baseline">
              <span style="font-size:12.5px;color:var(--muted)">${a.um==='MQ'?'Superficie totale':a.um==='MTL'?'Lunghezza totale':'Quantità totale'}</span>
              <b class="mono" style="font-size:16px">${c.base?q3n(c.base)+' '+(a.um||'').toLowerCase():'—'}</b></div>
            ${c.incompleta?`<div style="font-size:11.5px;color:var(--alert);margin-top:4px">completa misure e specifiche per calcolare</div>`:''}
            ${c.minApplicato?`<div style="font-size:11.5px;color:var(--alert);margin-top:4px">minimo fatturabile ${a.qmin} applicato</div>`:''}
            ${v.prezzo!==null&&v.prezzo!==undefined?`<div style="font-size:11.5px;color:var(--alert);margin-top:4px">prezzo forzato a mano</div>`:''}
          </div>
          <label class="f"><span>Note della voce</span><textarea id="vnote" rows="2">${v.note||''}</textarea></label>
        </div>

        <div>
          <h3 style="margin:0 0 9px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:10px">
            Accessori
            <select class="filt" id="vaddacc" style="margin-left:auto;height:29px">
              <option value="">Aggiungi…</option>
              ${(a.accComp||[]).filter(x=>!v.acc.some(r=>r.cod===x)).map(x=>{const ar=PRODOTTI.find(p=>p.cod===x)||{};return `<option value="${x}">${x} — ${ar.desc||''}</option>`;}).join('')}
            </select></h3>
          ${v.acc.length?`<table><thead><tr><th>Accessorio</th><th class="r" style="width:16%">Qtà calc.</th>
            <th class="r" style="width:15%">Listino</th><th class="r" style="width:13%">Sconto</th><th class="r" style="width:16%">Prezzo</th><th style="width:5%"></th></tr></thead><tbody>
            ${v.acc.map((r,i)=>{const ar=PRODOTTI.find(p=>p.cod===r.cod)||{};
              let qa=r.q*v.qta;
              if(ar.tipo==='misura'){const qq=calcolaFormula(ar.formula,v.mis);
                const min=ar.qminArt?(a.qmin||0):(ar.qmin||0); qa=(qq===null?0:Math.max(qq,min))*v.qta;}
              return `<tr><td>${ar.desc||r.cod}</td><td class="num">${q3n(qa)}</td>
                <td class="num">${eur(ar.prezzo||0)}</td>
                <td class="num"><input class="num" data-asc="${i}" value="${r.sconto||0}" style="height:26px;width:56px"></td>
                <td class="num">${eur(qa*(ar.prezzo||0)*(1-(r.sconto||0)/100))}</td>
                <td><button style="border:0;background:none;color:var(--alert);cursor:pointer" data-adel="${i}">✕</button></td></tr>`;}).join('')}
            </tbody></table>`:'<div class="vuoto">Nessun accessorio su questa voce</div>'}
        </div>
      </div>
    </div>

    <div class="footbar" style="border-radius:0 0 13px 13px">
      <span class="info">Totale voce <b>${eur(c.tot)}</b> · documento <b>${eur(totDoc())}</b></span>
      <div class="r">
        <button class="btn pri" id="vadd">Aggiungi voce</button>
        <button class="btn" id="vdup">Duplica voce</button>
        <button class="btn dg" id="vdel">Elimina voce</button>
        <button class="btn" id="vprev" ${D.pos===0?'disabled':''}>◀ Precedente</button>
        <button class="btn" id="vnext" ${D.pos>=D.voci.length-1?'disabled':''}>Successiva ▶</button>
      </div>
    </div>
  </div>`;
}

function bindDoc(){
  if(!D) return;
  const R=()=>render();
  document.querySelectorAll('.sect button[data-t]').forEach(b=>b.onclick=()=>{D.tab=b.dataset.t;R();});
  document.getElementById('dchiudi').onclick=()=>{voce='elenco';D=null;R();};
  document.getElementById('dcant').oninput=e=>D.cant=e.target.value;
  const sincro=()=>{const r=(D.tipo==='commesse'?DOCS:PREV).find(x=>x.n===D.n);
    if(r){r.data=D.data;r.lav=D.lav;r.cons=D.cons;}};
  document.getElementById('ddata').onchange=e=>{D.data=itData(e.target.value);sincro();R();};
  document.getElementById('dlav').onchange=e=>{
    D.lav=itData(e.target.value);
    if(D.cons&&isoData(D.cons)<e.target.value){D.cons=D.lav;avviso('La consegna non può precedere la lavorazione: l\u2019ho allineata.');}
    sincro();R();};
  document.getElementById('dcons').onchange=e=>{
    const iso=e.target.value;
    if(iso&&isoData(D.lav)&&iso<isoData(D.lav)) return avviso('<b>Data non valida</b> — la consegna non può precedere la lavorazione.');
    D.cons=itData(iso);sincro();R();};
  document.getElementById('dag').onchange=e=>D.agente=e.target.value;
  document.getElementById('dtec').onchange=e=>D.tecnico=e.target.value;
  document.getElementById('dcli').onclick=()=>cercaCliente(c=>{
    D.cli=c.nome; const r=(D.tipo==='commesse'?DOCS:PREV).find(x=>x.n===D.n); if(r) r.cli=c.nome;
    render(); avviso(`Cliente <b>${c.nome}</b> selezionato · listino ${c.listino}, sconto ${c.sconto}%.`);
  });
  const bm=document.getElementById('dstampa'), mn=document.getElementById('dmenu');
  bm.onclick=e=>{e.stopPropagation();mn.style.display=mn.style.display==='none'?'block':'none';};
  document.addEventListener('click',()=>{if(mn)mn.style.display='none';},{once:true});
  mn.querySelectorAll('.mi').forEach(d=>{
    d.onmouseenter=()=>d.style.background='var(--accent-soft)';
    d.onmouseleave=()=>d.style.background='';
    d.onclick=()=>{mn.style.display='none';
      if(d.dataset.m==='__conf'){sez='impostazioni';voce='stampe';render();return;}
      if(d.dataset.m==='__etich'){stampaEtichette();return;}
      if(d.dataset.m==='__dist'){stampaDistinta();return;}
      const mp=MODSTAMPA.find(x=>x.id===d.dataset.m);
      if(mp){ anteprimaProduzione(mp); return; }
      anteprimaStampa(d.dataset.m,D.n);};
  });

  const tt=document.getElementById('t_target');
  if(tt) tt.onchange=e=>{
    const merce=totDoc(), obiettivo=numIt(e.target.value);
    if(!isNaN(obiettivo)&&merce>0){ D.scontoFin=Math.max(0,(1-obiettivo/merce)*100); }
    R();
  };
  const ts=document.getElementById('t_sc');
  if(ts) ts.onchange=e=>{const n=numIt(e.target.value); D.scontoFin=isNaN(n)?0:Math.max(0,Math.min(100,n)); R();};
  const tr=document.getElementById('t_tr');
  if(tr) tr.onchange=e=>{const n=numIt(e.target.value); D.trasporto=isNaN(n)?0:n; R();};
  document.getElementById('ddist').onclick=stampaDistinta;
  const bo=document.getElementById('dordina'); if(bo) bo.onclick=ordinaFornitore;
  const df=document.getElementById('dforn'); if(df) df.onchange=e=>{D.fornitore=e.target.value;};
  document.getElementById('dwa').onclick=()=>{
    const cl=ANAG.clienti.dati.find(c=>c.nome===D.cli);
    avviso(cl&&cl.wa?`Invio del PDF a <b>${cl.nome}</b> su WhatsApp (${cl.wa}).`:'Questo cliente non ha un numero WhatsApp in anagrafica.');
  };
  document.getElementById('dsalva').onclick=()=>{
    const p=documentoIncompleto();
    if(p.length) return avviso('<b>Non posso registrare, mancano dei dati</b><br>· '+p.join('<br>· '));
    avviso(`Documento <b>${D.n}</b> registrato.`);
  };

  const st=document.getElementById('dstato');
  st.onchange=e=>{
    const nuovo=e.target.value;
    const man=documentoIncompleto();
    if(man.length){ e.target.value=D.stato; return avviso('<b>Non posso cambiare stato, mancano dei dati</b><br>· '+man.join('<br>· ')); }
    if(nuovo==='In lavorazione'&&!D.scarico){ chiediLavorazione(); e.target.value=D.stato; return; }
    D.stato=nuovo; R();
  };

  const bagg=document.getElementById('dagg'); if(bagg) bagg.onclick=aggiornaScarico;
  const dm=document.getElementById('dmont');
  if(dm) dm.onchange=e=>{D.montaggio=e.target.value==='Con montaggio';};
  if(D.tab==='riep'){
    document.querySelectorAll('#view tr[data-pos]').forEach(tr=>{
      tr.onclick=()=>{D.pos=+tr.dataset.pos;R();};
      tr.ondblclick=()=>{D.pos=+tr.dataset.pos;D.tab='dett';R();};});
    document.getElementById('riepconf').onclick=()=>{riepConf=!riepConf;R();};
    document.querySelectorAll('[data-rc]').forEach(c=>c.onchange=e=>{
      const k=e.target.dataset.rc;
      RIEPON=e.target.checked?RIEPCOL.map(x=>x.k).filter(x=>RIEPON.includes(x)||x===k):RIEPON.filter(x=>x!==k);
      R();});
    const rr=document.getElementById('riepreset');
    if(rr) rr.onclick=()=>{RIEPON=['pos','cod','desc','m1','m2','spec','acc','pezzi','qta','prezzo','tot'];R();};
    const rs=document.getElementById('riepsalva');
    if(rs) rs.onclick=()=>{riepConf=false;R();avviso('Layout delle colonne salvato per il tuo utente.');};
    document.getElementById('rapri').onclick=()=>{D.tab='dett';R();};
    document.getElementById('raddv').onclick=()=>{D.voci.push(nuovaVoce('ZC50-L'));D.pos=D.voci.length-1;D.tab='dett';R();};
    return;
  }
  if(D.tab!=='dett') return;
  const bv=document.getElementById('vaddvuoto');
  if(bv){ bv.onclick=()=>{D.voci.push(nuovaVoce('ZC50-L'));D.pos=0;R();}; }
  if(!D.voci.length) return;

  const v=D.voci[D.pos], a=PRODOTTI.find(p=>p.cod===v.cod)||{};
  const cambiaArticolo=cod=>{
    const nv=nuovaVoce(cod,null,v.qta); nv.sconto=v.sconto; nv.note=v.note;
    D.voci[D.pos]=nv; R();
  };
  const vc=document.getElementById('vcod');
  vc.addEventListener('keydown',e=>{
    if(e.key!=='Enter') return; e.preventDefault();
    const p=PRODOTTI.find(x=>x.cod.toUpperCase()===vc.value.trim().toUpperCase()&&x.kind==='art');
    if(!p){document.getElementById('vmsg').textContent='Codice non trovato';document.getElementById('vmsg').style.color='var(--alert)';return;}
    cambiaArticolo(p.cod);
  });
  document.getElementById('vg').onchange=e=>{
    const g=e.target.value, sg=GRUPPI[g][0];
    const p=PRODOTTI.find(x=>x.kind==='art'&&x.g===g&&x.sg===sg)||PRODOTTI.find(x=>x.kind==='art'&&x.g===g);
    if(p) cambiaArticolo(p.cod); else avviso('Nessun articolo in questo gruppo.');
  };
  document.getElementById('vsg').onchange=e=>{
    const p=PRODOTTI.find(x=>x.kind==='art'&&x.g===a.g&&x.sg===e.target.value);
    if(p) cambiaArticolo(p.cod); else avviso('Nessun articolo in questo sottogruppo.');
  };
  document.getElementById('vart').onchange=e=>cambiaArticolo(e.target.value);
  document.querySelectorAll('[data-mis]').forEach(i=>i.onchange=e=>{v.mis[+e.target.dataset.mis]=numIt(e.target.value)||0;R();});
  document.querySelectorAll('[data-spec]').forEach(s=>s.onchange=e=>{v.spec[e.target.dataset.spec]=e.target.value;v.prezzo=null;R();});
  document.getElementById('vp').onchange=e=>{const n=numIt(e.target.value); v.prezzo=isNaN(n)?null:n; R();};
  document.getElementById('vsc').onchange=e=>{v.sconto=numIt(e.target.value)||0;R();};
  document.getElementById('vq').onchange=e=>{v.qta=Math.max(1,numIt(e.target.value)||1);R();};
  document.getElementById('vnote').onchange=e=>v.note=e.target.value;
  const aa=document.getElementById('vaddacc');
  if(aa) aa.onchange=e=>{if(!e.target.value)return;v.acc.push({cod:e.target.value,q:1,sconto:0});R();};
  document.querySelectorAll('[data-asc]').forEach(i=>i.onchange=e=>{v.acc[+e.target.dataset.asc].sconto=numIt(e.target.value)||0;R();});
  document.querySelectorAll('[data-adel]').forEach(b=>b.onclick=e=>{v.acc.splice(+e.target.dataset.adel,1);R();});
  document.getElementById('vadd').onclick=()=>{D.voci.push(nuovaVoce('ZC50-L'));D.pos=D.voci.length-1;R();};
  document.getElementById('vdup').onclick=()=>{D.voci.splice(D.pos+1,0,JSON.parse(JSON.stringify(v)));D.pos++;R();};
  document.getElementById('vdel').onclick=()=>{D.voci.splice(D.pos,1);D.pos=Math.max(0,D.pos-1);R();};
  document.getElementById('vprev').onclick=()=>{D.pos--;R();};
  document.getElementById('vnext').onclick=()=>{D.pos++;R();};
}

/* ---------- conferma lavorazione e ripristino ---------- */
function fabbisognoCambiato(){
  if(!D||!D.scarico) return null;
  const ora=componentiDaScaricare(), diff=[];
  const mappa={}; D.scarico.forEach(c=>mappa[c.cod]=c.q);
  ora.forEach(c=>{const d=c.q-(mappa[c.cod]||0); if(Math.abs(d)>0.0001) diff.push({cod:c.cod,desc:c.desc,d});delete mappa[c.cod];});
  Object.entries(mappa).forEach(([cod,q])=>diff.push({cod,desc:(COMP.find(x=>x.cod===cod)||{}).desc||'',d:-q}));
  return diff.length?diff:null;
}

function tabellaScarico(comp,titolo){
  return `<div style="margin-bottom:9px">${titolo}</div>
    <table style="border:1px solid var(--line);border-radius:9px;overflow:hidden">
      <thead><tr><th>Componente</th><th class="r" style="width:23%">Quantità</th>
      <th class="r" style="width:20%">Giacenza</th><th class="r" style="width:20%">Dopo</th></tr></thead>
      <tbody>${comp.length?comp.map(c=>{const q=c.q!==undefined?c.q:c.d, g=giac(c.cod), dopo=g-q;
        return `<tr><td><b class="mono">${c.cod}</b> ${c.desc}</td>
          <td class="num" style="color:${q<0?'var(--ok)':'var(--alert)'}">${q>0?'−':'+'}${q3n(Math.abs(q))}</td>
          <td class="num">${q3n(g)}</td>
          <td class="num" style="font-weight:600;color:${dopo<0?'var(--alert)':'inherit'}">${q3n(dopo)}</td></tr>`;}).join('')
        :'<tr><td class="vuoto" colspan="4">Nessun componente configurato sugli articoli di questo documento</td></tr>'}
      </tbody></table>`;
}

function chiediLavorazione(){
  const comp=componentiDaScaricare();
  const neg=comp.some(c=>giac(c.cod)-c.q<0);
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="finestra" style="width:640px"><h3>Messa in lavorazione — ${D.n} <button class="x">✕</button></h3>
    <div class="corpo">${tabellaScarico(comp,'Confermando, questi componenti verranno scaricati dal magazzino:')}
      ${neg?'<div style="color:var(--alert);margin-top:10px">Attenzione: alcune giacenze andranno in negativo.</div>':''}</div>
    <div class="piede"><button class="btn" data-no>Annulla</button>
      <button class="btn pri" data-si>Conferma e scarica</button></div></div>`;
  document.body.appendChild(ov);
  const chiudi=()=>ov.remove();
  ov.querySelector('.x').onclick=chiudi; ov.querySelector('[data-no]').onclick=chiudi;
  ov.querySelector('[data-si]').onclick=()=>{
    chiudi();
    comp.forEach(c=>MOV.push({d:oggiOra(),cod:c.cod,t:'SCARICO',q:-c.q,c:'Commessa in lavorazione',doc:D.n,u:'M. Rossi'}));
    D.scarico=comp.map(c=>({...c})); D.stato='In lavorazione';
    audit('MODIFICA','magazzino',D.n,'—',`Scarico di ${comp.length} componenti`); render();
    avviso(`Commessa in lavorazione: <b>${comp.length} componenti scaricati</b>.`);
  };
}

function aggiornaScarico(){
  const diff=fabbisognoCambiato(); if(!diff) return;
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="finestra" style="width:640px"><h3>Aggiorna scarico di magazzino <button class="x">✕</button></h3>
    <div class="corpo">${tabellaScarico(diff,'Le voci del documento sono cambiate. Rettifiche da registrare:')}</div>
    <div class="piede"><button class="btn" data-no>Più tardi</button>
      <button class="btn pri" data-si>Aggiorna magazzino</button></div></div>`;
  document.body.appendChild(ov);
  const chiudi=()=>ov.remove();
  ov.querySelector('.x').onclick=chiudi; ov.querySelector('[data-no]').onclick=chiudi;
  ov.querySelector('[data-si]').onclick=()=>{
    chiudi();
    diff.forEach(c=>MOV.push({d:oggiOra(),cod:c.cod,t:c.d>0?'SCARICO':'RIPRISTINO',q:-c.d,
      c:'Aggiornamento voci commessa',doc:D.n,u:'M. Rossi'}));
    D.scarico=componentiDaScaricare().map(c=>({...c})); render();
    avviso(`Magazzino allineato alle voci attuali: <b>${diff.length} rettifiche</b>.`);
  };
}
const oggiOra=()=>{const o=new Date();
  return `${String(o.getDate()).padStart(2,'0')}/${String(o.getMonth()+1).padStart(2,'0')}/${o.getFullYear()} ${String(o.getHours()).padStart(2,'0')}:${String(o.getMinutes()).padStart(2,'0')}`;};

function vistaImpostazioni(){
  if(!D) return `<div class="soon"><h3>Nessuna commessa aperta</h3><div>Apri una commessa dall'elenco.</div></div>`;
  return `<div class="head"><div><h1>Impostazioni commessa ${D.n}</h1><p class="sub">Operazioni straordinarie sul documento</p></div></div>
  <div class="cols"><div class="card"><h2>Giacenza</h2><div class="in">
    ${D.scarico?`<div style="margin-bottom:10px">Questa commessa ha scaricato <b>${D.scarico.length} componenti</b> quando è stata messa in lavorazione.</div>
    <table style="border:1px solid var(--line);border-radius:9px;overflow:hidden"><tbody>
      ${D.scarico.map(c=>`<tr><td><b class="mono">${c.cod}</b> ${c.desc}</td><td class="num">${q3n(c.q)}</td></tr>`).join('')}
    </tbody></table>
    <button class="btn pri" id="ripr" style="margin-top:12px">Ripristina giacenza</button>`
    :'<div style="color:var(--muted)">Nessuno scarico registrato: la commessa non è mai stata messa in lavorazione.</div>'}

function bindStati(){
  const T=()=>{dirtyStati=true;render();};
  document.querySelectorAll('[data-sn]').forEach(i=>i.onchange=e=>{
    const k=+e.target.dataset.sn, vecchio=STATI[k].n, nuovo=e.target.value.trim();
    if(!nuovo) return;
    DOCUMENTI.forEach(d=>{if(d.stato===vecchio)d.stato=nuovo;});
    STATI[k].n=nuovo;T();});
  [['sf','sf'],['sb','bo'],['st','tx']].forEach(([a,k])=>
    document.querySelectorAll(`[data-${a}]`).forEach(i=>i.oninput=e=>{STATI[+e.target.dataset[a]][k]=e.target.value;T();}));
  document.querySelectorAll('[data-sx]').forEach(b=>b.onclick=e=>{
    const s=STATI[+e.target.dataset.sx];
    const u=DOCUMENTI.filter(d=>d.stato===s.n);
    if(u.length) return avviso(`Impossibile eliminare <b>${s.n}</b>: usato da ${u.length} documenti.`);
    STATI.splice(+e.target.dataset.sx,1);T();});
  document.getElementById('stadd').onclick=()=>{STATI.push({n:'Nuovo stato',sf:'#F3F5F8',bo:'#B9C2CC',tx:'#4A5460'});T();};
  document.getElementById('stsave').onclick=()=>{dirtyStati=false;render();avviso('Stati salvati.');};
}

let A={tipo:'clienti',sort:{c:null,d:1},f:{},cerca:'',sel:null}, AS=null;

function vistaAnag(tipo){
  A={tipo,sort:{c:null,d:1},f:{},cerca:'',sel:null};
  const cfg=ANAG[tipo];
  return `
  <div class="head"><div><h1>${cfg.titolo}</h1><p class="sub">${cfg.dati.length} schede in archivio</p></div></div>
  <div class="card">
    <div class="toolbar">
      <div class="searchbox"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.3-4.3"/></svg>
        <input id="acerca" placeholder="Cerca nome, città, partita IVA…"></div>
      <button class="btn sm" id="aazzera">Azzera filtri</button>
      <span style="margin-left:auto;font-size:12px;color:var(--muted)">Doppio click per aprire la scheda</span>
    </div>
    <div class="tabwrap"><table id="atab">
      <thead><tr>${cfg.col.map((c,i)=>`<th class="sortable" data-c="${i}">${c[1]}<span class="arw">▲</span></th>`).join('')}</tr>
      <tr class="filtri">${cfg.col.map(c=>`<th><input data-f="${c[0]}" placeholder="filtra"></th>`).join('')}</tr></thead>
      <tbody id="arighe"></tbody></table></div>
    <div class="footbar">
      <span class="info" id="aselinfo">Nessuna riga selezionata</span>
      <span class="info" id="aconta"></span>
      <div class="r">
        <button class="btn pri" id="aadd">Aggiungi</button>
        <button class="btn" id="amod" disabled>Modifica</button>
        <button class="btn" id="adel" disabled>Elimina</button>
        <button class="btn" id="astampa">Stampa elenco</button>
      </div>
    </div>
  </div>`;
}
function renderAnag(){
  const cfg=ANAG[A.tipo];
  let d=cfg.dati.slice().filter(r=>{
    if(A.cerca&&!Object.values(r).join(' ').toLowerCase().includes(A.cerca)) return false;
    for(const k in A.f){ if(A.f[k]&&!String(r[k]===undefined?'':r[k]).toLowerCase().includes(A.f[k])) return false; }
    return true;
  });
  if(A.sort.c!==null){const k=cfg.col[A.sort.c][0];
    d.sort((a,b)=>String(a[k]||'').localeCompare(String(b[k]||''),'it',{numeric:true})*A.sort.d);}
  document.getElementById('arighe').innerHTML=d.length?d.map(r=>
    `<tr data-cod="${r.cod}" class="${A.sel===r.cod?'sel':''}">${cfg.col.map(c=>{
      let v=r[c[0]]; if(v===undefined||v==='') v='—';
      if(c[0]==='stato') return `<td><span class="tag ${r.attivo?'ok':''}">${r.attivo?'Attivo':'Disattivato'}</span></td>`;
      if(c[0]==='provv') return `<td class="num">${r.provv} %</td>`;
      return `<td class="${['cod','piva','tel'].includes(c[0])?'mono':''}">${v}</td>`;}).join('')}</tr>`).join('')
    :`<tr><td class="vuoto" colspan="${cfg.col.length}">Nessuna scheda con questi filtri</td></tr>`;
  document.getElementById('aconta').textContent=`${d.length} di ${cfg.dati.length}`;
  document.querySelectorAll('#arighe tr[data-cod]').forEach(tr=>{
    tr.onclick=()=>{A.sel=tr.dataset.cod;renderAnag();};
    tr.ondblclick=()=>{AS=JSON.parse(JSON.stringify(cfg.dati.find(x=>x.cod===tr.dataset.cod)));voce='scheda';render();};
  });
  ['amod','adel'].forEach(id=>document.getElementById(id).disabled=!A.sel);
  document.getElementById('aselinfo').innerHTML=A.sel?`Selezionato <b>${A.sel}</b>`:'Nessuna riga selezionata';
}
function bindAnag(){
  const cfg=ANAG[A.tipo];
  renderAnag();
  document.querySelectorAll('#atab th.sortable').forEach(th=>th.onclick=()=>{
    const c=+th.dataset.c; A.sort=(A.sort.c===c)?{c,d:-A.sort.d}:{c,d:1};
    document.querySelectorAll('#atab th.sortable').forEach(t=>{t.classList.remove('sorted');t.querySelector('.arw').textContent='▲';});
    th.classList.add('sorted');th.querySelector('.arw').textContent=A.sort.d===1?'▲':'▼';renderAnag();});
  document.querySelectorAll('#atab tr.filtri input').forEach(i=>i.oninput=()=>{A.f[i.dataset.f]=i.value.trim().toLowerCase();renderAnag();});
  document.getElementById('acerca').oninput=e=>{A.cerca=e.target.value.toLowerCase();renderAnag();};
  document.getElementById('aazzera').onclick=()=>{A.f={};A.cerca='';A.sort={c:null,d:1};
    document.querySelectorAll('#atab tr.filtri input').forEach(i=>i.value='');
    document.getElementById('acerca').value='';renderAnag();};
  document.getElementById('aadd').onclick=()=>{AS=null;voce='scheda';render();};
  document.getElementById('amod').onclick=()=>{AS=JSON.parse(JSON.stringify(cfg.dati.find(x=>x.cod===A.sel)));voce='scheda';render();};
  document.getElementById('adel').onclick=()=>{
    const u=(A.tipo==='clienti')?DOCS.concat(PREV).filter(d=>d.cli===(cfg.dati.find(x=>x.cod===A.sel)||{}).nome):[];
    if(u.length) return avviso(`Impossibile eliminare: ci sono ${u.length} documenti collegati. Disattiva la scheda invece di cancellarla.`);
    cfg.dati.splice(cfg.dati.findIndex(x=>x.cod===A.sel),1);A.sel=null;render();avviso('Scheda eliminata.');
  };
  document.getElementById('astampa').onclick=()=>avviso('Stampa dell\u2019elenco filtrato.');
}

function bindAnagScheda(){
  const cfg=ANAG[A.tipo];

          <td class="num"><input class="num" data-rp="${i}" value="${r.costo}" placeholder="${c?c.costo.toLocaleString('it-IT',{minimumFractionDigits:2}):''}" style="height:27px;width:92px"></td>
          <td class="num">${c&&q?eur(q*(co||c.costo)):'—'}</td>
          <td class="num">${c&&q?q3n(giac(c.cod)+q):'—'}</td>
          <td><button style="border:0;background:none;color:var(--alert);cursor:pointer" data-rd="${i}">✕</button></td></tr>`;}).join('')}
      </tbody></table>
  </div>`;
}
function bindCarico(){
  const R=()=>render();
  document.getElementById('car_f').onchange=e=>CAR.forn=e.target.value;
  document.getElementById('car_b').oninput=e=>CAR.bolla=e.target.value;
  document.getElementById('car_d').onchange=e=>CAR.data=e.target.value;
  document.getElementById('caradd').onclick=()=>{CAR.righe.push({cod:'',q:'',costo:''});R();};
  document.querySelectorAll('[data-rc]').forEach(s=>s.onchange=e=>{CAR.righe[+e.target.dataset.rc].cod=e.target.value;R();});
  document.querySelectorAll('[data-rq]').forEach(i=>i.onchange=e=>{CAR.righe[+e.target.dataset.rq].q=e.target.value;R();});
  document.querySelectorAll('[data-rp]').forEach(i=>i.onchange=e=>{CAR.righe[+e.target.dataset.rp].costo=e.target.value;R();});
  document.querySelectorAll('[data-rd]').forEach(b=>b.onclick=e=>{CAR.righe.splice(+e.target.dataset.rd,1);
    if(!CAR.righe.length)CAR.righe.push({cod:'',q:'',costo:''});R();});
  document.getElementById('carann').onclick=()=>{CAR={forn:FORN[0],bolla:'',data:'2026-08-12',righe:[{cod:'',q:'',costo:''}]};R();};
  document.getElementById('carreg').onclick=()=>{
    if(!CAR.bolla.trim()) return avviso('<b>Numero bolla obbligatorio</b> — serve per risalire al documento del fornitore.');
    const ok=CAR.righe.filter(r=>r.cod&&numIt(r.q)>0);
    if(!ok.length) return avviso('Nessuna riga valida: seleziona un componente e indica la quantità.');
    const d=CAR.data.split('-').reverse().join('/');
    ok.forEach(r=>MOV.push({d:d+' 12:00',cod:r.cod,t:'CARICO',q:numIt(r.q),c:'Bolla fornitore '+CAR.bolla,doc:'BF-'+CAR.bolla,u:'M. Rossi'}));
    const n=ok.length; CAR={forn:CAR.forn,bolla:'',data:CAR.data,righe:[{cod:'',q:'',costo:''}]};
    voce='giac'; R(); avviso(`Carico registrato: <b>${n} movimenti</b> creati, giacenze aggiornate.`);
  };
}

/* ---------- rettifiche e inventario ---------- */
let INV={};
function vistaInventario(){
  return `
  <div class="head"><div><h1>Rettifiche e inventario</h1>
  <p class="sub">Inserisci la quantità realmente contata: il programma calcola la differenza e registra la rettifica</p></div>
  <div class="acts"><button class="btn" id="invann">Azzera conteggio</button><button class="btn pri" id="invreg">Registra rettifiche</button></div></div>
  <div class="card">
    <div class="tabwrap"><table>
      <thead><tr><th>Codice</th><th>Componente</th><th>U.M.</th><th class="r">Giacenza a sistema</th>
      <th class="r">Contato</th><th class="r">Differenza</th></tr></thead>
      <tbody>${COMP.map(c=>{
        const g=giac(c.cod), v=INV[c.cod], diff=(v===undefined||v==='')?null:numIt(v)-g;
        return `<tr><td class="mono">${c.cod}</td><td>${c.desc}</td><td>${c.um}</td>
          <td class="num">${q3n(g)}</td>
          <td class="num"><input class="num" data-inv="${c.cod}" value="${v===undefined?'':v}" placeholder="—" style="height:27px;width:100px"></td>
          <td class="num" style="font-weight:600;color:${diff===null?'var(--muted)':(diff>0?'var(--ok)':(diff<0?'var(--alert)':'var(--muted)'))}">
            ${diff===null?'—':(diff>0?'+':'')+q3n(diff)}</td></tr>`;}).join('')}
      </tbody></table></div>
    <div class="footbar"><span class="info" id="invconta"></span>
      <div class="r"><button class="btn" id="invstampa">Stampa foglio di conta</button></div></div>
  </div>`;
}
function bindInv(){
  const conta=()=>{
    const n=Object.entries(INV).filter(([c,v])=>v!==''&&v!==undefined&&numIt(v)-giac(c)!==0).length;
    document.getElementById('invconta').textContent=n?`${n} rettifiche da registrare`:'Nessuna differenza rilevata';
  };
  document.querySelectorAll('[data-inv]').forEach(i=>i.onchange=e=>{INV[e.target.dataset.inv]=e.target.value;render();});
  document.getElementById('invann').onclick=()=>{INV={};render();};
  document.getElementById('invstampa').onclick=()=>avviso('Stampa del foglio di conta, con la colonna Contato vuota da compilare a mano.');
  document.getElementById('invreg').onclick=()=>{
    const r=Object.entries(INV).filter(([c,v])=>v!==''&&v!==undefined&&numIt(v)-giac(c)!==0);
    if(!r.length) return avviso('Nessuna differenza da registrare.');
    r.forEach(([c,v])=>MOV.push({d:'12/08/2026 12:00',cod:c,t:'RETTIFICA',q:numIt(v)-giac(c),c:'Inventario',doc:'INV-2026',u:'M. Rossi'}));
    const n=r.length; INV={}; voce='giac'; render();
    avviso(`Registrate <b>${n} rettifiche</b>: le giacenze ora coincidono con il conteggio, e la differenza resta tracciata nei movimenti.`);
  };
  conta();
}


/* ---------- scheda componente di magazzino ---------- */
let K=null;
function vistaComp(){
  const nuovo=!K;
  const k=K||{cod:'',desc:'',um:'PZ',init:0,min:0,forn:FORN[0],costo:0};
  return `
  <div class="head"><div><h1>${nuovo?'Nuovo componente':k.cod+' — '+k.desc}</h1>
  <p class="sub">Componente gestito a magazzino</p></div>
  <div class="acts"><button class="btn" id="kann">Annulla</button><button class="btn pri" id="ksalva">Salva componente</button></div></div>
  <div class="cols" style="grid-template-columns:1fr 1fr"><div class="card"><h2>Dati</h2><div class="in form">
    <div class="form f2">
      <label class="f"><span>Codice <b>*</b></span><input class="mono" id="k_cod" value="${k.cod}" ${nuovo?'':'readonly'}></label>
      <label class="f"><span>Unità di misura</span><select id="k_um">${['PZ','MQ','MTL','KG'].map(u=>`<option ${k.um===u?'selected':''}>${u}</option>`).join('')}</select></label>
    </div>
    <label class="f"><span>Descrizione <b>*</b></span><input id="k_desc" value="${k.desc}"></label>
    <div class="form f2">
      <label class="f"><span>Giacenza iniziale</span><input class="num" id="k_init" value="${k.init}" ${nuovo?'':'disabled'}></label>
      <label class="f"><span>Scorta minima</span><input class="num" id="k_min" value="${k.min}"></label>
    </div>
    <div class="form f2">
      <label class="f"><span>Fornitore abituale</span><select id="k_forn">${FORN.map(f=>`<option ${k.forn===f?'selected':''}>${f}</option>`).join('')}</select></label>
      <label class="f"><span>Costo unitario</span><input class="num" id="k_costo" value="${k.costo}"></label>
    </div>
    ${nuovo?'':`<div style="color:var(--muted);font-size:12px;margin-top:4px">La giacenza iniziale non si modifica dopo la creazione: per correggere usa una rettifica, così la differenza resta tracciata.</div>`}
  </div></div>
  ${nuovo?'':`<div class="card"><h2>Situazione</h2><div class="in">
    <div style="display:flex;justify-content:space-between;padding:6px 0"><span>Giacenza attuale</span><b class="mono" style="font-size:17px">${q3n(giac(k.cod))} ${k.um}</b></div>
    <div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line-soft)"><span>Movimenti registrati</span><b class="mono">${movDi(k.cod).length}</b></div>
    <div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line-soft)"><span>Usato nei componenti di</span><b class="mono">${PRODOTTI.filter(p=>(p.comp||[]).some(x=>x.cod===k.cod)).length} prodotti</b></div>
  </div></div>`}</div>`;
}
function bindComp(){
  document.getElementById('kann').onclick=()=>{K=null;voce='giac';render();};
  document.getElementById('ksalva').onclick=()=>{
    const g=id=>document.getElementById(id).value;
    const cod=g('k_cod').trim().toUpperCase(), desc=g('k_desc').trim();
    if(!cod) return avviso('<b>Codice obbligatorio.</b>');
    if(!desc) return avviso('<b>Descrizione obbligatoria.</b>');
    const i=COMP.findIndex(c=>c.cod===cod);
    const dati={cod,desc,um:g('k_um'),init:numIt(g('k_init'))||0,min:numIt(g('k_min'))||0,forn:g('k_forn'),costo:numIt(g('k_costo'))||0};
    if(!K && i>=0) return avviso(`Esiste già un componente con codice <b>${cod}</b>.`);
    if(i>=0){ dati.init=COMP[i].init; COMP[i]=dati; } else COMP.push(dati);
    const era=!!K; K=null; M.sel=cod; voce='giac'; render();
    avviso(`Componente <b>${cod}</b> ${era?'aggiornato':'aggiunto'}.`);
  };
}

/* ---------- gruppi e sottogruppi ---------- */
function usoGruppo(g){return PRODOTTI.filter(p=>p.g===g);}
function usoSotto(g,s){return PRODOTTI.filter(p=>p.g===g&&p.sg===s);}

let dirtyGr=false;
function vistaGruppi(){
  return `<div class="head"><div><h1>Gruppi e sottogruppi</h1>
  <p class="sub">Struttura del catalogo · un gruppo o un sottogruppo si elimina solo se non è usato da nessun prodotto</p></div>
  <div class="acts">
    ${dirtyGr?'<span class="pill">modifiche non salvate</span>':''}
    <input id="ng" placeholder="Nome nuovo gruppo" style="font:inherit;font-size:13px;padding:7px 12px;border:1px solid var(--line-strong);border-radius:9px;width:190px">
    <button class="btn" id="addg">Aggiungi gruppo</button>
    <button class="btn pri" id="grsalva" ${dirtyGr?'':'disabled'}>Salva</button>
  </div></div>
  <div class="cols">${Object.entries(GRUPPI).map(([g,ss])=>{
    const n=usoGruppo(g).length;
    return `<div class="card">
      <h2>${g}
        <span class="r">
          <span class="tag ${n?'ac':''}">${n} prodotti</span>
          <button class="btn sm" data-delg="${g}" ${n?'style="opacity:.5"':''}>Elimina gruppo</button>
        </span>
      </h2>
      <table><thead><tr><th>Sottogruppo</th><th class="r" style="width:110px">Prodotti</th><th style="width:70px"></th></tr></thead>
      <tbody>${ss.map(s=>{const k=usoSotto(g,s).length;
        return `<tr><td>${s}</td><td class="num">${k}</td>
        <td><button style="border:0;background:none;color:${k?'var(--faint)':'var(--alert)'};cursor:pointer;font-size:14px"
          data-dels="${g}|${s}" title="${k?'In uso da '+k+' prodotti':'Elimina sottogruppo'}">✕</button></td></tr>`;}).join('')}
      <tr><td><input data-nsg="${g}" placeholder="Nuovo sottogruppo…" style="font:inherit;font-size:12.5px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;width:100%"></td>
      <td></td><td><button class="btn sm" data-adds="${g}">+</button></td></tr>
      </tbody></table></div>`;}).join('')}
  </div>`;
}

function bindGruppi(){
  const tocca=()=>{dirtyGr=true;render();};
  document.getElementById('grsalva').onclick=()=>{dirtyGr=false;render();avviso('Struttura del catalogo salvata.');};
  document.getElementById('addg').onclick=()=>{
    const v=document.getElementById('ng').value.trim();
    if(!v) return;
    if(GRUPPI[v]) return avviso('Esiste già un gruppo con questo nome.');
    GRUPPI[v]=[]; tocca();
  };
  document.querySelectorAll('[data-delg]').forEach(b=>b.onclick=()=>{
    const g=b.dataset.delg, u=usoGruppo(g);
    if(u.length) return avviso(`Impossibile eliminare il gruppo <b>${g}</b>: è usato da ${u.length} prodotti (${u.slice(0,4).map(p=>p.cod).join(', ')}${u.length>4?'…':''}). Elimina prima i prodotti, poi il gruppo.`);
    if(GRUPPI[g].length) return avviso(`Il gruppo <b>${g}</b> contiene ancora ${GRUPPI[g].length} sottogruppi: eliminali prima.`);
    delete GRUPPI[g]; tocca(); avviso(`Gruppo <b>${g}</b> eliminato.`);
  });
  document.querySelectorAll('[data-dels]').forEach(b=>b.onclick=()=>{
    const [g,s]=b.dataset.dels.split('|'), u=usoSotto(g,s);
    if(u.length) return avviso(`Impossibile eliminare il sottogruppo <b>${s}</b>: è usato da ${u.length} prodotti (${u.map(p=>p.cod).join(', ')}). Elimina prima i prodotti.`);
    GRUPPI[g]=GRUPPI[g].filter(x=>x!==s); tocca(); avviso(`Sottogruppo <b>${s}</b> eliminato.`);
  });
  document.querySelectorAll('[data-adds]').forEach(b=>b.onclick=()=>{
    const g=b.dataset.adds, inp=document.querySelector(`[data-nsg="${g}"]`), v=inp.value.trim();
    if(!v) return;
    if(GRUPPI[g].includes(v)) return avviso('Sottogruppo già presente in questo gruppo.');
    GRUPPI[g].push(v); tocca();
  });
}

function vistaSoon(sez,voce){
  const nome=SEZIONI[sez].voci.find(v=>v[0]===voce)[1];
  const altre=SEZIONI[sez].voci.filter(v=>v[0]!==voce);
  return `<div class="head"><div><h1>${nome}</h1><p class="sub">Prototipo non ancora costruito</p></div></div>
  <div class="soon"><h3>Questa schermata è nel blocco successivo</h3>
  <div>Mandami il disegno o dimmi come deve funzionare, e la costruisco come le altre.</div>
  <ul>${altre.map(v=>`<li>${v[1]}<em>${PRONTE.includes(sez+'.'+v[0])?'prototipo pronto':'da costruire'}</em></li>`).join('')}</ul></div>`;
}

/* ---------------- navigazione ---------------- */
let sez='dashboard', voce='oggi';
function render(quick){
  document.querySelectorAll('#mainnav .item').forEach(b=>b.classList.toggle('on',b.dataset.s===sez));
  document.getElementById('subnav').innerHTML=SEZIONI[sez].voci
    .map(([k,n])=>`<button data-v="${k}" class="${k===voce?'on':''}">${n}</button>`).join('');
  document.querySelectorAll('#subnav button').forEach(b=>b.onclick=()=>{voce=b.dataset.v;render();});

  const key=sez+'.'+voce;
  const view=document.getElementById('view');
  if(key==='dashboard.oggi'){ view.innerHTML=vistaDashboard(); bindDashboard(); }
  else if(key==='commesse.elenco'){ view.innerHTML=vistaElenco('commesse',quick); bindElenco(); }
  else if(key==='preventivi.elenco'){ view.innerHTML=vistaElenco('preventivi',quick); bindElenco(); }
  else if(key==='articoli.articoli'){ view.innerHTML=vistaCatalogo('art'); bindCatalogo(); }
  else if(key==='articoli.accessori'){ view.innerHTML=vistaCatalogo('acc'); bindCatalogo(); }
  else if(key==='articoli.scheda'){ view.innerHTML=vistaScheda(); bindScheda(); }
  else if(key==='commesse.apri'||key==='preventivi.apri'){ view.innerHTML=vistaDoc(); bindDoc(); }
  else if(key==='contabilita.pn'){ view.innerHTML=vistaPrimaNota(); bindPrimaNota(); }
  else if(key==='contabilita.pdc'){ view.innerHTML=vistaPDC(); }
  else if(key==='contabilita.scad'){ view.innerHTML=vistaScad(); bindScad(); }
  else if(key==='contabilita.iva'){ view.innerHTML=vistaIVA(); bindIVA(); }
  else if(key==='contabilita.bilancio'){ view.innerHTML=vistaBilancio(); }
  else if(key==='impostazioni.utenti'){ view.innerHTML=vistaUtenti(); bindUtenti(); }
  else if(key==='impostazioni.audit'){ view.innerHTML=vistaAudit(); bindAudit(); }
  else if(key==='impostazioni.stati'){ view.innerHTML=vistaStati(); bindStati(); }
  else if(key==='impostazioni.produzione'){ view.innerHTML=vistaProduzione(); bindProduzione(); }
  else if(key==='impostazioni.tabelle'){ view.innerHTML=vistaTabelle(); bindTabelle(); }
  else if(key==='impostazioni.stampe'){ view.innerHTML=vistaModelli(); bindModelli(); }
  else if(key==='commesse.imp'){ view.innerHTML=vistaImpostazioni(); bindImpostazioni(); }
  else if(sez==='anagrafica'&&voce!=='scheda'){ view.innerHTML=vistaAnag(voce); bindAnag(); }
  else if(key==='anagrafica.scheda'){ view.innerHTML=vistaAnagScheda(); bindAnagScheda(); }
  else if(key==='magazzino.giac'){ view.innerHTML=vistaGiacenze(false); bindMag(false); }
  else if(key==='magazzino.sotto'){ view.innerHTML=vistaGiacenze(true); bindMag(true); }
  else if(key==='magazzino.comp'){ view.innerHTML=vistaComp(); bindComp(); }
  else if(key==='magazzino.mov'){ view.innerHTML=vistaMovimenti(); bindMov(); }
  else if(key==='magazzino.carico'){ view.innerHTML=vistaCarico(); bindCarico(); }
  else if(key==='magazzino.inv'){ view.innerHTML=vistaInventario(); bindInv(); }
  else if(key==='articoli.varia'){ view.innerHTML=vistaVaria(); bindVaria(); }
  else if(key==='articoli.spec'){ view.innerHTML=vistaSpecifiche(); bindSpec(); }
  else if(key==='articoli.gruppi'){ view.innerHTML=vistaGruppi(); bindGruppi(); }
  else view.innerHTML=vistaSoon(sez,voce);
  view.scrollTop=0;
}
document.querySelectorAll('#mainnav .item').forEach(b=>b.onclick=()=>{
  sez=b.dataset.s; voce=SEZIONI[sez].voci[0][0]; render();
});

/* schede della dashboard richiudibili */
function rendiRichiudibili(){
  document.querySelectorAll('#view .card > h2').forEach(h=>{
    const b=document.createElement('button');
    b.className='coll'; b.title='Riduci o espandi';
    b.innerHTML='<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
    b.onclick=e=>{e.stopPropagation();h.parentElement.classList.toggle('chiusa');};
    let r=h.querySelector('.r');
    if(!r){r=document.createElement('span');r.className='r';h.appendChild(r);}
    r.appendChild(b);
  });
}
render();
</script>
