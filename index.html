<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestionale — prototipo</title>
<style>
:root{
  --ink:#151B23;--ink-2:#39434E;--muted:#79838F;--faint:#9AA4AF;
  --canvas:#F0F2F6;--paper:#FFFFFF;--sunk:#F7F8FB;
  --line:#E2E6EC;--line-strong:#CFD6DF;
  --navy:#1F3E63;--navy-2:#2E5B8C;
  --accent:#1F3E63;--accent-2:#2E5B8C;--accent-soft:#EAF0F7;--accent-line:#C3D4E6;
  --ok:#1F6647;--ok-soft:#E7F2EC;--ok-line:#BEDCCB;
  --alert:#96341A;--alert-soft:#FBEBE4;--alert-line:#EFC9B7;
  --warn:#7E5A11;--warn-soft:#FBF3E0;--warn-line:#E7D5A8;
  --sh-1:0 1px 2px rgba(21,27,35,.05);
  --sh-2:0 1px 3px rgba(21,27,35,.06),0 6px 16px -8px rgba(21,27,35,.14);
  --sh-3:0 2px 6px rgba(21,27,35,.08),0 14px 30px -14px rgba(21,27,35,.24);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);font-size:13.5px;line-height:1.45;
  -webkit-font-smoothing:antialiased;background:#232830;letter-spacing:-.003em}
.mono{font-family:'Cascadia Mono',Consolas,'SF Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.num{font-family:'Cascadia Mono',Consolas,'SF Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;text-align:right;letter-spacing:-.02em}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#C7CFD9;border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#AEB9C6;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---- area applicativa fluida ---- */
.stage{position:fixed;inset:0;overflow:auto;background:var(--canvas)}
.frame{width:100%;min-height:100%;display:flex}
.screen{flex:1;min-width:1080px;min-height:100vh;background:var(--canvas);display:flex;flex-direction:column}
.zoombar{display:none!important}
.zoombar{position:fixed;left:14px;bottom:14px;z-index:80;background:rgba(24,29,36,.94);backdrop-filter:blur(8px);
  color:#fff;border-radius:30px;padding:5px;display:flex;gap:3px;align-items:center;box-shadow:var(--sh-3)}
.zoombar button{background:none;border:0;color:#A9B4C0;padding:6px 13px;border-radius:30px;cursor:pointer;font-size:12.5px}
.zoombar button:hover{color:#fff}
.zoombar button.on{background:#fff;color:#181D24;font-weight:600}
.zoombar .lab{font-family:'Cascadia Mono',Consolas,ui-monospace,monospace;font-size:11.5px;color:#7E8A97;padding:0 9px}

/* ---- menu principale ---- */
.mainnav{background:var(--paper);border-bottom:1px solid var(--line);padding:11px 26px;display:flex;align-items:center;gap:8px;flex:none;box-shadow:var(--sh-1);z-index:3}
.mainnav .item{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;
  padding:13px 24px;border-radius:14px;color:#65707C;cursor:pointer;min-width:138px;transition:background .13s,color .13s,transform .13s}
.mainnav .item svg{width:26px;height:26px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.mainnav .item span{font-size:11.5px;font-weight:700;letter-spacing:.1em}
.mainnav .item:hover{background:var(--sunk);color:var(--ink)}
.mainnav .item.on{background:linear-gradient(160deg,#2A5480,var(--navy));color:#fff;box-shadow:0 6px 16px -6px rgba(31,62,99,.55)}
.mainnav .item.on svg{stroke-width:1.8}
.mainnav .right{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);line-height:1.6}
.dot{width:7px;height:7px;border-radius:50%;background:#35935F;display:inline-block;margin-right:7px;
  box-shadow:0 0 0 3px rgba(53,147,95,.16)}

/* ---- sottomenu ---- */
.subnav{background:var(--paper);border-bottom:1px solid var(--line);padding:0 26px;display:flex;gap:2px;flex:none;overflow:auto;z-index:2}
.subnav::-webkit-scrollbar{height:0}
.subnav button{background:none;border:0;border-bottom:2.5px solid transparent;padding:12px 15px;color:var(--muted);
  cursor:pointer;font-size:13px;white-space:nowrap;transition:color .12s}
.subnav button:hover{color:var(--ink)}
.subnav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

.view{flex:1;overflow:auto;padding:22px 26px 30px}

/* ---- intestazioni ---- */
h1{font-size:23px;margin:0 0 2px;letter-spacing:-.025em;font-weight:650}
.sub{color:var(--muted);margin:0;font-size:13px}
.head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.head .acts{margin-left:auto;display:flex;gap:8px}

.btn{border:1px solid var(--line-strong);background:var(--paper);color:var(--ink-2);padding:7px 15px;border-radius:9px;
  cursor:pointer;font-size:12.5px;font-weight:500;box-shadow:var(--sh-1);transition:background .12s,border-color .12s,box-shadow .12s}
.btn:hover{background:var(--sunk);border-color:#BCC5D0}
.btn:active{box-shadow:none;transform:translateY(.5px)}
.btn.pri{background:linear-gradient(170deg,#2A5480,var(--navy));border-color:var(--navy);color:#fff;
  box-shadow:0 1px 2px rgba(31,62,99,.3),0 4px 12px -6px rgba(31,62,99,.5)}
.btn.pri:hover{background:linear-gradient(170deg,#33648F,#274B78)}
.btn.sm{padding:4px 11px;font-size:11.5px;border-radius:7px}

/* ---- riquadri indicatori ---- */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
.kpis.kpi8{grid-template-columns:repeat(8,1fr);gap:12px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 15px;cursor:pointer;
  position:relative;overflow:hidden;box-shadow:var(--sh-1);transition:transform .13s,box-shadow .13s,border-color .13s}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent-line)}
.kpi.al::before{background:#D98A6A}.kpi.wa::before{background:#D9B96A}.kpi.ac::before{background:var(--accent-2)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh-2);border-color:var(--accent-line)}
.kpi span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:block}
.kpi b{display:block;font-family:'Cascadia Mono',Consolas,ui-monospace,monospace;font-size:32px;font-weight:600;margin:4px 0 1px;letter-spacing:-.045em;color:var(--ink)}
.kpi small{color:var(--muted);font-size:11px;line-height:1.35;display:block}
.kpi.al b{color:var(--alert)}.kpi.wa b{color:var(--warn)}
.kpi8 .kpi{padding:13px 14px}.kpi8 .kpi b{font-size:27px}

/* ---- schede ---- */
.cols{display:grid;grid-template-columns:1.38fr 1fr;gap:18px;align-items:start}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:18px;overflow:hidden;box-shadow:var(--sh-1)}
.card>h2{margin:0;padding:13px 18px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink);
  font-weight:650;letter-spacing:-.01em;text-transform:none;display:flex;align-items:center;gap:10px;background:var(--paper)}
.card>h2 .r{margin-left:auto;display:flex;gap:9px;align-items:center}
.card .in{padding:17px 18px}

/* ---- tabelle ---- */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
th{text-align:left;font-size:10px;letter-spacing:.075em;text-transform:uppercase;color:var(--faint);font-weight:600;
  padding:9px 14px;border-bottom:1px solid var(--line);background:var(--sunk);position:sticky;top:0;z-index:1}
th.r{text-align:right}
td{padding:9px 14px;border-bottom:1px solid #EFF1F5;color:var(--ink-2)}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--accent-soft)}
tbody tr:hover td{color:var(--ink)}
tr.low{background:var(--warn-soft)}
tr.low:hover{background:#F7EDD6}
td .mono,td.mono{color:var(--ink)}

/* ---- area tabella scorrevole nelle schede ---- */
.tbox{max-height:clamp(190px,26vh,320px);overflow-y:auto;overscroll-behavior:contain}
.tbox::-webkit-scrollbar{width:9px}
.tbox table{border-collapse:separate}

/* ---- ordinamento e filtri di colonna ---- */
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable:hover{color:var(--accent);background:#EFF3F8}
th .arw{opacity:.28;margin-left:5px;font-size:9px}
th.sorted{color:var(--accent);background:var(--accent-soft)}
th.sorted .arw{opacity:1}
tr.filtri th{padding:5px 8px;background:var(--paper);position:sticky;top:33px;z-index:1;border-bottom:1px solid var(--line)}
tr.filtri input{width:100%;font:inherit;font-size:11.5px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);color:var(--ink)}
tr.filtri input:focus{outline:none;border-color:var(--accent-2);background:var(--paper)}
tbody tr.sel{box-shadow:inset 0 0 0 2px var(--accent-2);background:var(--accent-soft)}
.vuoto{text-align:center;color:var(--faint);padding:26px}

/* ---- finestre modali ---- */
.overlay{position:fixed;inset:0;background:rgba(18,23,30,.55);z-index:90;display:flex;align-items:center;justify-content:center;padding:24px}
.finestra{background:var(--paper);border-radius:14px;box-shadow:var(--sh-3);width:660px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.finestra h3{margin:0;padding:15px 20px;border-bottom:1px solid var(--line);font-size:15px;display:flex;align-items:center;gap:10px}
.finestra h3 .x{margin-left:auto;border:0;background:none;font-size:17px;color:var(--muted);cursor:pointer;line-height:1}
.finestra .corpo{padding:16px 20px;overflow:auto}
.finestra .piede{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--sunk)}
.cliriga{display:flex;gap:12px;padding:10px 12px;border-radius:9px;cursor:pointer;border-bottom:1px solid var(--line-soft)}
.cliriga:hover{background:var(--accent-soft)}
.cliriga b{display:block;font-size:13.5px}
.cliriga span{font-size:11.5px;color:var(--muted)}
.cliriga .dx{margin-left:auto;text-align:right;font-size:11.5px;color:var(--muted)}
.obbl{border-color:var(--alert)!important;background:var(--alert-soft)!important}

/* ---- anteprima di stampa ---- */
.stampa-wrap{width:min(880px,96vw);max-height:92vh;display:flex;flex-direction:column}
.stampa-barra{display:flex;align-items:center;gap:9px;background:#1F2933;color:#E6EBF1;padding:10px 16px;border-radius:12px 12px 0 0}
.stampa-barra b{font-size:13.5px}
.stampa-barra .dx{margin-left:auto;display:flex;gap:8px}
.stampa-barra select{height:30px;border-radius:8px;border:1px solid #3C4854;background:#2B3540;color:#E6EBF1;font:inherit;font-size:12.5px;padding:2px 8px}
.stampa-area{background:#5A626C;padding:20px;overflow:auto;border-radius:0 0 12px 12px}
.foglio{background:#fff;width:794px;margin:0 auto;padding:46px 52px;box-shadow:0 6px 24px rgba(0,0,0,.35);color:#15191F;font-size:12px;line-height:1.45}
.foglio h1{font-size:19px;margin:0 0 3px}
.foglio .intest{display:flex;gap:30px;justify-content:space-between;border-bottom:2px solid #15191F;padding-bottom:14px;margin-bottom:16px}
.foglio .logo{width:52px;height:52px;border-radius:9px;background:#1F3E63;color:#fff;display:grid;place-items:center;font-weight:700;font-size:19px}
.foglio .blocchi{display:flex;gap:26px;margin-bottom:18px}
.foglio .bl{flex:1;border:1px solid #C9D0D8;border-radius:8px;padding:10px 13px}
.foglio .bl h4{margin:0 0 6px;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#67717D}
.foglio table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:16px}
.foglio th{background:#EEF1F5;border-bottom:1.5px solid #15191F;padding:6px 7px;text-align:left;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase}
.foglio td{padding:6px 7px;border-bottom:1px solid #DFE3E8;vertical-align:top}
.foglio .tot{margin-left:auto;width:290px}
.foglio .tot div{display:flex;justify-content:space-between;padding:4px 0}
.foglio .tot .f{border-top:1.5px solid #15191F;margin-top:5px;padding-top:7px;font-weight:700;font-size:14px}
.foglio .piede{margin-top:22px;border-top:1px solid #C9D0D8;padding-top:10px;font-size:10.5px;color:#5B6572}
@media print{
  body>*{display:none!important}
  #ovstampa{display:block!important;position:static!important;background:#fff!important;padding:0!important}
  #ovstampa .stampa-barra{display:none!important}
  #ovstampa .stampa-wrap{width:auto;max-height:none;display:block}
  #ovstampa .stampa-area{background:#fff!important;padding:0!important;overflow:visible!important}
  #ovstampa .foglio{box-shadow:none!important;width:auto!important;padding:0!important}
}

/* ---- menu a tendina ---- */
.dd{position:relative;display:inline-block}
.dd .menu{position:absolute;right:0;bottom:calc(100% + 6px);background:var(--paper);border:1px solid var(--line-strong);
  border-radius:10px;box-shadow:var(--sh-3);min-width:250px;padding:5px;z-index:30;display:none}
.dd.open .menu{display:block}
.dd .menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 12px;border-radius:7px;
  cursor:pointer;font-size:12.5px;color:var(--ink)}
.dd .menu button:hover{background:var(--accent-soft);color:var(--accent)}
.dd .menu .sep{height:1px;background:var(--line-soft);margin:5px 0}
.dd .menu .lab{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:6px 12px 3px;font-weight:600}

/* ---- configuratore colonne ---- */
.colcfg{background:var(--sunk);border-bottom:1px solid var(--line);padding:14px 18px}
.colcfg .griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:7px;margin-bottom:12px}
.colcfg .voce{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;font-size:12.5px}
.colcfg .voce input[type=checkbox]{width:16px;height:16px;accent-color:var(--navy)}
.colcfg .voce .w{margin-left:auto;width:58px;height:25px;border:1px solid var(--line);border-radius:6px;
  font:inherit;font-size:11.5px;text-align:right;padding:2px 6px;font-family:'Cascadia Mono',Consolas,ui-monospace,monospace}
th{position:relative}
th .res{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:col-resize;user-select:none}
th .res:hover{background:var(--accent-2);opacity:.35}
table.fix{table-layout:fixed}
table.fix td,table.fix th{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- totali commerciali ---- */
.tot-comm{display:grid;grid-template-columns:1fr 330px;gap:0}
.tot-comm .righe{padding:0}
.tot-comm .box{padding:15px 18px;border-left:1px solid var(--line);background:var(--sunk)}
.tot-comm .rg{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px}
.tot-comm .rg span{color:var(--muted)}
.tot-comm .rg b{font-family:'Cascadia Mono',Consolas,ui-monospace,monospace;font-size:14px}
.tot-comm .rg input{width:118px;height:29px;text-align:right;border:1px solid var(--line-strong);border-radius:7px;
  font-family:'Cascadia Mono',Consolas,ui-monospace,monospace;font-size:13px;padding:3px 9px;background:var(--paper)}
.tot-comm .fin{border-top:2px solid var(--line-strong);margin-top:7px;padding-top:10px}
.tot-comm .fin b{font-size:19px;letter-spacing:-.02em}

/* ---- barra pulsanti fissa in fondo all'elenco ---- */
.footbar{display:flex;align-items:center;gap:10px;padding:11px 18px;border-top:1px solid var(--line);
  background:var(--paper);position:sticky;bottom:0;box-shadow:0 -3px 10px -6px rgba(21,27,35,.2)}
.footbar .info{font-size:12.5px;color:var(--muted)}
.footbar .info b{color:var(--ink);font-family:'Cascadia Mono',Consolas,ui-monospace,monospace}
.footbar .r{margin-left:auto;display:flex;gap:8px}
.btn[disabled]{opacity:.42;cursor:default;box-shadow:none}
.tabwrap{max-height:calc(100vh - 340px);min-height:220px;overflow:auto}

/* ---- scheda prodotto ---- */
.form{display:grid;gap:14px}
.f2{grid-template-columns:1fr 1fr}.f3{grid-template-columns:1fr 1fr 1fr}
label.f>span{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:600}
label.f>span b{color:var(--alert)}
.form input,.form select,.form textarea{width:100%;font:inherit;font-size:13px;padding:7px 11px;border:1px solid var(--line-strong);
  border-radius:9px;background:var(--paper);color:var(--ink);height:35px;box-shadow:var(--sh-1)}
.form textarea{height:auto;resize:vertical}
.form input:focus,.form select:focus{outline:none;border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft)}
.form input.mono{font-family:'Cascadia Mono',Consolas,ui-monospace,monospace}
.imgbox{border:1px dashed var(--line-strong);border-radius:12px;background:var(--sunk);display:grid;place-items:center;
  color:var(--faint);font-size:12px;height:132px;text-align:center;padding:10px;cursor:pointer}
.imgbox:hover{border-color:var(--accent-2);color:var(--accent)}
.misrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #EFF1F5}
.misrow:last-child{border:0}
.misrow input[type=checkbox]{width:17px;height:17px;accent-color:var(--navy);flex:none;box-shadow:none}
.misrow .lab{width:78px;font-size:12.5px;color:var(--muted)}
.misrow input[type=text]{max-width:230px}
.misrow.off{opacity:.45}
.prova{background:var(--sunk);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-top:12px}
.prova .rr{display:flex;justify-content:space-between;align-items:baseline;margin-top:5px}
.prova b{font-family:'Cascadia Mono',Consolas,ui-monospace,monospace;font-size:15px}
.err{color:var(--alert)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);border:1px solid var(--accent-line);
  color:var(--accent);border-radius:20px;padding:3px 11px;font-size:12px;font-weight:500}
.libcol{display:grid;grid-template-columns:280px 1fr;min-height:420px}
.liblist{border-right:1px solid var(--line);background:var(--sunk);padding:12px}
.libitem{padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px}
.libitem:hover{background:var(--accent-soft)}
.libitem.on{background:linear-gradient(160deg,#2A5480,var(--navy));color:#fff;font-weight:500}
.libitem b{margin-left:auto;font-family:'Cascadia Mono',Consolas,ui-monospace,monospace;font-weight:500;opacity:.7;font-size:11.5px}
.sovr{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-line);border-radius:6px;padding:1px 8px;font-size:11px}

/* ---- schede richiudibili ---- */
.coll{border:0;background:none;cursor:pointer;color:var(--faint);padding:3px;border-radius:6px;display:grid;place-items:center;line-height:0}
.coll:hover{background:var(--sunk);color:var(--ink)}
.coll svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
.card.chiusa .coll svg{transform:rotate(-90deg)}
.card.chiusa .tbox,.card.chiusa .in,.card.chiusa>table{display:none}
.card.chiusa>h2{border-bottom:0}

/* ---- colore riga per stato ---- */
tr.st{position:relative}
tr.st td:first-child{box-shadow:inset 3px 0 0 var(--stc)}
tr.st-pronto   {--stc:#3F8F63;background:#EAF4EE}
tr.st-lav      {--stc:#3A6FA8;background:#E9F0F8}
tr.st-conf     {--stc:#C8A72E;background:#FCF5DC}
tr.st-misure   {--stc:#D2802F;background:#FCEFE0}
tr.st-spedire  {--stc:#C0503A;background:#FBE9E4}
tr.st-annullato{--stc:#8A929C;background:#E8EAEE;color:var(--faint)}
tr.st-annullato td{color:#8A929C}
tr.st-daconf   {--stc:#C3C9D1;background:#F5F6F9}
tr.st-pronto:hover{background:#DFEDE5}
tr.st-lav:hover{background:#DDE8F4}
tr.st-conf:hover{background:#F8EECB}
tr.st-misure:hover{background:#F8E5D0}
tr.st-spedire:hover{background:#F6DCD5}
tr.st-annullato:hover{background:#DFE2E7}
tr.st-daconf:hover{background:#EDEFF4}
.legenda{display:flex;gap:13px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}

const _s=document.getElementById('screen'),_f=document.getElementById('frame'),_z=document.getElementById('zlab');
function applyZoom(){} function fitZoom(){}

/* ---------------- struttura ---------------- */
const SEZIONI={
  dashboard:{voci:[['oggi','Oggi']]},

  anagrafica:{voci:[['clienti','Clienti'],['fornitori','Fornitori'],['agenti','Agenti'],['tecnici','Tecnici'],['scheda','Scheda']]},
  magazzino:{voci:[['giac','Giacenze'],['mov','Movimenti'],['carico','Carico da fornitore'],['inv','Rettifiche e inventario'],['sotto','Sottoscorta']]},
  articoli:{voci:[['articoli','Articoli'],['accessori','Accessori'],['spec','Specifiche'],['gruppi','Gruppi e sottogruppi'],['varia','Varia listini']]},
  amministrazione:{voci:[['prov','Provvigioni agenti'],['fatt','Fatture, DDT, note di credito'],['pn','Prima nota'],['conti','Piano dei conti'],['casse','Casse e banche'],['scad','Scadenzario e pagamenti']]},
  contabilita:{voci:[['pn','Prima nota'],['pdc','Piano dei conti'],['scad','Scadenzario'],['iva','Registri e liquidazione IVA'],['bilancio','Bilancio di verifica']]},
  impostazioni:{voci:[['stati','Stati documento'],['stampe','Modelli documento'],['produzione','Modelli di produzione'],['tabelle','Tabelle di conversione'],['utenti','Utenti e permessi'],['audit','Audit log'],['backup','Backup'],['conf','Configurazione']]}
};
const PRONTE=['dashboard.oggi','commesse.elenco','preventivi.elenco'];

/* ---------------- dati di prova ---------------- */
const numIt=v=>parseFloat(String(v).replace(/\./g,'').replace(',','.'));
const DOCUMENTI=[];
const DOCS=DOCUMENTI, PREV=DOCUMENTI;
const eur=n=>n.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});
let STATI=[
 {n:'Da inviare',        sf:'#F3F5F8', bo:'#B9C2CC', tx:'#4A5460'},
 {n:'Da rilevare misure',sf:'#FCEFE0', bo:'#D2802F', tx:'#8A5216'},
 {n:'Da confermare',     sf:'#F3F5F8', bo:'#B9C2CC', tx:'#4A5460'},
 {n:'Ordinato',          sf:'#EFE7F6', bo:'#7B5AA6', tx:'#4E3272'},
 {n:'Confermata',        sf:'#FCF3D6', bo:'#C8A72E', tx:'#7A5D10'},
 {n:'In lavorazione',    sf:'#E4EDF8', bo:'#3A6FA8', tx:'#1F4470'},
 {n:'Pronta',            sf:'#E4F2E9', bo:'#3F8F63', tx:'#1D5C3C'},
 {n:'Da spedire',        sf:'#FBE5DF', bo:'#C0503A', tx:'#8C3520'},
 {n:'Consegnata',        sf:'#E4F2E9', bo:'#3F8F63', tx:'#1D5C3C'},
 {n:'Annullata',         sf:'#E6E9ED', bo:'#8A929C', tx:'#5C646E'}
];
const statoDi=s=>STATI.find(x=>x.n===s)||{sf:'#F3F5F8',bo:'#C3C9D1',tx:'#4A5460'};
const stileRiga=s=>{const t=statoDi(s);return `background:${t.sf};box-shadow:inset 3px 0 0 ${t.bo}`;};
const cls=()=>'';
const tagStato=s=>{const t=statoDi(s);
  return `<span class="tag" style="background:${t.sf};border-color:${t.bo};color:${t.tx}">${s}</span>`;};

/* ---------------- viste ---------------- */
let DASH={sx:['piano','lavorazione','consegneOggi','consegne14'],dx:['misure','montaggi','spedire','sottoscorta']};
let DASHK=['piano','lavorazione','consegneOggi','consegne14','spedire','misure','montaggi','sottoscorta'];
const DASHK_DEF=DASHK.slice();
const DASH_DEF=JSON.parse(JSON.stringify(DASH));
const NOMIW={piano:'Piano di oggi',lavorazione:'In lavorazione',consegneOggi:'Consegne di oggi',
  consegne14:'Da consegnare 14 gg',misure:'Da rilevare misure',montaggi:'Montaggi',spedire:'Da spedire',sottoscorta:'Sottoscorta'};
let dashEdit=false, dragW=null;
const oggiISO=()=>{const o=new Date();return o.toISOString().slice(0,10);};
const giorniA=d=>{const i=isoData(d); if(!i) return null;
  return Math.round((new Date(i)-new Date(oggiISO()))/86400000);};
const pezziDi=d=>(d.voci||[]).reduce((t,v)=>t+(v.qta||0),0);
const perStato=s=>DOCUMENTI.filter(d=>d.tipo==='commesse'&&d.stato===s);

function vistaDashboard(){
  const lav=perStato('In lavorazione');
  const ritardo=lav.filter(d=>giorniA(d.cons)!==null&&giorniA(d.cons)<0);
  const cons14=DOCUMENTI.filter(d=>d.tipo==='commesse'&&giorniA(d.cons)!==null&&giorniA(d.cons)>=0&&giorniA(d.cons)<=14);
  const oggiCons=DOCUMENTI.filter(d=>d.tipo==='commesse'&&giorniA(d.cons)===0);
  const spedire=perStato('Da spedire');
  const misure=perStato('Da rilevare misure');
  const mont=DOCUMENTI.filter(d=>d.tipo==='commesse'&&d.montaggio&&d.stato!=='Consegnata'&&d.stato!=='Annullata');
  const ss=sotto();
  const piano=DOCUMENTI.filter(d=>giorniA(d.lav)===0);
  const pezziPiano=piano.reduce((t,d)=>t+pezziDi(d),0);
  const K={
    lavorazione:['In lavorazione',lav.length,`${lav.reduce((t,d)=>t+pezziDi(d),0)} pezzi · ${ritardo.length} in ritardo`,ritardo.length?'al':''],
    consegne14:['Da consegnare 14 gg',cons14.length,'',''],
    consegneOggi:['Consegne di oggi',oggiCons.length,'','ac'],
    spedire:['Da spedire',spedire.length,'','wa'],
    misure:['Da rilevare misure',misure.length,'','wa'],
    montaggi:['Montaggi',mont.length,'',''],
    sottoscorta:['Sottoscorta',ss.length,'','al'],
    piano:['Piano di oggi',piano.length,`${pezziPiano} pezzi da lavorare`,'ac']
  };
  const vuoto=t=>`<tr><td class="vuoto" colspan="9">${t}</td></tr>`;
  const rigaDoc=(d,extra)=>`<tr style="${stileRiga(d.stato)}"><td class="mono">${d.n}</td><td>${d.cli||'—'}</td>${extra}</tr>`;
  const scheda=(tit,tag,intest,righe,azione)=>`<div class="card">
    <h2>${tit} ${tag||''}<span class="r">${azione||''}<button class="btn sm" data-vai="${tit}">Apri elenco</button></span></h2>
    <div class="tbox"><table><thead><tr>${intest}</tr></thead><tbody>${righe}</tbody></table></div></div>`;

  const W={};

      <td>${g===null?'—':g<0?`<span class="tag" style="background:var(--alert-soft);border-color:var(--alert-line);color:var(--alert)">${-g} gg di ritardo</span>`:'in linea'}</td>`);}).join('')

  W.consegneOggi=scheda('Consegne di oggi','',

    :vuoto('Nessuna consegna prevista per oggi'));
  W.consegne14=scheda('Da consegnare nei prossimi 14 giorni','',

    cons14.length?cons14.slice().sort((a,b)=>giorniA(a.cons)-giorniA(b.cons)).map(d=>rigaDoc(d,

    :vuoto('Nessuna consegna nei prossimi 14 giorni'));
  W.misure=scheda('Da rilevare misure','',
    '<th>Commessa</th><th>Cliente</th><th>Tecnico</th>',
    misure.length?misure.map(d=>rigaDoc(d,`<td>${d.tecnico||'—'}</td>`)).join('')
    :vuoto('Nessun rilievo in attesa'));
  W.montaggi=scheda('Montaggi','',
    '<th>Commessa</th><th>Cliente</th><th>Data</th>',
    mont.length?mont.map(d=>rigaDoc(d,`<td class="mono">${d.cons||'—'}</td>`)).join('')
    :vuoto('Nessun montaggio programmato'));
  W.spedire=scheda('Da spedire','',
    '<th>Commessa</th><th>Cliente</th><th class="r">Pezzi</th>',
    spedire.length?spedire.map(d=>rigaDoc(d,`<td class="num">${pezziDi(d)}</td>`)).join('')
    :vuoto('Niente da spedire'));
  W.sottoscorta=scheda('Sottoscorta','',
    '<th>Componente</th><th class="r">Giacenza</th><th class="r">Minimo</th>',
    ss.length?ss.map(c=>`<tr class="low"><td><b class="mono">${c.cod}</b> ${c.desc}</td>
      <td class="num">${q3n(giac(c.cod))}</td><td class="num">${q3n(c.min)}</td></tr>`).join('')
    :vuoto('Tutte le giacenze sono sopra la scorta minima'));

  const colonna=(lista,lato)=>`<div class="dashcol" data-lato="${lato}">
    ${lista.filter(k=>W[k]).map(k=>`<div class="wid" data-w="${k}" ${dashEdit?'draggable="true"':''}>

      ${W[k]}</div>`).join('')}

  const nascosti=Object.keys(W).filter(k=>!DASH.sx.includes(k)&&!DASH.dx.includes(k));

  ${dashEdit?`<div class="card" style="border-color:var(--accent-line);background:var(--accent-soft)">
    <div class="in" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <b>Trascina per riordinare</b>

    </div></div>`:''}

  <div class="kpis kpi8">${DASHK.filter(k=>K[k]).map(k=>{const [t,v,s,c]=K[k];

      .map(k=>`<button class="btn sm" data-kshow="${k}">+ ${K[k][0]}</button>`).join('')}</div>`:''}</div>

  <div class="cols">${colonna(DASH.sx,'sx')}${colonna(DASH.dx,'dx')}</div>`;
}

function bindDashboard(){
  rendiRichiudibili();
  const R=()=>render();
  document.getElementById('dashord').onclick=()=>{dashEdit=!dashEdit;R();};
  const rst=document.getElementById('dashreset');
  if(rst) rst.onclick=()=>{DASH=JSON.parse(JSON.stringify(DASH_DEF));DASHK=DASHK_DEF.slice();R();};
  document.querySelectorAll('[data-hide]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.hide;
    DASH.sx=DASH.sx.filter(x=>x!==k); DASH.dx=DASH.dx.filter(x=>x!==k); R();});
  document.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{DASH.sx.push(b.dataset.show);R();});

  if(dashEdit){
    let dragK=null;
    document.querySelectorAll('.kpi[data-kpi]').forEach(k=>{
      k.ondragstart=e=>{dragK=k.dataset.kpi;k.classList.add('trascino');e.dataTransfer.effectAllowed='move';e.stopPropagation();};
      k.ondragend=()=>{k.classList.remove('trascino');document.querySelectorAll('.kpi.sopra').forEach(x=>x.classList.remove('sopra'));};
      k.ondragover=e=>{e.preventDefault();k.classList.add('sopra');};
      k.ondragleave=()=>k.classList.remove('sopra');
      k.ondrop=e=>{
        e.preventDefault();e.stopPropagation();
        const dest=k.dataset.kpi; if(!dragK||dragK===dest) return;
        DASHK=DASHK.filter(x=>x!==dragK);
        DASHK.splice(DASHK.indexOf(dest),0,dragK); dragK=null; R();
      };
      k.ondblclick=()=>{ if(dashEdit){DASHK=DASHK.filter(x=>x!==k.dataset.kpi);R();} };
    });
    document.querySelectorAll('[data-kshow]').forEach(b=>b.onclick=()=>{DASHK.push(b.dataset.kshow);R();});
    const togli=k=>{DASH.sx=DASH.sx.filter(x=>x!==k);DASH.dx=DASH.dx.filter(x=>x!==k);};
    document.querySelectorAll('.wid').forEach(w=>{
      w.ondragstart=e=>{dragW=w.dataset.w;w.classList.add('trascino');e.dataTransfer.effectAllowed='move';};
      w.ondragend=()=>{w.classList.remove('trascino');document.querySelectorAll('.sopra').forEach(x=>x.classList.remove('sopra'));};
      w.ondragover=e=>{e.preventDefault();w.classList.add('sopra');};
      w.ondragleave=()=>w.classList.remove('sopra');
      w.ondrop=e=>{
        e.preventDefault(); e.stopPropagation();
        const dest=w.dataset.w, lato=w.closest('.dashcol').dataset.lato;
        if(!dragW||dragW===dest) return;
        togli(dragW);
        const arr=DASH[lato], i=arr.indexOf(dest);
        arr.splice(i<0?arr.length:i,0,dragW); dragW=null; R();
      };
    });
    document.querySelectorAll('.dropend').forEach(z=>{
      z.ondragover=e=>{e.preventDefault();z.classList.add('sopra');};
      z.ondragleave=()=>z.classList.remove('sopra');
      z.ondrop=e=>{e.preventDefault(); if(!dragW)return;
        togli(dragW); DASH[z.dataset.lato].push(dragW); dragW=null; R();};
    });
  }
  const p=document.getElementById('dashprev'); if(p) p.onclick=()=>nuovoDoc('preventivi');
  const c=document.getElementById('dashcom'); if(c) c.onclick=()=>nuovoDoc('commesse');
  const vai={'Commesse in lavorazione':['commesse','In lavorazione'],'Consegne di oggi':['commesse',null],
    'Da consegnare nei prossimi 14 giorni':['commesse',null],'Da rilevare misure':['commesse','Da rilevare misure'],
    'Montaggi':['commesse',null],'Da spedire':['commesse','Da spedire'],'Sottoscorta':['magazzino',null],
    'Piano di oggi':['commesse',null]};
  document.querySelectorAll('[data-vai]').forEach(b=>b.onclick=()=>{
    const v=vai[b.dataset.vai]; if(!v) return;
    if(v[0]==='magazzino'){sez='magazzino';voce='sotto';render();return;}
    apriElenco(v[0],v[1]);
  });
  document.querySelectorAll('.kpi[data-k]').forEach(k=>k.onclick=()=>{
    if(dashEdit) return;
    const v=vai[Object.keys(vai).find(x=>x.startsWith(k.dataset.k))||''];
    if(k.dataset.k==='Sottoscorta'){sez='magazzino';voce='sotto';render();return;}
    const st={'In lavorazione':'In lavorazione','Da spedire':'Da spedire','Da rilevare misure':'Da rilevare misure'}[k.dataset.k];
    apriElenco('commesse',st||null);
  });
}

function vistaElenco(tipo,quick){
  L={tipo,sort:{c:null,d:1},f:{},quick:quick||'Tutti',sel:null,cerca:''};
  const dati=DOCUMENTI.filter(d=>d.tipo===tipo);
  const stati=[...new Set(dati.map(d=>d.stato))];
  const cols=colsAttive(tipo);
  return `
  <div class="head"><div><h1>${tipo==='commesse'?'Elenco commesse':'Elenco preventivi'}</h1>
  <p class="sub">${dati.length} documenti · anno 2026</p></div>
  <div class="acts"><button class="btn" id="lcol">Colonne</button><button class="btn">Esporta</button>
  <button class="btn pri" id="lnew">${tipo==='commesse'?'Nuova commessa':'Nuovo preventivo'}</button></div></div>

  <div class="card">
    <div class="toolbar">
      <div class="searchbox"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.3-4.3"/></svg>
        <input id="cerca" placeholder="Cerca in tutte le colonne…"></div>
      <select class="filt" id="fag"><option>Tutti gli agenti</option>${ANAG.agenti.dati.map(a=>`<option>${a.nome}</option>`).join('')}</select>
      <button class="btn sm" id="azzera">Azzera filtri</button>

    </div>
    ${pannelloColonne(tipo,'cfgel')}
    <div class="listlayout">
      <div style="min-width:0">
        <div class="tabwrap">
        <table id="tab" class="fix">
          <colgroup>${cols.map(c=>`<col data-k="${c.k}" style="width:${c.w}px">`).join('')}</colgroup>
          <thead>
            <tr>${cols.map((c,i)=>`<th class="sortable ${c.num?'r':''}" data-c="${i}" data-k="${c.k}">${c.l}<span class="arw">▲</span><span class="res"></span></th>`).join('')}</tr>
            <tr class="filtri">${cols.map(c=>`<th><input data-f="${c.k}" placeholder="filtra"></th>`).join('')}</tr>
          </thead>
          <tbody id="righe"></tbody>
        </table>
        </div>
        <div class="footbar">
          <span class="info" id="selinfo">Nessuna riga selezionata</span>
          <span class="info" id="conta"></span>
          <div class="r">
            <button class="btn pri" id="bapri" disabled>Apri</button>
            <button class="btn dg" id="bdel" disabled>Elimina</button>
            ${tipo==='preventivi'?'<button class="btn" id="btrasf" disabled>Trasforma in commessa</button>':''}
            ${menuStampa('ddstampa')}
          </div>
        </div>
      </div>
      <div class="side">
        <h3>Filtri rapidi — stato</h3>
        <div class="lnk quick on" data-q="Tutti">Tutti <b>${dati.length}</b></div>
        ${stati.map(s=>`<div class="lnk quick" data-q="${s}">${s} <b>${dati.filter(d=>d.stato===s).length}</b></div>`).join('')}
        <div class="grp"><h3>Periodo</h3>
          <div class="lnk on">Anno corrente</div><div class="lnk">Anno scorso</div>
          <div class="lnk">Ultimi 30 gg</div><div class="lnk">Ultimi 60 gg</div>
        </div>
      </div>
    </div>
  </div>`;
}

function datiFiltrati(){
  const dati=DOCUMENTI.filter(d=>d.tipo===L.tipo);
  const ag=document.getElementById('fag');
  return dati.filter(d=>{
    if(L.quick!=='Tutti' && d.stato!==L.quick) return false;
    if(ag && ag.selectedIndex>0 && d.ag!==ag.value) return false;
    if(L.cerca && !Object.values(d).join(' ').toLowerCase().includes(L.cerca)) return false;
    for(const k in L.f){ if(L.f[k] && !String(d[k]).toLowerCase().includes(L.f[k])) return false; }
    return true;
  });
}

function renderRighe(){
  const cols=colsAttive(L.tipo);
  let dati=datiFiltrati();
  if(L.sort.c!==null&&cols[L.sort.c]){
    const k=cols[L.sort.c].k, numerico=cols[L.sort.c].num;
    const val=(d)=>k==='tot'?totaliDoc(d).tot:k==='pezzi'?(d.voci||[]).reduce((t,v)=>t+(v.qta||0),0):(d[k]||0);
    dati.sort((a,b)=>numerico?(val(a)-val(b))*L.sort.d
      :String(a[k]||'').localeCompare(String(b[k]||''),'it',{numeric:true})*L.sort.d);
  }
  const cella=(d,c)=>{
    if(c.k==='stato') return `<td>${tagStato(d.stato)}</td>`;
    if(c.k==='tot') return `<td class="num">${eur(totaliDoc(d).tot)}</td>`;
    if(c.k==='pezzi') return `<td class="num">${(d.voci||[]).reduce((t,v)=>t+(v.qta||0),0)}</td>`;
    if(c.k==='ag') return `<td>${d.agente||'—'}</td>`;
    if(c.k==='ordine') return `<td>${d.ordine?`<span class="tag ok">${d.ordine.data.split(' ')[0]}</span>`:'<span class="tag">—</span>'}</td>`;
    if(c.num) return `<td class="num">${d[c.k]===undefined?'—':d[c.k]}</td>`;
    const v=d[c.k]; const mono=['n','data','cons','lav'].includes(c.k);
    return `<td class="${mono?'mono':''}" title="${v||''}">${v===undefined||v===''?'—':v}</td>`;
  };
  document.getElementById('righe').innerHTML = dati.length ? dati.map(d=>
    `<tr class="${L.sel===d.n?'sel':''}" style="${stileRiga(d.stato)}" data-n="${d.n}">${cols.map(c=>cella(d,c)).join('')}</tr>`).join('')
    : `<tr><td class="vuoto" colspan="${cols.length}">Nessun documento con questi filtri</td></tr>`;

  document.getElementById('conta').textContent=`${dati.length} di ${DOCUMENTI.filter(d=>d.tipo===L.tipo).length} documenti`;
  document.querySelectorAll('#righe tr[data-n]').forEach(tr=>{
    tr.onclick=()=>{L.sel=tr.dataset.n;renderRighe();};
    tr.ondblclick=()=>apriDoc(tr.dataset.n);
  });
  const sel=L.sel && dati.some(d=>d.n===L.sel);
  document.getElementById('selinfo').innerHTML = sel?`Selezionata <b>${L.sel}</b>`:'Nessuna riga selezionata';
  ['bapri','btrasf','bdel'].forEach(id=>{const b=document.getElementById(id); if(b) b.disabled=!sel;});
}

function prossimoNumero(tipo){
  const l=DOCUMENTI.filter(d=>d.tipo===tipo);
  const n=l.map(d=>parseInt(String(d.n).replace(/\D/g,'').slice(0,3))||0);
  const max=Math.max(0,...n)+1;
  return tipo==='commesse'?String(max).padStart(3,'0')+'/2026':'A26-'+String(max).padStart(4,'0');
}
function nuovoDoc(tipo){
  const o=new Date(), data=`${String(o.getDate()).padStart(2,'0')}/${String(o.getMonth()+1).padStart(2,'0')}/${o.getFullYear()}`;
  const doc={n:prossimoNumero(tipo),tipo,cli:'',cant:'',data,lav:'',cons:'',stato:'Da inviare',
    agente:'—',tecnico:'',montaggio:false,noteInt:'',noteCons:'',trasporto:0,scontoFin:0,
    tab:'dett',pos:0,scarico:null,voci:[]};
  DOCUMENTI.unshift(doc); D=doc; sez=tipo; voce='apri';
  audit('CREAZIONE',tipo,doc.n,null,'Nuovo documento'); render();
  avviso(`Creato <b>${doc.n}</b>. Seleziona il cliente e aggiungi le voci.`);
}

function apriDoc(n){
  const doc=DOCUMENTI.find(d=>d.n===n); if(!doc) return;
  D=doc; if(!D.tab) D.tab='dett'; if(D.pos===undefined) D.pos=0;
  sez=D.tipo; voce='apri'; render();
}

function bindElenco(){
  renderRighe();
  document.getElementById('lnew').onclick=()=>nuovoDoc(L.tipo);
  const pc=document.getElementById('cfgel');
  document.getElementById('lcol').onclick=()=>{pc.style.display=pc.style.display==='none'?'block':'none';};
  bindColonne(L.tipo,'cfgel',()=>{const q=L.quick,c=L.cerca,f=L.f,s=L.sel;
    document.getElementById('view').innerHTML=vistaElenco(L.tipo,q);
    L.cerca=c;L.f=f;L.sel=s;bindElenco();
    document.getElementById('cfgel').style.display='block';});
  abilitaRidimensiona('tab',L.tipo,null);
  bindMenuStampa('ddstampa','documento selezionato');
  document.querySelectorAll('#tab th.sortable').forEach(th=>th.onclick=()=>{
    const c=+th.dataset.c;
    L.sort = (L.sort.c===c) ? {c,d:-L.sort.d} : {c,d:1};
    document.querySelectorAll('#tab th.sortable').forEach(t=>{t.classList.remove('sorted');t.querySelector('.arw').textContent='▲';});
    th.classList.add('sorted'); th.querySelector('.arw').textContent=L.sort.d===1?'▲':'▼';
    renderRighe();
  });
  document.querySelectorAll('tr.filtri input').forEach(i=>i.oninput=()=>{L.f[i.dataset.f]=i.value.trim().toLowerCase();renderRighe();});
  document.getElementById('cerca').oninput=e=>{L.cerca=e.target.value.toLowerCase();renderRighe();};
  document.getElementById('fag').onchange=renderRighe;
  document.querySelectorAll('.lnk.quick').forEach(l=>l.onclick=()=>{
    document.querySelectorAll('.lnk.quick').forEach(x=>x.classList.remove('on'));
    l.classList.add('on'); L.quick=l.dataset.q; renderRighe();
  });
  document.getElementById('azzera').onclick=()=>{
    L.f={};L.cerca='';L.quick='Tutti';L.sort={c:null,d:1};
    document.querySelectorAll('tr.filtri input').forEach(i=>i.value='');
    document.getElementById('cerca').value='';document.getElementById('fag').selectedIndex=0;
    document.querySelectorAll('.lnk.quick').forEach((x,i)=>x.classList.toggle('on',i===0));
    document.querySelectorAll('#tab th.sortable').forEach(t=>{t.classList.remove('sorted');t.querySelector('.arw').textContent='▲';});
    renderRighe();
  };
  document.getElementById('bapri').onclick=()=>apriDoc(L.sel);
  document.getElementById('bdel').onclick=()=>{
    const d=DOCUMENTI.find(x=>x.n===L.sel); if(!d) return;
    if(d.scarico) return avviso(`<b>${d.n}</b> ha scaricato componenti dal magazzino: ripristina prima la giacenza dalle impostazioni.`);
    conferma(`Eliminare definitivamente <b>${d.n}</b>?`,'Elimina',()=>{
      audit('ELIMINAZIONE',d.tipo,d.n,JSON.stringify({cliente:d.cli,totale:eur(totaliDoc(d).tot)}),null);
      DOCUMENTI.splice(DOCUMENTI.indexOf(d),1); L.sel=null; render(); avviso('Documento eliminato.');});
  };
  const bt=document.getElementById('btrasf');
  if(bt) bt.onclick=()=>avviso(`Il preventivo ${L.sel} verrà trasformato in commessa, con l'origine riportata sul documento.`);
}

window.onerror=function(m,f,l,c,e){
  const v=document.getElementById('view');
  if(v) v.insertAdjacentHTML('afterbegin',
   `<div style="background:var(--alert-soft);border:1px solid var(--alert-line);color:var(--alert);border-radius:12px;padding:12px 16px;margin-bottom:14px">
    <b>Errore rilevato</b><div style="font-size:12px;margin-top:4px">${m}${l?' — riga '+l:''}</div></div>`);
  return false;
};

function conferma(testo,etichetta,azione){
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="finestra" style="width:470px"><h3>Conferma <button class="x">✕</button></h3>
    <div class="corpo">${testo}</div>
    <div class="piede"><button class="btn" data-no>Annulla</button>
      <button class="btn pri" data-si>${etichetta||'Conferma'}</button></div></div>`;
  document.body.appendChild(ov);
  const chiudi=()=>ov.remove();
  ov.querySelector('.x').onclick=chiudi; ov.querySelector('[data-no]').onclick=chiudi;

function renderCat(){
  let d=PRODOTTI.filter(p=>p.kind===C.kind);
  const g=document.getElementById('cg');
  d=d.filter(p=>{
    if(g&&g.selectedIndex>0&&p.g!==g.value) return false;
    if(C.cerca&&!(p.cod+' '+p.desc+' '+p.alt).toLowerCase().includes(C.cerca)) return false;
    for(const k in C.f){ if(C.f[k]&&!String(p[k]).toLowerCase().includes(C.f[k])) return false; }
    return true;
  });
  if(C.sort.c!==null){
    const k=COLC[C.sort.c][0], num=COLC[C.sort.c][2]==='num';
    d.sort((a,b)=>num?(a[k]-b[k])*C.sort.d:String(a[k]).localeCompare(String(b[k]),'it',{numeric:true})*C.sort.d);
  }
  document.getElementById('crighe').innerHTML = d.length? d.map(p=>
    `<tr data-cod="${p.cod}" class="${C.sel===p.cod?'sel':''}">
      <td class="mono">${p.cod}</td><td>${p.desc}</td><td>${p.g}</td><td>${p.sg}</td>
      <td>${p.um}</td><td class="num">${p.tipo==='tabella'?'<span class="tag">a tabella</span>':eur(p.prezzo)}</td></tr>`).join('')
    : `<tr><td class="vuoto" colspan="6">Nessun elemento con questi filtri</td></tr>`;
  document.getElementById('cconta').textContent=`${d.length} di ${PRODOTTI.filter(p=>p.kind===C.kind).length}`;
  document.querySelectorAll('#crighe tr[data-cod]').forEach(tr=>{
    tr.onclick=()=>{C.sel=tr.dataset.cod;renderCat();};
    tr.ondblclick=()=>apriScheda(tr.dataset.cod);
  });
  const s=!!C.sel;
  ['cmod','cdel'].forEach(id=>document.getElementById(id).disabled=!s);
  document.getElementById('cselinfo').innerHTML=s?`Selezionato <b>${C.sel}</b>`:'Nessuna riga selezionata';
}

function bindCatalogo(){
  renderCat();
  document.querySelectorAll('#ctab th.sortable').forEach(th=>th.onclick=()=>{
    const c=+th.dataset.c;
    C.sort=(C.sort.c===c)?{c,d:-C.sort.d}:{c,d:1};
    document.querySelectorAll('#ctab th.sortable').forEach(t=>{t.classList.remove('sorted');t.querySelector('.arw').textContent='▲';});
    th.classList.add('sorted');th.querySelector('.arw').textContent=C.sort.d===1?'▲':'▼';
    renderCat();
  });
  document.querySelectorAll('#ctab tr.filtri input').forEach(i=>i.oninput=()=>{C.f[i.dataset.f]=i.value.trim().toLowerCase();renderCat();});
  document.getElementById('ccerca').oninput=e=>{C.cerca=e.target.value.toLowerCase();renderCat();};
  document.getElementById('cg').onchange=renderCat;
  document.getElementById('cazzera').onclick=()=>{
    C.f={};C.cerca='';C.sort={c:null,d:1};
    document.querySelectorAll('#ctab tr.filtri input').forEach(i=>i.value='');
    document.getElementById('ccerca').value='';document.getElementById('cg').selectedIndex=0;
    document.querySelectorAll('#ctab th.sortable').forEach(t=>{t.classList.remove('sorted');t.querySelector('.arw').textContent='▲';});
    renderCat();
  };
  document.getElementById('cmod').onclick=()=>apriScheda(C.sel);
  document.getElementById('cadd').onclick=()=>apriScheda(null);
  document.getElementById('cdel').onclick=()=>avviso(`Eliminazione di <b>${C.sel}</b>: il programma chiederà conferma e rifiuterà se l'articolo è usato in documenti esistenti.`);
  document.getElementById('cstampa').onclick=()=>avviso('Stampa dell\u2019elenco filtrato, con le colonne attualmente visibili.');
}

function bloccoVendita(){
  const b=document.getElementById('blocco'); if(!b) return;
  if(P.tipo==='pezzo'){
    b.innerHTML=`<table style="margin-top:4px"><thead><tr><th>Voce</th><th class="r" style="width:180px">Prezzo di listino</th></tr></thead>
      <tbody><tr><td>Prezzo unitario a pezzo</td><td class="num"><input class="num" id="p_prezzo" value="${P.prezzo}" style="height:31px"></td></tr></tbody></table>`;
    document.getElementById('p_prezzo').oninput=e=>{P.prezzo=+e.target.value||0;};
    return;
  }
  if(P.tipo==='tabella'){ tabellaPrezzi(); return; }
  const eredita = P.kind==='acc' && P.qminArt;
  b.innerHTML=`
    <div class="form f2" style="margin-bottom:${P.kind==='acc'?'8px':'14px'}">
      <label class="f"><span>Quantità minima fatturabile</span>
        <input class="num" id="p_qmin" value="${eredita?'':P.qmin}" ${eredita?'disabled placeholder="dall\u2019articolo"':''}></label>
      <label class="f"><span>Prezzo di listino (per ${P.um})</span><input class="num" id="p_prezzo" value="${P.prezzo}"></label>
    </div>
    ${P.kind==='acc'?`<label class="misrow" style="border:0;padding:0 0 14px;cursor:pointer">
      <input type="checkbox" id="p_qminart" ${P.qminArt?'checked':''}>
      <span style="font-size:13px">Quantità minima da articolo</span>
      <span style="font-size:11.5px;color:var(--muted);margin-left:4px">segue il minimo del prodotto a cui l\u2019accessorio è abbinato</span>
    </label>`:''}
    <div style="font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px">Misure da abilitare</div>
    ${P.mis.map((m,i)=>`<div class="misrow ${m.on?'':'off'}" data-i="${i}">
      <input type="checkbox" ${m.on?'checked':''} data-chk="${i}">
      <span class="lab">Misura ${i+1}</span>
      <input type="text" data-nome="${i}" value="${m.n}" placeholder="nome mostrato in commessa (es. Larghezza)" ${m.on?'':'disabled'}>
    </div>`).join('')}
    <label class="f" style="margin-top:14px"><span>Formula per il calcolo della quantità</span>
      <input class="mono" id="p_formula" value="${P.formula}" placeholder="es. (misura1*misura2)/1000000"></label>
    <div class="prova" id="provaf"></div>`;

  document.querySelectorAll('[data-chk]').forEach(c=>c.onchange=e=>{
    const i=+e.target.dataset.chk; P.mis[i].on=e.target.checked; bloccoVendita();
  });
  document.querySelectorAll('[data-nome]').forEach(n=>n.oninput=e=>{P.mis[+e.target.dataset.nome].n=e.target.value;});
  const qm=document.getElementById('p_qmin'); if(qm&&!qm.disabled) qm.oninput=e=>{P.qmin=+e.target.value||0;provaFormula();};
  const qa=document.getElementById('p_qminart');
  if(qa) qa.onchange=e=>{P.qminArt=e.target.checked;bloccoVendita();};
  document.getElementById('p_prezzo').oninput=e=>{P.prezzo=+e.target.value||0;provaFormula();};
  document.getElementById('p_formula').oninput=e=>{P.formula=e.target.value;provaFormula();};
  provaFormula();
}

function provaFormula(){
  const box=document.getElementById('provaf'); if(!box) return;
  const campione=[1000,1200,300];
  const attive=P.mis.map((m,i)=>m.on?{i,n:m.n||('Misura '+(i+1)),v:campione[i]}:null).filter(Boolean);
  let q=null,errore=null;
  try{
    let f=P.formula||'';
    if(!f.trim()) errore='Formula non ancora inserita';
    else{
      const expr=f.replace(/misura([123])/g,(_,d)=>String(campione[+d-1]));
      if(/[^0-9+\-*/(). ]/.test(expr)) throw new Error('caratteri non ammessi');
      q=Function('"use strict";return ('+expr+')')();
      if(!isFinite(q)) throw new Error('risultato non valido');
    }
  }catch(e){ errore='Formula non valida: '+e.message; }
  const eredita = P.kind==='acc' && P.qminArt;
  const minEs = eredita?1.5:(P.qmin||0);
  const qf=q===null?null:Math.max(q,minEs);
  box.innerHTML=`<div style="font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600">Prova con misure di esempio</div>
    <div class="rr"><span>${attive.length?attive.map(a=>`${a.n} ${a.v} mm`).join(' · '):'nessuna misura abilitata'}</span></div>
    ${errore?`<div class="rr err">${errore}</div>`:`
    <div class="rr"><span>Quantità calcolata</span><b>${q.toLocaleString('it-IT',{maximumFractionDigits:4})} ${P.um.toLowerCase()}</b></div>
    <div class="rr"><span>Quantità fatturata ${eredita?'(minimo dall\u2019articolo — esempio 1,50)':'(minimo '+(P.qmin||0)+')'}</span><b ${qf>q?'style="color:var(--alert)"':''}>${qf.toLocaleString('it-IT',{maximumFractionDigits:4})} ${P.um.toLowerCase()}</b></div>
    <div class="rr"><span>Importo con listino ${eur(P.prezzo)}</span><b>${eur(qf*P.prezzo)}</b></div>
    ${eredita?`<div class="rr" style="color:var(--muted);font-size:12px"><span>Su una zanzariera a catena (min. 1,50) fattura 1,50 · su una laterale 50 (min. 2,00) fattura 2,00</span></div>`:''}`}`;
}

function tabellaPrezzi(){
  const b=document.getElementById('blocco'); if(!b) return;
  if(!P.tab) P.tab={righe:[600,900,1200,1500],col:[800,1200,1600,2000],pr:{}};
  const T=P.tab;
  b.innerHTML=`
    <div style="display:flex;gap:9px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
      <span style="font-size:12.5px;color:var(--muted)">Righe = ${P.mis[0].n||'Misura 1'} · Colonne = ${P.mis[1].n||'Misura 2'} · si applica il prezzo della prima casella con misura maggiore o uguale</span>
      <span style="margin-left:auto"></span>
      <button class="btn sm" id="tar">+ Riga</button><button class="btn sm" id="tac">+ Colonna</button>
    </div>
    <div style="overflow:auto"><table id="tabpr"><thead><tr>
      <th style="min-width:112px;background:var(--accent-soft)">${P.mis[0].n||'M1'} \\ ${P.mis[1].n||'M2'}</th>
      ${T.col.map((c,j)=>`<th class="r" style="min-width:104px">
        <input class="num" data-col="${j}" value="${c}" style="height:26px;width:64px;font-size:12px">
        <button data-dc="${j}" style="border:0;background:none;color:var(--alert);cursor:pointer">✕</button></th>`).join('')}
    </tr></thead><tbody>

        <th style="text-align:left;position:static">
          <input class="num" data-riga="${i}" value="${r}" style="height:26px;width:64px;font-size:12px">
          <button data-dr="${i}" style="border:0;background:none;color:var(--alert);cursor:pointer">✕</button></th>
        ${T.col.map((c,j)=>`<td class="num"><input class="num" data-cell="${i}|${j}"
          value="${T.pr[i+'|'+j]!==undefined?T.pr[i+'|'+j].toLocaleString('it-IT',{minimumFractionDigits:2}):''}"
          placeholder="—" style="height:27px;width:88px"></td>`).join('')}
      </tr>`).join('')}
    </tbody></table></div>
    <div class="prova" id="provat"></div>`;

  document.querySelectorAll('[data-col]').forEach(i=>i.onchange=e=>{T.col[+e.target.dataset.col]=+e.target.value||0;tabellaPrezzi();});
  document.querySelectorAll('[data-riga]').forEach(i=>i.onchange=e=>{T.righe[+e.target.dataset.riga]=+e.target.value||0;tabellaPrezzi();});
  document.querySelectorAll('[data-cell]').forEach(i=>i.onchange=e=>{
    const k=e.target.dataset.cell, v=e.target.value.trim();
    if(v==='') delete T.pr[k]; else {const n=numIt(v); if(!isNaN(n)) T.pr[k]=n;}
    tabellaPrezzi();
  });
  document.querySelectorAll('[data-dc]').forEach(x=>x.onclick=e=>{
    const j=+e.target.dataset.dc; T.col.splice(j,1);
    const np={}; Object.entries(T.pr).forEach(([k,v])=>{const [a,c]=k.split('|').map(Number);
      if(c===j)return; np[a+'|'+(c>j?c-1:c)]=v;}); T.pr=np; tabellaPrezzi();
  });
  document.querySelectorAll('[data-dr]').forEach(x=>x.onclick=e=>{
    const i=+e.target.dataset.dr; T.righe.splice(i,1);
    const np={}; Object.entries(T.pr).forEach(([k,v])=>{const [r,c]=k.split('|').map(Number);
      if(r===i)return; np[(r>i?r-1:r)+'|'+c]=v;}); T.pr=np; tabellaPrezzi();
  });
  document.getElementById('tar').onclick=()=>{T.righe.push((T.righe[T.righe.length-1]||0)+300);tabellaPrezzi();};
  document.getElementById('tac').onclick=()=>{T.col.push((T.col[T.col.length-1]||0)+400);tabellaPrezzi();};
  provaTabella();
}

function cercaInTabella(m1,m2){
  const T=P.tab;
  const i=T.righe.findIndex(r=>m1<=r), j=T.col.findIndex(c=>m2<=c);
  if(i<0||j<0) return {fuori:true};
  return {i,j,prezzo:T.pr[i+'|'+j]};
}

function provaTabella(){
  const box=document.getElementById('provat'); if(!box) return;

function salvaProdotto(){
  P.cod=(document.getElementById('p_cod').value||'').trim();
  P.desc=(document.getElementById('p_desc').value||'').trim();
  P.alt=(document.getElementById('p_alt').value||'').trim();
  if(!P.cod)  return avviso('<b>Codice obbligatorio</b> — inserisci il codice del prodotto prima di salvare.');
  if(!P.desc) return avviso('<b>Descrizione obbligatoria</b> — inserisci la descrizione prima di salvare.');
  const i=PRODOTTI.findIndex(p=>p.cod===P.cod);
  const nuovo=P.nuovo;
  if(nuovo && i>=0) return avviso(`Esiste già un prodotto con codice <b>${P.cod}</b>. Usa un codice diverso.`);
  delete P.nuovo;
  if(i>=0) PRODOTTI[i]=P; else PRODOTTI.push(P);
  const k=P.kind, cod=P.cod; P=null;
  voce=k==='art'?'articoli':'accessori'; render(); C.sel=cod; renderCat();
  avviso(`Prodotto <b>${cod}</b> ${nuovo?'aggiunto':'aggiornato'}.`);
}

        <input id="ngspec" placeholder="Nome nuovo gruppo…" style="font:inherit;font-size:12.5px;padding:6px 10px;border:1px solid var(--line-strong);border-radius:8px;width:100%;margin-bottom:7px">
        <button class="btn sm" id="addgspec" style="width:100%">+ Aggiungi gruppo</button>

    </div>
    <div>
      ${!l?'<div class="vuoto">Nessun gruppo di specifiche</div>':`
      <div class="toolbar"><b style="font-size:14px">${l.nome}</b>
        <span class="mono" style="color:var(--faint);font-size:12px">${l.id}</span>
        <span class="tag ${uso.length?'ac':''}">${uso.length} prodotti</span>
        <button class="btn sm" id="delgspec" style="margin-left:auto">Elimina gruppo</button>
      </div>
      <table><thead><tr><th>Voce</th><th class="r" style="width:210px">Maggiorazione generale</th><th style="width:60px"></th></tr></thead>
      <tbody>${l.valori.map((v,i)=>`<tr>
        <td><input data-vv="${i}" value="${v.v}" style="font:inherit;font-size:12.5px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;width:100%"></td>

        <tr><td><input id="nv" placeholder="Nuova voce…" style="font:inherit;font-size:12.5px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;width:100%"></td>
        <td class="num"><input class="num" id="nm" placeholder="magg." style="height:29px;width:120px"></td>
        <td><button class="btn sm" id="addv">+</button></td></tr>
      </tbody></table>
      <div class="in" style="border-top:1px solid var(--line);color:var(--muted);font-size:12px">
        La maggiorazione si somma al listino e vale per tutti i prodotti che usano questo gruppo, tranne quelli con un prezzo netto impostato nella scheda prodotto.
      </div>`}
    </div>
  </div></div>`;
}

function bindSpec(){
  document.querySelectorAll('.libitem').forEach(d=>d.onclick=()=>{libSel=d.dataset.l;render();});
  const l=LIB.find(x=>x.id===libSel);
  const tocca=()=>{dirtySpec=true;render();};

  document.getElementById('addgspec').onclick=()=>{
    const n=document.getElementById('ngspec').value.trim();
    if(!n) return;
    if(LIB.some(x=>x.nome.toLowerCase()===n.toLowerCase())) return avviso('Esiste già un gruppo di specifiche con questo nome.');
    const id=n.toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,14);
    LIB.push({id:id||('SPEC-'+(LIB.length+1)),nome:n,valori:[]});
    libSel=LIB[LIB.length-1].id; tocca();
  };
  if(!l) return;

  document.getElementById('delgspec').onclick=()=>{
    const u=usoSpec(l.id);
    if(u.length) return avviso(`Impossibile eliminare <b>${l.nome}</b>: è usato da ${u.length} prodotti (${u.map(p=>p.cod).join(', ')}). Rimuovi prima la specifica da quei prodotti.`);
    LIB.splice(LIB.findIndex(x=>x.id===l.id),1);
    libSel=LIB.length?LIB[0].id:''; tocca(); avviso('Gruppo di specifiche eliminato.');
  };
  document.querySelectorAll('[data-vv]').forEach(i=>i.onchange=e=>{l.valori[+e.target.dataset.vv].v=e.target.value.trim();tocca();});
  document.querySelectorAll('[data-m]').forEach(i=>i.onchange=e=>{
    const v=e.target.value.trim(); l.valori[+e.target.dataset.m].m = v===''?0:(isNaN(numIt(v))?0:numIt(v)); tocca();});
  document.querySelectorAll('[data-dv]').forEach(b=>b.onclick=e=>{l.valori.splice(+e.target.dataset.dv,1);tocca();});
  document.getElementById('addv').onclick=()=>{
    const v=document.getElementById('nv').value.trim(); if(!v) return;
    const m=document.getElementById('nm').value.trim();
    l.valori.push({v,m:m===''?0:(isNaN(numIt(m))?0:numIt(m))}); tocca();
  };
  document.getElementById('nv').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('addv').click();});
  const s=document.getElementById('specsalva');
  if(s) s.onclick=()=>{dirtySpec=false;render();avviso('Specifiche salvate.');};
}


/* ---------- varia listini ---------- */
let V={g:'',sg:'',perc:0,verso:1,arr:'2'}, ultimaVar=null;

function prodottiVar(){
  return PRODOTTI.filter(p=>(!V.g||p.g===V.g)&&(!V.sg||p.sg===V.sg));
}
function arrotonda(n){
  if(V.arr==='0.5') return Math.round(n*2)/2;
  if(V.arr==='1')   return Math.round(n);
  return Math.round(n*100)/100;
}
function nuovoPrezzo(p){ return arrotonda(p*(1+V.verso*V.perc/100)); }

function vistaVaria(){
  const sel=prodottiVar();
  const attiva=V.perc>0;
  return `
  <div class="head"><div><h1>Varia listini</h1>
  <p class="sub">Aumento o diminuzione percentuale sui listini di un intero gruppo o sottogruppo</p></div>
  <div class="acts">
    ${ultimaVar?'<button class="btn" id="vundo">Annulla ultima variazione</button>':''}
    <button class="btn pri" id="vapplica" ${attiva&&sel.length?'':'disabled'}>Applica variazione</button>
  </div></div>

  <div class="card"><h2>Selezione</h2><div class="in form">
    <div class="form f3">
      <label class="f"><span>Gruppo</span><select id="v_g">
        <option value="">Tutti i gruppi</option>
        ${Object.keys(GRUPPI).map(g=>`<option ${V.g===g?'selected':''}>${g}</option>`).join('')}</select></label>
      <label class="f"><span>Sottogruppo</span><select id="v_sg" ${V.g?'':'disabled'}>
        <option value="">${V.g?'Tutti i sottogruppi':'scegli prima il gruppo'}</option>
        ${(GRUPPI[V.g]||[]).map(s=>`<option ${V.sg===s?'selected':''}>${s}</option>`).join('')}</select></label>
      <label class="f"><span>Arrotondamento</span><select id="v_arr">
        <option value="2" ${V.arr==='2'?'selected':''}>Ai centesimi</option>
        <option value="0.5" ${V.arr==='0.5'?'selected':''}>Ai 50 centesimi</option>
        <option value="1" ${V.arr==='1'?'selected':''}>All'euro</option></select></label>
    </div>
    <div class="form f3" style="margin-top:14px;align-items:end">
      <label class="f"><span>Variazione</span><select id="v_verso">
        <option value="1" ${V.verso===1?'selected':''}>Aumento</option>
        <option value="-1" ${V.verso===-1?'selected':''}>Diminuzione</option></select></label>
      <label class="f"><span>Percentuale</span><input class="num" id="v_perc" value="${V.perc||''}" placeholder="es. 5,00"></label>
      <div style="padding-bottom:2px"><span class="pill">${sel.length} prodotti interessati</span></div>
    </div>
  </div></div>

  <div class="card">
    <h2>Anteprima ${attiva?`<span class="tag ${V.verso===1?'wa':'ac'}">${V.verso===1?'+':'−'}${V.perc.toLocaleString('it-IT')} %</span>`:''}</h2>
    <div class="tabwrap">
    <table><thead><tr><th>Codice</th><th>Descrizione</th><th>Gruppo</th><th>Sottogruppo</th>
      <th class="r">Prezzo attuale</th><th class="r">Nuovo prezzo</th><th class="r">Differenza</th></tr></thead>
      <tbody>${sel.length?sel.map(p=>{
        if(p.tipo==='tabella'){
          const c=Object.keys(p.tab?p.tab.pr:{}).length;
          return `<tr><td class="mono">${p.cod}</td><td>${p.desc}</td><td>${p.g}</td><td>${p.sg}</td>
            <td class="num" colspan="3" style="text-align:right;color:var(--muted)">prezzo a tabella — ${c} caselle, variate tutte</td></tr>`;
        }
        const n=nuovoPrezzo(p.prezzo), d=n-p.prezzo;
        return `<tr><td class="mono">${p.cod}</td><td>${p.desc}</td><td>${p.g}</td><td>${p.sg}</td>
          <td class="num">${eur(p.prezzo)}</td>
          <td class="num" ${attiva?'style="font-weight:600"':''}>${eur(n)}</td>
          <td class="num" style="color:${d>0?'var(--alert)':(d<0?'var(--ok)':'var(--muted)')}">${d>0?'+':''}${eur(d)}</td></tr>`;
      }).join('')
      :`<tr><td class="vuoto" colspan="7">Nessun prodotto con questa selezione</td></tr>`}</tbody></table>
    </div>
    <div class="in" style="border-top:1px solid var(--line);color:var(--muted);font-size:12px">
      La variazione modifica il prezzo di listino dei prodotti selezionati, comprese tutte le caselle dei prezzi a tabella.
      Per cambiare il prezzo di un solo articolo, aprilo dalla schermata <b>Articoli</b>.
    </div>
  </div>`;
}

function bindVaria(){
  const R=()=>render();
  document.getElementById('v_g').onchange=e=>{V.g=e.target.value;V.sg='';R();};
  document.getElementById('v_sg').onchange=e=>{V.sg=e.target.value;R();};
  document.getElementById('v_arr').onchange=e=>{V.arr=e.target.value;R();};
  document.getElementById('v_verso').onchange=e=>{V.verso=+e.target.value;R();};
  const pi=document.getElementById('v_perc');
  pi.oninput=e=>{const n=numIt(e.target.value); V.perc=isNaN(n)?0:n;
    const sel=prodottiVar();
    document.getElementById('vapplica').disabled=!(V.perc>0&&sel.length);};
  pi.onchange=R;
  document.getElementById('vapplica').onclick=()=>{
    const sel=prodottiVar();
    ultimaVar={dati:JSON.parse(JSON.stringify(PRODOTTI)),n:sel.length,perc:V.perc,verso:V.verso,
      dove:(V.g||'tutti i gruppi')+(V.sg?' › '+V.sg:'')};
    sel.forEach(p=>{
      if(p.tipo==='tabella'&&p.tab){ Object.keys(p.tab.pr).forEach(k=>p.tab.pr[k]=nuovoPrezzo(p.tab.pr[k])); }
      else p.prezzo=nuovoPrezzo(p.prezzo);
    });
    V.perc=0; R();
    avviso(`Variazione applicata a <b>${ultimaVar.n} prodotti</b> (${ultimaVar.dove}): ${ultimaVar.verso===1?'+':'−'}${ultimaVar.perc.toLocaleString('it-IT')} %. Puoi ancora annullarla.`);
  };
  const u=document.getElementById('vundo');
  if(u) u.onclick=()=>{
    PRODOTTI.length=0; ultimaVar.dati.forEach(p=>PRODOTTI.push(p));
    const n=ultimaVar.n; ultimaVar=null; R();
    avviso(`Variazione annullata: ripristinati i prezzi precedenti di ${n} prodotti.`);
  };
}

 commesse:[{k:'n',l:'Numero',w:105},{k:'cli',l:'Cliente',w:215},{k:'cant',l:'Cantiere',w:180},
   {k:'data',l:'Data',w:95},{k:'lav',l:'Lavorazione',w:105},{k:'cons',l:'Consegna',w:100},
   {k:'stato',l:'Stato',w:145},{k:'ag',l:'Agente',w:105},{k:'tecnico',l:'Tecnico',w:120},
   {k:'pezzi',l:'Pezzi',w:75,num:1},{k:'tot',l:'Totale',w:110,num:1},
   {k:'noteInt',l:'Note interne',w:210},{k:'noteCons',l:'Note consegna',w:210},
   {k:'fornitore',l:'Fornitore',w:190},{k:'ordine',l:'Ordine inviato',w:150}],
 preventivi:[{k:'n',l:'Numero',w:105},{k:'cli',l:'Cliente',w:215},{k:'cant',l:'Cantiere',w:180},
   {k:'data',l:'Data',w:95},{k:'stato',l:'Stato',w:150},{k:'ag',l:'Agente',w:105},
   {k:'tot',l:'Totale',w:110,num:1},{k:'noteInt',l:'Note interne',w:210},{k:'noteCons',l:'Note consegna',w:210}]
};
const CFG={
 commesse:{on:['n','cli','cant','data','cons','stato','ag','tot'],w:{}},
 preventivi:{on:['n','cli','cant','data','stato','ag','tot'],w:{}},
 riepilogo:{on:['pos','cod','desc','misure','spec','pezzi','qta','prezzo','acc','tot'],w:{}}
};
function colsAttive(tipo){
  const def=COLDEF[tipo]||RIEPDEF;
  return CFG[tipo].on.map(k=>{const c=def.find(x=>x.k===k);return c?{...c,w:CFG[tipo].w[k]||c.w}:null;}).filter(Boolean);
}
function pannelloColonne(tipo,idp){
  const def=COLDEF[tipo]||RIEPDEF;
  return `<div class="colcfg" id="${idp}" style="display:none">
    <div style="font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:9px">
      Colonne visibili e larghezza (px)</div>
    <div class="griglia">${def.map(c=>`<label class="voce">
      <input type="checkbox" data-col="${c.k}" ${CFG[tipo].on.includes(c.k)?'checked':''}>
      <span>${c.l}</span>
      <input class="w" data-wid="${c.k}" value="${CFG[tipo].w[c.k]||c.w}"></label>`).join('')}</div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn sm pri" data-cfgsalva="${tipo}">Salva configurazione</button>
      <button class="btn sm" data-cfgreset="${tipo}">Ripristina predefinite</button>
      <span style="font-size:11.5px;color:var(--muted);margin-left:6px">Le larghezze si regolano anche trascinando il bordo dell'intestazione</span>
    </div></div>`;
}
function bindColonne(tipo,idp,dopo){
  const p=document.getElementById(idp); if(!p) return;
  p.querySelectorAll('[data-col]').forEach(c=>c.onchange=e=>{
    const k=e.target.dataset.col;
    if(e.target.checked){ if(!CFG[tipo].on.includes(k)) CFG[tipo].on.push(k); }
    else CFG[tipo].on=CFG[tipo].on.filter(x=>x!==k);
    dopo();
  });
  p.querySelectorAll('[data-wid]').forEach(i=>i.onchange=e=>{
    CFG[tipo].w[e.target.dataset.wid]=Math.max(50,parseInt(e.target.value)||100); dopo();});
  p.querySelector('[data-cfgsalva]').onclick=()=>{p.style.display='none';avviso('Configurazione delle colonne salvata per questo utente.');};
  p.querySelector('[data-cfgreset]').onclick=()=>{
    CFG[tipo].w={};
    CFG[tipo].on=(COLDEF[tipo]||RIEPDEF).slice(0,tipo==='riepilogo'?10:8).map(c=>c.k);
    dopo();
  };
}
function abilitaRidimensiona(tabId,tipo,dopo){
  document.querySelectorAll(`#${tabId} th .res`).forEach(r=>{
    r.onmousedown=e=>{
      e.preventDefault(); e.stopPropagation();
      const th=r.parentElement, k=th.dataset.k, x0=e.clientX, w0=th.offsetWidth;
      const mv=ev=>{const w=Math.max(50,w0+ev.clientX-x0); CFG[tipo].w[k]=w;
        const cg=document.querySelector(`#${tabId} colgroup col[data-k="${k}"]`); if(cg) cg.style.width=w+'px';};
      const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);dopo&&dopo();};
      document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
    };
  });
}

 {k:'misure',l:'Misure',w:200},{k:'mis1',l:'Misura 1',w:110},{k:'mis2',l:'Misura 2',w:110},{k:'mis3',l:'Misura 3',w:110},
 {k:'spec',l:'Specifiche',w:230},{k:'acc',l:'Accessori',w:250},{k:'pezzi',l:'Pezzi',w:70,num:1},
 {k:'qta',l:'Quantità',w:105,num:1},{k:'prezzo',l:'Prezzo',w:100,num:1},{k:'sconto',l:'Sconto',w:80,num:1},
 {k:'accTot',l:'Tot. accessori',w:110,num:1},{k:'tot',l:'Totale',w:110,num:1},{k:'note',l:'Note',w:200}];

function bindMenuStampa(id,contesto){
  const d=document.getElementById(id); if(!d) return;
  d.querySelector('.btn').onclick=e=>{e.stopPropagation();d.classList.toggle('open');};
  document.addEventListener('click',()=>d.classList.remove('open'),{once:true});
  d.querySelectorAll('[data-stampa]').forEach(b=>b.onclick=()=>{
    d.classList.remove('open');
    const v=b.dataset.stampa;
    if(v==='gestisci'){sez='impostazioni';voce='stampe';render();return;}
    const m=MODELLI.find(x=>x.id===v);
    if(m){ if(!D&&L.sel) apriDoc(L.sel); setTimeout(()=>anteprimaStampa(m.id,contesto),0); return; }
    if(v==='etich'){ if(!D&&L.sel) apriDoc(L.sel); return setTimeout(stampaEtichette,0); }
    if(v==='nota'){ if(!D&&L.sel) apriDoc(L.sel); return setTimeout(stampaDistinta,0); }
    avviso(`Stampa della nota taglio${contesto?' — '+contesto:''}: da configurare.`);
  });
}

function cercaCliente(dopo){
  const ov=document.createElement('div');
  ov.className='overlay'; ov.id='ovcli';
  ov.innerHTML=`<div class="finestra"><h3>Seleziona cliente <button class="x">✕</button></h3>
    <div class="corpo">
      <input id="cliq" placeholder="Cerca per ragione sociale, città o partita IVA…"

      <div id="clilista"></div>
    </div>
    <div class="piede"><button class="btn" id="cliann">Annulla</button>
      <button class="btn pri" id="clinuovo">Nuovo cliente</button></div></div>`;
  document.body.appendChild(ov);
  const lista=()=>{
    const q=(document.getElementById('cliq').value||'').toLowerCase();
    const d=ANAG.clienti.dati.filter(c=>!q||(c.nome+' '+c.citta+' '+(c.piva||'')+' '+c.cod).toLowerCase().includes(q));
    document.getElementById('clilista').innerHTML=d.length?d.map(c=>
      `<div class="cliriga" data-c="${c.cod}"><div><b>${c.nome}</b>
        <span>${c.cod} · ${c.citta||''} ${c.piva?'· '+c.piva:''}</span></div>
        <div class="dx">${c.listino||''}<br>sconto ${c.sconto||0}%</div></div>`).join('')
      :'<div class="vuoto">Nessun cliente trovato. Codificalo prima in Anagrafica.</div>';
    document.querySelectorAll('#clilista .cliriga').forEach(r=>r.onclick=()=>{
      const c=ANAG.clienti.dati.find(x=>x.cod===r.dataset.c);
      ov.remove(); dopo(c);
    });
  };
  document.getElementById('cliq').oninput=lista;
  ov.querySelector('.x').onclick=()=>ov.remove();
  document.getElementById('cliann').onclick=()=>ov.remove();
  document.getElementById('clinuovo').onclick=()=>{ov.remove();sez='anagrafica';voce='clienti';AS=null;render();
    setTimeout(()=>avviso('Codifica il cliente e poi torna sul documento.'),0);};
  lista(); document.getElementById('cliq').focus();
}

/* ---------- anteprima di stampa ---------- */
function anteprimaStampa(idModello,ctx){
  const m=MODELLI.find(x=>x.id===idModello)||MODELLI[0];
  const ov=document.createElement('div');
  ov.className='overlay'; ov.id='ovstampa';
  ov.innerHTML=`<div class="stampa-wrap">
    <div class="stampa-barra"><b>Anteprima di stampa</b>
      <select id="stmod">${MODELLI.map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${x.nome}</option>`).join('')}</select>
      <div class="dx">
        <button class="btn" id="stpdf">Salva PDF</button>
        <button class="btn pri" id="stprint">Stampa</button>
        <button class="btn" id="stclose">Chiudi</button>
      </div></div>
    <div class="stampa-area"><div class="foglio" id="foglio">${foglioHTML(m,ctx)}</div></div></div>`;
  document.body.appendChild(ov);
  document.getElementById('stclose').onclick=()=>ov.remove();
  document.getElementById('stmod').onchange=e=>{
    const n=MODELLI.find(x=>x.id===e.target.value);
    document.getElementById('foglio').innerHTML=foglioHTML(n,ctx);
  };
  const stampa=()=>{ try{ window.print(); }catch(e){

function hashFinto(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;
  return 'sim$'+h.toString(16).padStart(8,'0')+'$'+String(s.length);}

function permessiUtente(u){
  const r=RUOLI.find(x=>x.k===u.ruolo)||{perm:[]};
  const base=r.perm.includes('*')?tuttiPermessi():r.perm.slice();
  const set=new Set(base);
  Object.entries(u.extra||{}).forEach(([k,v])=>{ v?set.add(k):set.delete(k); });
  return set;
}
function can(k){ return permessiUtente(UTENTE).has(k); }
/* controllo lato "server": ogni azione sensibile passa di qui */
function guard(k,azione,etichetta){
  if(!can(k)){
    audit('NEGATO','sicurezza',etichetta||k,null,null,'Permesso mancante: '+k);
    avviso(`<b>Operazione non consentita</b><br>Il tuo profilo (${(RUOLI.find(r=>r.k===UTENTE.ruolo)||{}).n}) non ha il permesso <span class="mono">${k}</span>.`);
    return false;
  }
  return azione?azione():true;
}

let AUDIT=[];
function audit(op,modulo,entita,prima,dopo,note){
  AUDIT.unshift({id:AUDIT.length+1,q:new Date(),utente:UTENTE.user,nome:UTENTE.nome,op,modulo,entita,
    prima:prima===null||prima===undefined?'':(typeof prima==='object'?JSON.stringify(prima):String(prima)),
    dopo:dopo===null||dopo===undefined?'':(typeof dopo==='object'?JSON.stringify(dopo):String(dopo)),note:note||''});
}

    render();};
  document.getElementById('u_del').onclick=()=>{

      audit('ELIMINAZIONE','utenti',u.user,JSON.stringify({nome:u.nome,ruolo:u.ruolo}),null);
      UTENTI.splice(UTENTI.indexOf(u),1); uSel=UTENTI[0].id; render();});};
  document.getElementById('u_reset').onclick=()=>{u.extra={};audit('MODIFICA','utenti',u.user,'permessi personalizzati','ripristinati al ruolo');render();};
  document.querySelectorAll('[data-perm]').forEach(c=>c.onchange=e=>{
    const k=e.target.dataset.perm;
    u.extra=u.extra||{}; u.extra[k]=e.target.checked;
    audit('MODIFICA','utenti',u.user,'permesso '+k,e.target.checked?'concesso':'revocato');
    render();});
  document.getElementById('unuovo').onclick=()=>{
    const id=Math.max(...UTENTI.map(x=>x.id))+1;
    UTENTI.push({id,user:'nuovo'+id,nome:'Nuovo utente',email:'',pw:hashFinto('temp'+id),ruolo:'LETTURA',extra:{},attivo:true});
    uSel=id; audit('CREAZIONE','utenti','nuovo'+id,null,'Nuovo utente'); render();};
}

const sbilancio=p=>arrotonda2(totRighe(p.righe,'dare')-totRighe(p.righe,'avere'));

function numeroPN(){ return PN.length?Math.max(...PN.map(p=>p.num))+1:1; }

/* scrittura automatica dalla fattura / documento */
function registraDocumento(d,tipo){
  const t=totaliDoc(d), cli=ANAG.clienti.dati.find(c=>c.nome===d.cli)||{};
  const iva=arrotonda2(t.iva), imponibile=arrotonda2(t.imponibile), tot=arrotonda2(t.tot);
  const p={id:Date.now(),num:numeroPN(),data:d.data,causale:'FTV',descr:`Fattura ${d.n} — ${d.cli}`,
    doc:d.n,cliente:d.cli,iva:{imponibile,aliquota:22,imposta:iva,tipo:'vendita'},bloccata:false,
    righe:[{conto:'20.05.001',dare:tot,avere:0,descr:'Credito verso '+d.cli},
           {conto:'40.05.001',dare:0,avere:imponibile,descr:'Ricavo commessa '+d.n},
           {conto:'30.10.001',dare:0,avere:iva,descr:'IVA a debito 22%'}]};
  PN.unshift(p);
  const cond=(cli.pag||'Rimessa diretta');
  const rate=cond.includes('30/60')?2:1;
  for(let i=0;i<rate;i++){
    const gg=cond.includes('30')?30*(i+1):0;
    const dt=new Date(); dt.setDate(dt.getDate()+gg);
    SCAD.push({id:Date.now()+i,doc:d.n,cliente:d.cli,rata:i+1,su:rate,
      data:`${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`,
      importo:arrotonda2(tot/rate),pagato:0,pn:p.num});
  }
  d.fatturato=true; d.pnNum=p.num;
  audit('CREAZIONE','contabilità','prima nota '+p.num,null,`Fattura ${d.n} · ${eur(tot)}`);
  return p;
}

function bindPrimaNota(){
  if(!can('contabilita.vedi')) return;
  if(pnAperta){
    const p=pnAperta, R=()=>render();
    document.getElementById('pn_data').onchange=e=>{p.data=itData(e.target.value);};
    document.getElementById('pn_caus').onchange=e=>{
      p.causale=e.target.value;
      const c=CAUSALI.find(x=>x.c===p.causale);
      if(c&&c.dare&&p.righe.length===2&&!p.righe[0].conto){p.righe[0].conto=c.dare;p.righe[1].conto=c.avere;}
      R();};
    document.getElementById('pn_descr').oninput=e=>p.descr=e.target.value;
    document.getElementById('pn_add').onclick=()=>{p.righe.push({conto:'',dare:0,avere:0,descr:''});R();};
    document.querySelectorAll('[data-rc]').forEach(s=>s.onchange=e=>{p.righe[+e.target.dataset.rc].conto=e.target.value;R();});
    document.querySelectorAll('[data-rd]').forEach(i=>i.onchange=e=>{p.righe[+e.target.dataset.rd].descr=e.target.value;});
    document.querySelectorAll('[data-rda]').forEach(i=>i.onchange=e=>{
      const r=p.righe[+e.target.dataset.rda]; r.dare=numIt(e.target.value)||0; if(r.dare) r.avere=0; R();});
    document.querySelectorAll('[data-rav]').forEach(i=>i.onchange=e=>{
      const r=p.righe[+e.target.dataset.rav]; r.avere=numIt(e.target.value)||0; if(r.avere) r.dare=0; R();});
    document.querySelectorAll('[data-rx]').forEach(b=>b.onclick=e=>{p.righe.splice(+e.target.dataset.rx,1);R();});
    document.getElementById('pnchiudi').onclick=()=>{pnAperta=null;render();};
    document.getElementById('pnsalva').onclick=()=>guard('contabilita.registra',()=>{
      if(sbilancio(p)!==0) return avviso('<b>Registrazione sbilanciata</b> — dare e avere devono coincidere.');
      if(p.righe.some(r=>!r.conto)) return avviso('<b>Conto mancante</b> su una riga.');
      if(!PN.find(x=>x.id===p.id)) PN.unshift(p);
      audit(p.nuova?'CREAZIONE':'MODIFICA','contabilità','prima nota '+p.num,null,p.descr+' · '+eur(totRighe(p.righe,'dare')));
      pnAperta=null; render(); avviso('Registrazione salvata.');
    },'prima nota');
    return;
  }
  document.querySelectorAll('[data-pn]').forEach(tr=>{
    tr.onclick=()=>{pnSel=+tr.dataset.pn;render();};
    tr.ondblclick=()=>{pnAperta=PN.find(x=>x.id===+tr.dataset.pn);render();};});
  document.getElementById('pnapri').onclick=()=>{pnAperta=PN.find(x=>x.id===pnSel);render();};
  document.getElementById('pndel').onclick=()=>guard('contabilita.registra',()=>{
    const p=PN.find(x=>x.id===pnSel); if(!p) return;
    conferma(`Eliminare la registrazione ${String(p.num).padStart(4,'0')}?`,'Elimina',()=>{
      audit('ELIMINAZIONE','contabilità','prima nota '+p.num,p.descr,null);
      PN.splice(PN.indexOf(p),1); pnSel=null; render();});
  },'prima nota');
  document.getElementById('pnnuova').onclick=()=>guard('contabilita.registra',()=>{
    pnAperta={id:Date.now(),num:numeroPN(),data:oggiOra().split(' ')[0],causale:'VAR',descr:'',doc:'',nuova:true,
      righe:[{conto:'',dare:0,avere:0,descr:''},{conto:'',dare:0,avere:0,descr:''}]};
    render();},'prima nota');
  document.getElementById('pnstampa').onclick=()=>avviso('Stampa del giornale di contabilità per il periodo selezionato.');
  document.getElementById('pnfatt').onclick=()=>{
    const da=DOCUMENTI.filter(d=>d.tipo==='commesse'&&!d.fatturato&&(d.voci||[]).length);
    if(!da.length) return avviso('Nessuna commessa da fatturare: crea prima una commessa con delle voci.');
    const ov=document.createElement('div'); ov.className='overlay';
    ov.innerHTML=`<div class="finestra"><h3>Genera scrittura da documento <button class="x">✕</button></h3>
      <div class="corpo"><div style="margin-bottom:10px;color:var(--muted);font-size:12.5px">
        Verranno create la fattura in prima nota e le relative scadenze.</div>
        ${da.map(d=>`<div class="cliriga" data-g="${d.n}"><div><b>${d.n} — ${d.cli||'senza cliente'}</b>
          <span>${(d.voci||[]).length} voci · ${d.data}</span></div>
          <div class="dx">${eur(totaliDoc(d).tot)}</div></div>`).join('')}</div>
      <div class="piede"><button class="btn" data-no>Annulla</button></div></div>`;
    document.body.appendChild(ov);
    ov.querySelector('.x').onclick=()=>ov.remove(); ov.querySelector('[data-no]').onclick=()=>ov.remove();
    ov.querySelectorAll('[data-g]').forEach(r=>r.onclick=()=>guard('contabilita.registra',()=>{

      avviso(`Creata la registrazione <b>${String(p.num).padStart(4,'0')}</b> e le scadenze del documento ${d.n}.`);

/* ---------- scadenzario ---------- */
function vistaScad(){
  const oggi=new Date();
  const stato=s=>{const r=s.importo-s.pagato;
    if(r<=0.005) return ['Saldata','ok'];
    const d=isoData(s.data)?new Date(isoData(s.data)):null;
    if(d&&d<oggi) return ['Scaduta','al'];
    return [s.pagato>0?'Parziale':'Aperta',s.pagato>0?'wa':''];};
  const tot=SCAD.reduce((t,s)=>t+(s.importo-s.pagato),0);
  return `<div class="head"><div><h1>Scadenzario</h1>
    <p class="sub">${SCAD.length} scadenze · ${eur(tot)} da incassare</p></div></div>
  <div class="card"><div class="tabwrap"><table>
